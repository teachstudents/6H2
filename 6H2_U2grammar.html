<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6H2 Grammar Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Nunito:wght@700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ffffff, #fef08a, #ffdab9);
            color: #1e1b4b;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Nunito', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        .btn-hover {
            transition: all 0.2s ease-in-out;
        }
        .btn-hover:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .timer-bar-container {
            width: 100%;
            height: 20px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4ade80, #3b82f6);
            transform-origin: left;
            transition: width 1s linear, background-color 0.5s ease;
        }

        .timer-warning {
            background: linear-gradient(90deg, #facc15, #ef4444) !important;
        }

        .clue-time { color: #1d4ed8; font-weight: 800; }
        .clue-verb { color: #7e22ce; font-weight: 800; }
        .clue-condition { color: #15803d; font-weight: 800; }
        .clue-degree { color: #0f766e; font-weight: 800; }

        /* Fixed gap width to prevent sentence shifting */
        .fixed-gap {
            display: inline-block;
            width: 140px;
            text-align: center;
            border-bottom: 3px solid rgba(0,0,0,0.4);
            padding: 0 8px;
            transition: all 0.2s;
        }

        .gap-blank {
            display: inline-block;
            width: 140px;
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            border: 2px dashed #4b5563;
            border-radius: 8px;
            padding: 2px 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: #000;
        }
        .gap-blank.filled {
            background: #4f46e5;
            border-color: #818cf8;
            border-style: solid;
            color: white;
            font-weight: bold;
        }
        .gap-blank.wrong {
            background: #ef4444;
            border-color: #fca5a5;
            animation: shake 0.4s;
        }
        .gap-blank.correct {
            background: #22c55e;
            border-color: #86efac;
        }

        .word-bank-btn {
            background: white;
            color: #1e1b4b;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .word-bank-btn.selected {
            ring: 4px;
            box-shadow: 0 0 0 4px #facc15;
            transform: scale(1.1);
        }

        /* Confetti Canvas */
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .badge-animation {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <canvas id="confetti"></canvas>

    <!-- MAIN MENU -->
    <div id="main-menu" class="w-full max-w-6xl flex flex-col items-center">
        <h1 class="text-5xl md:text-7xl font-black text-center mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-purple-700 drop-shadow-lg">
            6H2 Grammar Challenge
        </h1>
        <p class="text-3xl mb-10 text-gray-800">🎬 🍿 🎥 🌟 🏆</p>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full px-4">
            <!-- Categories will be injected here -->
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden w-full max-w-6xl flex-col items-center">
        
        <!-- Header -->
        <div class="w-full flex flex-col md:flex-row justify-between items-center mb-4 glass-panel p-4 rounded-2xl gap-4">

                <button onclick="returnToMenu()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl font-bold btn-hover shadow-md">

                <div class="text-xl font-bold bg-white border-2 border-indigo-200 px-4 py-2 rounded-xl text-indigo-900">Q: <span id="q-counter">1</span></div>
                <button id="check-gap-answers" onclick="checkGapFillAnswers()" class="bg-gradient-to-r from-green-500 to-blue-600 text-white font-black px-4 py-2 rounded-xl btn-hover shadow-md hidden">
                    Check Answers ✅
                </button>
            </div>
            
            <h2 id="category-title" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-700 to-blue-700 hidden lg:block">Category Name</h2>
        </div>

        <!-- Timer -->
        <div class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <!-- Matchup Area -->
        <div class="w-full grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 mt-4">

            <div class="glass-panel p-6 rounded-3xl flex flex-col items-center border-t-4 border-pink-500 relative">

            </div>

            <!-- VS -->

            </div>

            <!-- Boy Card -->
            <div class="glass-panel p-6 rounded-3xl flex flex-col items-center border-t-4 border-blue-500 relative">
                <!-- Clickable Score -->
                <button onclick="awardPoint('boy')" class="text-5xl md:text-6xl font-black text-purple-900 hover:text-blue-600 mb-2 transition-colors cursor-pointer drop-shadow-md" title="Award Point to Boys">
                    <span id="boy-score">0</span>
                </button>
                <div class="text-6xl mb-2 drop-shadow-md">👦</div>
                <h3 id="boy-name" class="text-2xl font-bold text-blue-600 mb-2">Boys</h3>
                <div id="boy-badges" class="flex gap-2 mt-2 text-2xl h-8"></div>
            </div>
        </div>

        <!-- Question Box (Standard) -->
        <div id="standard-question-box" class="w-full glass-panel p-8 rounded-3xl text-center mb-8 shadow-xl">
            <p id="question-text" class="text-3xl md:text-4xl leading-relaxed font-semibold mb-8 text-blue-900">
                Loading...
            </p>
            
            <div id="options-container" class="flex flex-wrap justify-center gap-4 mb-4">
                <!-- Options injected here -->
            </div>
        </div>

        <!-- Gap Fill Box (Category 7) -->
        <div id="gap-fill-box" class="w-full glass-panel p-8 rounded-3xl mb-8 shadow-xl hidden flex-col items-center">
            <h3 id="review-title" class="text-3xl font-black text-purple-700 mb-6 text-center"></h3>
            <p id="gap-fill-text" class="text-2xl md:text-3xl leading-relaxed font-medium mb-10 text-left w-full max-w-4xl mx-auto text-blue-950">
                <!-- Gap fill injected here -->
            </p>
            
            <div id="word-bank" class="flex flex-wrap justify-center gap-4 mb-8 w-full max-w-4xl mx-auto bg-white bg-opacity-70 p-6 rounded-2xl border border-blue-300">
                <!-- Word bank buttons injected here -->
            </div>
        </div>

    </div>

    <!-- Audio & Scripts -->
    <script>
        // --- DATA & CONFIG ---
        const girlsList = ["Elsa", "Lily", "Florence", "Yao", "Miya", "Nadiia", "Amara", "Hitomi", "Alice", "Karina", "Winnie", "Bella", "Sonia", "Albee", "Abby"];
        const boysList = ["Martin", "Noah", "Eric", "Eden", "Dominic", "Austin", "Charles", "Hoho", "Anders", "Jimmy", "Ming", "Jason", "Brendan", "Charlie", "Sky", "Ryan", "Ian", "Biscuit"];
        
        let girlsQueue = [];
        let boysQueue = [];

        let scores = { girl: 0, boy: 0 };
        let currentGirl = "";
        let currentBoy = "";

        const categories = [
            { id: 1, title: "1. Since vs. For ⏱️", color: "from-green-400 to-emerald-600" },
            { id: 2, title: "2. Present Perfect 🎬", color: "from-purple-400 to-indigo-600" },
            { id: 3, title: "3. Zero Conditional 🎥", color: "from-orange-400 to-red-600" },
            { id: 4, title: "4. First Conditional 🌟", color: "from-blue-400 to-cyan-600" },
            { id: 5, title: "5. Too vs. Enough 🎭", color: "from-yellow-400 to-amber-600" },
            { id: 6, title: "6. To-infinitive & Although 🎟️", color: "from-pink-400 to-rose-600" },
            { id: 7, title: "7. Movie Reviews Gap-Fill 📝", color: "from-indigo-400 to-purple-800" }
        ];

        // Generator functions to create exactly 25 questions per category
        function generateQuestions(categoryId) {
            let q = [];
            
            if (categoryId === 1) {
                const s1 = [
                    ["The director has worked on this fantasy movie", "two years", false, "🎥", "(work)"],
                    ["The actor has played the superhero", "2024", true, "🦸", "(play)"],
                    ["The film crew has been on location", "six months", false, "🏕️", "(be)"],
                    ["The producer has planned the project", "last summer", true, "📋", "(plan)"],
                    ["The screenwriter has written movie scripts", "fifteen years", false, "📝", "(write)"],
                    ["The special effects team has worked nonstop", "Monday", true, "💻", "(work)"],
                    ["The actress has starred in action films", "a decade", false, "🎬", "(star)"],
                    ["The camera operator has filmed scenes", "dawn", true, "🌅", "(film)"],
                    ["The studio has developed this sci-fi franchise", "many years", false, "🛸", "(develop)"],
                    ["The costume designer has worked on the movie", "January", true, "👗", "(work)"],
                    ["The explorers have searched the jungle setting", "three weeks", false, "🧭", "(search)"],
                    ["The horror movie has taken place in the haunted house", "the beginning of the film", true, "👻", "(take)"],
                    ["The audience has watched the adventure movie", "two hours", false, "🍿", "(watch)"],
                    ["The detective has investigated clues in the mansion", "Tuesday", true, "🔍", "(investigate)"],
                    ["The hero has traveled through the magical kingdom", "months", false, "🏰", "(travel)"],
                    ["The crew has filmed in the desert", "April", true, "🐪", "(film)"],
                    ["The villains have hidden in the secret base", "several weeks", false, "🦹", "(hide)"],
                    ["The astronaut has lived on the space station", "2050", true, "🚀", "(live)"],
                    ["The sheriff has protected the frontier town", "years", false, "🤠", "(protect)"],
                    ["The rebels have fought in the ancient kingdom", "childhood", true, "⚔️", "(fight)"],
                    ["The chosen hero has trained with the wise mentor", "six months", false, "🧙", "(train)"],
                    ["The scientist has studied alien technology", "many years", false, "🔬", "(study)"],
                    ["The performer has dreamed of success", "childhood", true, "🎭", "(dream)"],
                    ["The sidekick has helped the hero", "the first movie", true, "🤝", "(help)"],
                    ["The hidden traitor has fooled the crew", "months", false, "🎭", "(fool)"]
                ];
                q = s1.map(item => ({
                    text: `${item[0]} <span class="fixed-gap">___</span> <span class="clue-time">${item[1]}</span>. <span class="text-gray-400 font-bold ml-2">${item[4]}</span> ${item[3]}`,
                    plainText: `${item[0]} blank ${item[1]}.`,
                    options: ["since", "for"],
                    correctIndex: item[2] ? 0 : 1
                }));
            } else if (categoryId === 2) {
                const s2 = [
                    ["The director", "finished", "editing the film", "has", "have", "🎬", "(finish)"],
                    ["The actor", "already learned", "his lines", "has", "have", "🎭", "(learn)"],
                    ["The audience", "just seen", "the trailer", "has", "have", "🍿", "(see)"],
                    ["The villain", "never revealed", "his true identity", "has", "have", "🦹", "(reveal)"],
                    ["The hero", "already completed", "the quest", "has", "have", "⚔️", "(complete)"],
                    ["The special effects team", "created", "amazing visuals", "has", "have", "💥", "(create)"],
                    ["The producers", "funded", "the entire trilogy", "have", "has", "💰", "(fund)"],
                    ["The stunt doubles", "practiced", "the jump all morning", "have", "has", "🤸", "(practice)"],
                    ["The scriptwriter", "written", "a new plot twist", "has", "have", "📝", "(write)"],
                    ["The makeup artists", "transformed", "the lead actor", "have", "has", "💄", "(transform)"],
                    ["The sci-fi movie", "won", "several awards", "has", "have", "🏆", "(win)"],
                    ["The main characters", "survived", "the haunted house", "have", "has", "👻", "(survive)"],
                    ["The space captain", "commanded", "the spaceship", "has", "have", "🚀", "(command)"],
                    ["The underdog team", "won", "the championship", "has", "have", "🏅", "(win)"],
                    ["The rebels", "opposed", "the king since 2022", "have", "has", "🛡️", "(oppose)"],
                    ["The wizard", "protected", "the magical artifact", "has", "have", "🧙‍♂️", "(protect)"],
                    ["The lovers", "known", "each other since elementary school", "have", "has", "❤️", "(know)"],
                    ["The monster", "haunted", "the forest for centuries", "has", "have", "🌲", "(haunt)"],
                    ["The explorers", "searched", "the jungle", "have", "has", "🧭", "(search)"],
                    ["The athlete", "trained", "for the big game", "has", "have", "🏃", "(train)"],
                    ["The crew", "prepared", "for the final showdown", "have", "has", "🎬", "(prepare)"],
                    ["The evil AI", "controlled", "the city", "has", "have", "🤖", "(control)"],
                    ["The studio", "developed", "this franchise", "has", "have", "🏢", "(develop)"],
                    ["The hero", "lived", "in the kingdom since 2020", "has", "have", "🏰", "(live)"],
                    ["The detective", "investigated", "this mystery for two weeks", "has", "have", "🔍", "(investigate)"]
                ];
                q = s2.map(item => ({
                    text: `${item[0]} <span class="fixed-gap">___</span> <span class="clue-verb">${item[1]}</span> ${item[2]}. <span class="text-gray-400 font-bold ml-2">${item[6]}</span> ${item[5]}`,
                    plainText: `${item[0]} blank ${item[1]} ${item[2]}.`,
                    options: [item[3], item[4]],
                    correctIndex: 0
                }));
            } else if (categoryId === 3) {
                // Fixed blank logic for Zero Conditional
                const s3 = [
                    ["a horror movie uses suspense", "the audience ___ nervous", "feels", "will feel", "👻", "feels"],
                    ["a superhero loses their powers", "the story ___", "changes", "will change", "🦸", "changes"],
                    ["a detective finds evidence", "the mystery ___ clearer", "becomes", "became", "🔍", "becomes"],
                    ["a comedy uses misunderstandings", "people ___", "laugh", "laughed", "😂", "laugh"],
                    ["a sci-fi movie includes advanced tech", "viewers ___ futuristic settings", "expect", "expected", "🛸", "expect"],
                    ["a movie has a villain", "the hero usually ___ conflict", "faces", "will face", "🦹", "faces"],
                    ["a performer practices regularly", "performances ___", "improve", "improves", "🎭", "improve"],
                    ["audiences connect with characters", "they ___ the film more", "enjoy", "enjoyed", "🍿", "enjoy"],
                    ["the plot is confusing", "the audience ___ interest", "loses", "will lose", "❓", "loses"],
                    ["the camera breaks", "filming ___ completely", "stops", "will stop", "🎥", "stops"],
                    ["an actor forgets lines", "the director ___ cut", "yells", "will yell", "🎬", "yells"],
                    ["it rains on a film set", "the crew ___ indoors", "moves", "will move", "🌧️", "moves"],
                    ["the budget runs out", "the production ___ down", "shuts", "will shut", "💸", "shuts"],
                    ["a movie wins an Oscar", "ticket sales ___", "increase", "will increase", "🏆", "increase"],
                    ["the lighting is too dark", "the scene ___ scary", "looks", "will look", "💡", "looks"],
                    ["the soundtrack is loud", "the scene ___ intense", "feels", "will feel", "🎧", "feels"],
                    ["a stunt goes wrong", "the actor ___ injured", "gets", "will get", "🚑", "gets"],
                    ["the makeup is realistic", "the monster ___ terrifying", "looks", "looked", "🧟", "looks"],
                    ["the script is funny", "the cast ___ during practice", "laughs", "laugh", "😆", "laughs"],
                    ["a sequel is announced", "fans ___ excited", "get", "will get", "🤩", "get"],
                    ["the hero has a flaw", "the character ___ relatable", "feels", "will feel", "❤️", "feels"],
                    ["the villain is clever", "the hero ___ more", "struggles", "will struggle", "🧠", "struggles"],
                    ["the setting is isolated", "the tension ___ faster", "builds", "will build", "🏚️", "builds"],
                    ["a trope is overused", "the plot ___ predictable", "becomes", "became", "🥱", "becomes"],
                    ["the editing is fast", "the action ___ quicker", "seems", "seem", "✂️", "seems"]
                ];
                q = s3.map(item => ({
                    text: `<span class="clue-condition">If</span> ${item[0]}, ${item[1].replace('___', '<span class="fixed-gap">___</span>')} ${item[4]}`,
                    plainText: `If ${item[0]}, ${item[1].replace('___', 'blank')}.`,
                    options: [item[2], item[3]],
                    correctIndex: 0
                }));
            } else if (categoryId === 4) {
                // Fixed blank logic for First Conditional
                const s4 = [
                    ["the hero finds the treasure map", "he ___ the quest", "will begin", "begins", "🗺️"],
                    ["the detective discovers the clue", "she ___ the mystery", "will solve", "solves", "🔍"],
                    ["the director changes the ending", "the audience ___ surprised", "will be", "is", "🎬"],
                    ["the villain escapes", "there ___ a sequel", "will be", "is", "🦹"],
                    ["the actor learns the script", "filming ___ tomorrow", "will start", "starts", "📝"],

                    ["the scientist shuts down the AI", "humanity ___", "will survive", "survives", "🤖"],
                    ["the team wins the championship", "they ___", "will celebrate", "celebrate", "🏆"],
                    ["the reviews are good", "the studio ___ a sequel", "will make", "makes", "📰"],
                    ["the star gets sick", "it ___ the shoot", "will delay", "delays", "🤒"],
                    ["we finish the scene early", "we ___ tonight", "will celebrate", "celebrate", "🥳"],
                    ["the lighting is bad", "the crew ___ it", "will fix", "fixes", "💡"],
                    ["the movie is a hit", "it ___ millions", "will earn", "earns", "💰"],
                    ["the hidden traitor attacks", "the hero ___ back", "will fight", "fights", "⚔️"],
                    ["the space station loses power", "the crew ___", "will panic", "panics", "🚀"],
                    ["the underdog team practices hard", "they ___ the match", "will win", "win", "🏅"],
                    ["the monster wakes up", "everyone ___ away", "will run", "runs", "🦖"],
                    ["the mentor gives advice", "the hero ___", "will listen", "listens", "🧙‍♂️"],
                    ["the athlete gets injured", "the coach ___ her", "will replace", "replaces", "🏃‍♀️"],
                    ["the rebels capture the base", "the king ___", "will surrender", "surrenders", "🏰"],
                    ["the audience loves the characters", "they ___ merchandise", "will buy", "buys", "👕"],
                    ["the haunted house is too scary", "viewers ___ their eyes", "will cover", "cover", "👻"],
                    ["the special effects fail", "the director ___ angry", "will be", "is", "😡"],
                    ["the scriptwriter finishes today", "the producer ___ it tomorrow", "will read", "reads", "📖"],
                    ["the performer sings perfectly", "the crowd ___", "will cheer", "cheers", "🎤"]
                ];
                q = s4.map(item => ({
                    text: `<span class="clue-condition">If</span> ${item[0]}, ${item[1].replace('___', '<span class="fixed-gap">___</span>')} ${item[4]}`,
                    plainText: `If ${item[0]}, ${item[1].replace("___", "blank")}.`,
                    options: [item[2], item[3]],
                    correctIndex: 0
                }));
            } else if (categoryId === 5) {
                const s5 = [
                    ["The hero is brave", "enough", "to enter the haunted castle.", "too", "🏰"],
                    ["The detective is clever", "enough", "to discover the truth.", "not enough", "🔍"],
                    ["The location is", "too far", "to travel in one day.", "not far enough", "🗺️"],
                    ["We have", "not enough", "time to film this scene.", "too far", "⏱️"],
                    ["The actor ran", "too far", "past the mark.", "not enough", "🏃‍♂️"],
                    ["The explosion was", "not far enough", "away from the stuntman.", "too far", "💥"],
                    ["The budget is", "not enough", "to cover the CGI.", "too", "💰"],
                    ["The mountain is", "too", "dangerous.", "enough", "⛰️"],
                    ["The spaceship is", "too", "damaged.", "not enough", "🚀"],
                    ["The camera is", "not far enough", "to capture the whole scene.", "too far", "🎥"],
                    ["The studio has", "not enough", "money.", "too", "💰"],
                    ["The hero has", "enough", "allies.", "too far", "🤝"],
                    ["The stunt is", "too far", "down the road.", "not enough", "🛣️"],
                    ["The mystery is", "too", "complicated.", "enough", "❓"],
                    ["The actor is", "too", "nervous.", "enough", "😬"],
                    ["The hero is", "too", "frightened to enter the cabin.", "enough", "😨"],
                    ["The detective is", "too", "tired to continue the investigation.", "not enough", "🥱"],
                    ["The jump was", "not far enough", "to clear the gap.", "too far", "🤸"],
                    ["The monster is", "too", "fast to catch.", "enough", "🏃‍♂️"],
                    ["The villain is", "too", "arrogant to listen.", "enough", "🙄"],
                    ["The team walked", "too far", "into the desert.", "not enough", "🐪"],
                    ["The script is", "too", "long for a short film.", "enough", "📝"],
                    ["The stunts are", "too", "risky for the new actor.", "enough", "💥"],
                    ["We have", "not enough", "light in this scene.", "too far", "💡"],
                    ["The costumes are", "too", "heavy to wear in summer.", "not enough", "👗"]
                ];
                q = s5.map(item => {
                    let fullStr = `${item[0]} ${item[1]} ${item[2] || ''}`;
                    if(item[1] === "enough" && !item[2]) fullStr = `${item[0]} enough`;
                    let finalHtml = fullStr.replace(item[1], `<span class="fixed-gap">___</span>`);
                    return {
                        text: `${finalHtml} ${item[4]}`,
                        plainText: `${fullStr.replace(item[1], "blank")} ${item[4]}`.replace(/[^\w\s]/gi, ''),
                        options: [item[1], item[3]],
                        correctIndex: 0
                    };
                });
            } else if (categoryId === 6) {
                // Modified to remove the verb choices for infinitives, keeping grammar focus on to/not to/although
                const s6 = [
                    ["Although", "the hero was afraid, he entered the haunted house.", "Because", "👻"],
                    ["Although", "the detective lacked evidence, she continued the investigation.", "So", "🔍"],
                    ["Although", "the actor forgot a line, the scene was successful.", "To", "🎭"],
                    ["Although", "the villain was powerful, the hero defeated him.", "Because", "🦹"],
                    ["Although", "the movie had a small budget, it became successful.", "Not to", "💰"],
                    ["Although", "the crew faced bad weather, filming continued.", "Because", "🌧️"],
                    ["Although", "the athlete was injured, she finished the competition.", "To", "🏃‍♀️"],
                    ["Although", "the scientist doubted herself, she saved the station.", "So", "🔬"],
                    ["to", "The hero trains ___ defeat the villain.", "not to", "⚔️"],
                    ["to", "The detective studies clues ___ solve the mystery.", "although", "🔍"],
                    ["to", "The actor rehearses ___ improve performance.", "not to", "🎬"],
                    ["to", "The explorer travels ___ find treasure.", "although", "🗺️"],
                    ["to", "The scientist experiments ___ save humanity.", "not to", "🧪"],
                    ["to", "The athlete practices ___ win the championship.", "although", "🏅"],
                    ["to", "The performer sings ___ entertain the audience.", "not to", "🎤"],
                    ["to", "The director edits scenes ___ improve the movie.", "although", "✂️"],
                    ["not to", "The director told the actor ___ look at the camera.", "to", "🎥"],
                    ["not to", "The mentor advised the hero ___ trust the villain.", "to", "🧙‍♂️"],
                    ["not to", "The detective warned witnesses ___ discuss the case.", "although", "🤫"],
                    ["not to", "The coach told the athlete ___ give up.", "to", "😤"],
                    ["not to", "The scientist instructed the crew ___ enter the laboratory.", "to", "🚫"],
                    ["not to", "The sheriff ordered citizens ___ leave town.", "although", "🤠"],
                    ["not to", "The producer reminded everyone ___ spoil the ending.", "to", "🤐"],
                    ["not to", "The guide told the explorers ___ enter the dangerous cave.", "although", "🦇"],
                    ["Although", "the ending was sad, the audience loved the film.", "To", "😭"]
                ];
                q = s6.map(item => {
                    let txt = "";
                    let plain = "";
                    if(item[0] === "Although") {
                        txt = `<span class="fixed-gap">___</span> <span class="clue-condition">${item[1]}</span> ${item[3]}`;
                        plain = `Blank ${item[1]}`;
                    } else {
                        txt = item[1].replace("___", `<span class="fixed-gap">___</span>`) + ` ${item[3]}`;
                        plain = item[1].replace("___", "blank");
                    }
                    return {
                        text: txt,
                        plainText: plain,
                        options: [item[0], item[2]],
                        correctIndex: 0
                    };
                });
            }
            
            // For categories 1-6, shuffle answers so correct isn't always first, then shuffle questions
            if (categoryId !== 7) {
                q.forEach(item => {
                    if(Math.random() > 0.5) {
                        item.options.reverse();
                        item.correctIndex = item.correctIndex === 0 ? 1 : 0;
                    }
                });
                return q.sort(() => Math.random() - 0.5);
            }
            return [];
        }

        const reviewsData = [
            {
                title: "1. Fantasy Review: The Cursed Kingdom ⭐⭐⭐⭐☆",
                text: "The fan [has] enjoyed fantasy movies [for] many years. The hero has lived in the magical kingdom [since] childhood. [Although] he is brave [enough] to face dragons, he is [too] impatient to listen to his wise mentor. The hero trains [to] defeat the Dark Wizard. If he finds the magic crown, he [will] save the kingdom."
            },
            {
                title: "2. Sci-Fi Review: AI Station ⭐⭐⭐⭐⭐",
                text: "The scientist [has] worked on the space station [for] five years. [Although] she is intelligent [enough] to understand the evil AI, she is [too] arrogant to trust the crew. She works hard [to] save humanity. If she shuts down the AI, people [will] survive."
            },
            {
                title: "3. Horror Review: Shadows in the Cabin ⭐⭐⭐⭐☆",
                text: "The survivors have stayed in the haunted cabin [since] Friday. I [have] watched horror films [for] several years. [Although] the main character is fearless [enough] to investigate strange noises, some teenagers are [too] curious to stay safe. They enter the forest [to] discover the truth. If they ignore the warnings, they [will] face danger."
            },
            {
                title: "4. Mystery Review: The Mansion Secret ⭐⭐⭐⭐⭐",
                text: "The detective [has] investigated the case [for] two weeks. [Although] she is clever [enough] to connect clues, she is sometimes [too] suspicious to trust witnesses. She studies evidence [to] solve the mystery. If she uncovers the final clue, she [will] discover the truth."
            },
            {
                title: "5. Sports Review: Championship Dreams ⭐⭐⭐⭐☆",
                text: "The athlete [has] trained [since] the beginning of the season. [Although] she is determined [enough] to compete, she is sometimes [too] nervous to believe in herself. She practices every day [to] win the championship. If the team works together, they [will] succeed."
            },
            {
                title: "6. Superhero Review: Guardian of Metro City ⭐⭐⭐⭐☆",
                text: "The superhero has protected the city [for] many years. He [has] hidden his identity [since] becoming a hero. [Although] he is strong [enough] to defeat villains, he is [too] confident to recognize every danger. He fights [to] protect innocent people. If he trusts his team, he [will] become a better hero."
            },
            {

            },
            {
                title: "8. Action Review: Race Against Time ⭐⭐⭐⭐⭐",

            },
            {
                title: "9. Romance Review: City of Hearts ⭐⭐⭐⭐☆",
                text: "The two characters have known each other [since] elementary school. I [have] enjoyed romance films [for] years. [Although] they are kind [enough] to support each other, they are sometimes [too] shy to express their feelings. They meet every weekend [to] strengthen their relationship. If they tell the truth, they [will] finally be together."
            },
            {
                title: "10. Western Review: Frontier Justice ⭐⭐⭐⭐☆",
                text: "The sheriff has defended the frontier town [for] twenty years. He [has] fought outlaws [since] he became sheriff. [Although] he is tough [enough] to face danger, he is [too] stubborn to accept help. He rides across the desert [to] protect the town. If he defeats the gang leader, peace [will] return."
            }
        ];

        // --- GAME STATE ---
        let currentCategory = null;
        let currentQuestions = [];
        let questionIndex = 0;
        let timerInterval;
        let timeLeft = 60;
        let isAnswerRevealed = false;

        // Gap fill state
        let selectedWordBtn = null;
        let gapFillCompleted = false;

        // --- AUDIO (Web Audio API for sounds) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        function playCorrectSound() {
            playTone(523.25, 'sine', 0.1); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.1), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.3), 200); // G5
        }
        function playWrongSound() {
            playTone(300, 'sawtooth', 0.3, 0.05);
            setTimeout(() => playTone(250, 'sawtooth', 0.4, 0.05), 150);
        }
        function playCoinSound() {
            playTone(900, 'sine', 0.1, 0.05);
            setTimeout(() => playTone(1200, 'sine', 0.2, 0.05), 100);
        }
        function playPopSound() {
            playTone(800, 'sine', 0.05, 0.05);
        }

        // --- TTS ---
        function speak(text, callback) {
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95;
            
            const voices = synth.getVoices();
            const emmaVoice = voices.find(v => v.name.includes("Emma") || (v.name.includes("Microsoft") && v.lang.startsWith("en-")));
            if(emmaVoice) {
                utterance.voice = emmaVoice;
            }
            if(callback) {
                utterance.onend = callback;
                setTimeout(callback, text.length * 75); 
            }
            synth.speak(utterance);
        }

        function readQuestionAloud() {
            window.speechSynthesis.cancel();
            
            if (currentCategory.id === 7) {
                speak(`Movie review gap fill challenge for the Boys and Girls! Review number ${questionIndex + 1}.`);
                return;
            }

            if(!currentQuestions[questionIndex]) return;
            const text = currentQuestions[questionIndex].plainText;
            const praises = ["Excellent idea", "Great job", "Get ready", "Here we go", "Listen closely"];
            const praise = praises[Math.floor(Math.random() * praises.length)];
            const intro = `${praise} ${currentGirl} and ${currentBoy}!`;
            speak(intro, () => {
                setTimeout(() => speak(text), 200);
            });
        }

        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

        // --- INIT ---
        function initMenu() {
            const menuGrid = document.querySelector('#main-menu .grid');
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `glass-panel btn-hover bg-gradient-to-br ${cat.color} rounded-3xl p-8 text-white text-2xl font-bold shadow-xl flex items-center justify-center h-48 text-center`;
                btn.innerHTML = `<span>${cat.title}</span>`;
                btn.onclick = () => startGame(cat.id);
                menuGrid.appendChild(btn);
            });
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getNextPlayer(type) {
            if (type === 'girl') {
                if (girlsQueue.length === 0) girlsQueue = shuffleArray(girlsList);
                return girlsQueue.pop();
            } else {
                if (boysQueue.length === 0) boysQueue = shuffleArray(boysList);
                return boysQueue.pop();
            }
        }

        function startGame(categoryId) {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            
            const cat = categories.find(c => c.id === categoryId);
            document.getElementById('category-title').innerText = cat.title;
            
            currentCategory = cat;
            
            if(categoryId === 7) {
                currentQuestions = reviewsData;
                document.getElementById('standard-question-box').classList.add('hidden');
                document.getElementById('gap-fill-box').classList.remove('hidden');
                document.getElementById('gap-fill-box').classList.add('flex');
            } else {
                currentQuestions = generateQuestions(categoryId);
                document.getElementById('standard-question-box').classList.remove('hidden');
                document.getElementById('gap-fill-box').classList.add('hidden');
                document.getElementById('gap-fill-box').classList.remove('flex');
            }

            questionIndex = 0;
            
            scores = { girl: 0, boy: 0 };
            updateScoreUI();
            document.getElementById('girl-badges').innerHTML = '';
            document.getElementById('boy-badges').innerHTML = '';

            loadQuestion();
        }

        function returnToMenu() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('main-menu').classList.remove('hidden');
            window.speechSynthesis.cancel();
        }

        function loadQuestion() {
            if (questionIndex >= currentQuestions.length) {
                alert("Category Complete! Great job everyone!");
                returnToMenu();
                return;
            }

            isAnswerRevealed = false;
            gapFillCompleted = false;
            selectedWordBtn = null;
            
            document.getElementById('q-counter').innerText = `${questionIndex + 1} / ${currentQuestions.length}`;
            
            if(currentCategory.id !== 7) {
                currentGirl = getNextPlayer('girl');
                currentBoy = getNextPlayer('boy');
                document.getElementById('girl-name').innerText = currentGirl;
                document.getElementById('boy-name').innerText = currentBoy;

                const q = currentQuestions[questionIndex];
                document.getElementById('question-text').innerHTML = q.text;

                const optsContainer = document.getElementById('options-container');
                optsContainer.innerHTML = '';
                
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "bg-white text-indigo-900 px-8 py-4 rounded-2xl text-2xl font-bold shadow-md btn-hover border-4 border-transparent";
                    btn.innerText = opt;
                    btn.onclick = () => revealAnswer(idx, btn);
                    optsContainer.appendChild(btn);
                });
            } else {
                // Gap Fill Category
                document.getElementById('girl-name').innerText = "Girls";
                document.getElementById('boy-name').innerText = "Boys";
                loadGapFillReview();
            }

            startTimer();
            setTimeout(readQuestionAloud, 500);
        }

        // --- GAP FILL LOGIC ---
        function loadGapFillReview() {
            const review = currentQuestions[questionIndex];
            document.getElementById('review-title').innerText = review.title;
            document.getElementById('check-gap-answers').classList.remove('hidden');
            
            // Extract answers and build text
            let htmlText = review.text;
            let expectedAnswers = [];
            
            htmlText = htmlText.replace(/\[(.*?)\]/g, (match, p1) => {
                expectedAnswers.push(p1);
                return `<span class="gap-blank" data-answer="${p1}" onclick="handleGapClick(this)">___</span>`;
            });
            
            document.getElementById('gap-fill-text').innerHTML = htmlText;

            // Build word bank
            const wordBankEl = document.getElementById('word-bank');
            wordBankEl.innerHTML = '';
            
            let shuffledWords = shuffleArray([...expectedAnswers]);
            shuffledWords.forEach((word, idx) => {
                const btn = document.createElement('div');
                btn.className = "word-bank-btn";
                btn.innerText = word;
                btn.dataset.originalId = 'word_' + idx;
                btn.onclick = () => handleWordBankClick(btn);
                wordBankEl.appendChild(btn);
            });
        }

        function handleWordBankClick(btn) {
            if (gapFillCompleted) return;
            playPopSound();
            if(selectedWordBtn) {
                selectedWordBtn.classList.remove('selected');
            }
            if(selectedWordBtn !== btn) {
                selectedWordBtn = btn;
                btn.classList.add('selected');
            } else {
                selectedWordBtn = null;
            }
        }

        function handleGapClick(gapSpan) {
            if (gapFillCompleted) return;
            
            // If gap is already filled, remove the word and put it back in the bank
            if (gapSpan.classList.contains('filled')) {
                playPopSound();
                const word = gapSpan.innerText;
                gapSpan.innerText = '___';
                gapSpan.classList.remove('filled', 'correct', 'wrong');
                
                // Unhide the corresponding button in the bank
                const bankBtns = document.querySelectorAll('#word-bank .word-bank-btn');
                for(let btn of bankBtns) {
                    if(btn.innerText === word && btn.classList.contains('hidden')) {
                        btn.classList.remove('hidden');
                        break;
                    }
                }
                return;
            }

            // Fill gap with selected word
            if (selectedWordBtn) {
                playPopSound();
                gapSpan.innerText = selectedWordBtn.innerText;
                gapSpan.classList.add('filled');
                gapSpan.classList.remove('wrong');
                
                selectedWordBtn.classList.add('hidden');
                selectedWordBtn.classList.remove('selected');
                selectedWordBtn = null;
            }
        }

        function checkGapFillAnswers() {
            if (gapFillCompleted) return;
            
            const gaps = document.querySelectorAll('#gap-fill-text .gap-blank');
            let allCorrect = true;
            let allFilled = true;

            gaps.forEach(gap => {
                if(gap.innerText === '___') {
                    allFilled = false;
                }
            });

            if(!allFilled) {
                alert("Please fill all the blanks first!");
                return;
            }

            gaps.forEach(gap => {
                gap.classList.remove('wrong', 'correct');
                if (gap.innerText === gap.dataset.answer) {
                    gap.classList.add('correct');
                } else {
                    gap.classList.add('wrong');
                    allCorrect = false;
                }
            });

            if (allCorrect) {
                clearInterval(timerInterval);
                gapFillCompleted = true;
                playCorrectSound();
                createConfetti();
                document.getElementById('check-gap-answers').classList.add('hidden');
                speak("Perfect! A masterpiece review. Award points to the winner!");
            } else {
                playWrongSound();
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 60; // 60s for all modes
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';
            bar.classList.remove('timer-warning');

            timerInterval = setInterval(() => {
                timeLeft--;
                const pct = (timeLeft / 60) * 100;
                bar.style.width = `${pct}%`;
                
                if(timeLeft <= 15) {
                    bar.classList.add('timer-warning');
                }

                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playWrongSound();
                    if(currentCategory.id !== 7 && !isAnswerRevealed) {
                        revealAnswer(-1, null);
                    }
                }
            }, 1000);
        }

        function revealAnswer(selectedIndex, btnElement) {
            if (isAnswerRevealed) return;
            isAnswerRevealed = true;
            clearInterval(timerInterval);
            
            const q = currentQuestions[questionIndex];
            const isCorrect = selectedIndex === q.correctIndex;
            
            const allBtns = document.getElementById('options-container').children;
            
            for(let i=0; i<allBtns.length; i++) {
                allBtns[i].disabled = true;
                if (i === q.correctIndex) {
                    allBtns[i].classList.remove('bg-white', 'text-indigo-900');
                    allBtns[i].classList.add('bg-green-500', 'text-white', 'border-green-300');
                } else {
                    allBtns[i].classList.add('opacity-50');
                }
            }

            if(isCorrect) {
                playCorrectSound();
                if(btnElement) btnElement.classList.add('scale-110');
            } else {
                playWrongSound();
                if(btnElement) {
                    btnElement.classList.remove('bg-white');
                    btnElement.classList.add('bg-red-500', 'text-white', 'border-red-300');
                }
            }

            const correctText = q.options[q.correctIndex];
            document.getElementById('question-text').innerHTML = document.getElementById('question-text').innerHTML.replace('<span class="fixed-gap">___</span>', `<span class="bg-green-500 text-white px-3 py-1 rounded-lg">${correctText}</span>`);
            
            if (isCorrect) {
                speak("Correct! Award the points!");
            }
        }

        function awardPoint(team) {
            // Prevent awarding points multiple times per question in standard mode
            if (currentCategory.id !== 7 && !isAnswerRevealed) {
                alert("Let them answer the question first!");
                return;
            }
            if (currentCategory.id === 7 && !gapFillCompleted) {
                alert("Solve the review first!");
                return;
            }

            window.speechSynthesis.cancel();
            
            if (team === 'girl') {
                scores.girl += 10;
                playCoinSound();
                createConfetti();
                checkBadges('girl');
                speak(currentCategory.id === 7 ? "Ten points for the Girls Team!" : `Ten points for ${currentGirl}!`);
            } else if (team === 'boy') {
                scores.boy += 10;
                playCoinSound();
                createConfetti();
                checkBadges('boy');
                speak(currentCategory.id === 7 ? "Ten points for the Boys Team!" : `Ten points for ${currentBoy}!`);
            }
            
            updateScoreUI();
            
            // Move to next question automatically after awarding
            setTimeout(() => {
                questionIndex++;
                loadQuestion();
            }, 2500);
        }

        function updateScoreUI() {
            document.getElementById('girl-score').innerText = scores.girl;
            document.getElementById('boy-score').innerText = scores.boy;
        }

        function checkBadges(team) {
            const score = scores[team];
            let badgeContainer = document.getElementById(`${team}-badges`);
            
            if (score === 30 && badgeContainer.children.length < 1) addBadge(badgeContainer, '⭐');
            if (score === 60 && badgeContainer.children.length < 2) addBadge(badgeContainer, '🔥');
            if (score === 100 && badgeContainer.children.length < 3) addBadge(badgeContainer, '👑');
        }

        function addBadge(container, emoji) {
            const s = document.createElement('span');
            s.innerText = emoji;
            s.className = 'badge-animation drop-shadow-md';
            container.appendChild(s);
        }

        // --- CONFETTI EFFECT ---
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfetti() {
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 16 - 8,
                    dy: Math.random() * -20 - 5, // Faster upwards burst
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.1) + 0.05,
                    tiltAngle: 0
                });
            }
        }

        function drawConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.4; // Stronger gravity for faster fall
                p.y += p.dy;
                p.x += p.dx;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();

                if (p.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(drawConfetti);
        }
        drawConfetti();

        // Boot
        window.onload = () => {
            initMenu();
        };
    </script>
