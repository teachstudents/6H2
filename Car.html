            0%, 100% { transform: translateY(0px) rotate(-3deg) scale(1); }
            50% { transform: translateY(-12px) rotate(4deg) scale(1.08); }
        }
        .floating-vehicle {
            display: inline-block;
            animation: floatVehicle 2.2s ease-in-out infinite;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5));

        .floating-delay-2 { animation-delay: 0.6s; }

                waypoints: [

        // --- 2. GAME STATE ---

        let finishLinePhase = false; let podiumLocked = [];

        let emojiMap = []; let TILE_SIZE = 32;
        let gameRunning = false; let celebrationActive = false; let animationFrameId = null; let simulationSpeed = 1;

        let prevTopThreeNames = ["", "", ""]; let lastSpeechStartTime = 0; let lastSpeechEndTime = 0; let commentatorTurn = 0; let commentaryStyleIndex = 0;

        // --- 3. TRACK BUILDER & EXACT GEOMETRIC PROGRESS CALCULATOR ---
        function buildActiveTrackMap() {
            const cfg = TRACK_CONFIGS[currentTrackId]; lapWaypoints = cfg.waypoints;
            for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) map[r][c] = 0;
            const roadCandidateSet = new Set();

            segmentDistances = [];
            cumulativeSegmentDist = [0];
            totalLapLength = 0;

            for (let i = 0; i < lapWaypoints.length; i++) {
                const p1 = lapWaypoints[i]; const p2 = lapWaypoints[(i + 1) % lapWaypoints.length];
                const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                segmentDistances.push(segLen);
                totalLapLength += segLen;
                cumulativeSegmentDist.push(totalLapLength);

                const minX = Math.min(p1.x, p2.x); const maxX = Math.max(p1.x, p2.x);
                const minY = Math.min(p1.y, p2.y); const maxY = Math.max(p1.y, p2.y);
                for (let r = minY; r <= maxY; r++) {
                    for (let c = minX; c <= maxX; c++) {
                        map[r][c] = 1;

                          voices.find(v => /multilingual.*online.*natural|online.*natural/i.test(v.name) && /^en/i.test(v.lang) && v !== emmaVoice) ||
                          voices.find(v => /^en/i.test(v.lang) && /male|boy|david|mark|guy|ryan|brian/i.test(v.name)) ||

        function speakCommentary(speaker, text, interrupt = false) {
            if (!('speechSynthesis' in window)) return;

            const synth = window.speechSynthesis;
            loadVoices();

            if (interrupt) {
                synth.cancel();
                ttsQueue = [];
            }

            if (synth.speaking || synth.pending) {
                if (!interrupt) {
                    ttsQueue.push({ speaker, text });
                    return;
                }
            }

            const utter = new SpeechSynthesisUtterance(text);
            utter.volume = 1.0;
            utter.rate = 1.0;
            utter.pitch = speaker === 'Emma' ? 1.05 : 0.95;
            utter.lang = 'en-US';

            const preferredVoice = speaker === 'Emma' ? emmaVoice : andrewVoice;
            if (preferredVoice) {
                utter.voice = preferredVoice;
                if (/^en/i.test(preferredVoice.lang)) {
                    utter.lang = preferredVoice.lang;
                }

                lastSpeechStartTime = performance.now();
                setMusicAndHornsDucked(true);

                commentaryText.textContent = `${speaker}: "${text}"`;

            utter.onend = () => {
                lastSpeechEndTime = performance.now();
                setMusicAndHornsDucked(false);
                commentaryBanner.classList.add('hidden');

                if (ttsQueue.length > 0) {
                    const next = ttsQueue.shift();
                    setTimeout(() => speakCommentary(next.speaker, next.text, false), 80);
                }

            utter.onerror = () => {
                lastSpeechEndTime = performance.now();
                setMusicAndHornsDucked(false);
                commentaryBanner.classList.add('hidden');

                if (ttsQueue.length > 0) {
                    const next = ttsQueue.shift();
                    setTimeout(() => speakCommentary(next.speaker, next.text, false), 80);

            try {
                synth.resume();

        // --- 6. RACER UPDATE & HAZARDS ---
        function updateHazardsAndHorns(now, dt) {

                light.timer -= dt;

                    const vName = VEHICLE_NAMES[racer.emoji] || 'car';

                        chaosMultiplier = 0.95 + Math.random() * 0.65 + Math.min(0.4, gapBehindLeader * 0.025);
                    } else {
                        chaosMultiplier = 1.10 + Math.random() * 0.75 + Math.min(0.55, gapBehindLeader * 0.035);
                    }

                    if (Math.random() < 0.08 && rankIndex > 1) chaosMultiplier *= 1.45;
                    else if (Math.random() < 0.05 && rankIndex === 0) chaosMultiplier *= 0.65;

                    racer.speed = racer.baseSpeed * chaosMultiplier;
                    racer.speedChangeTimer = now + 550 + Math.random() * 850;
                }

                let finalSpeed = racer.speed;
                if (now < racer.boostUntil) finalSpeed *= 2.4;
                if (finishLinePhase) finalSpeed *= 1.35;

                const dx = targetTileX - racer.tileX; const dy = targetTileY - racer.tileY;
                const distTiles = Math.hypot(dx, dy); const stepTiles = (finalSpeed * simulationSpeed) / 31;

                if (Math.abs(dx) > Math.abs(dy)) { racer.facingRight = dx > 0; racer.tiltAngle = 0; }
                else { racer.facingRight = false; racer.tiltAngle = dy > 0 ? -0.42 : 0.42; }

                if (distTiles <= stepTiles) {
                    const reachedWaypoint = racer.waypointIndex;
                    racer.tileX = targetTileX; racer.tileY = targetTileY;
                    racer.waypointIndex = (racer.waypointIndex + 1) % lapWaypoints.length;

                    if (reachedWaypoint === 0) {
                        racer.laps++;
                        playLapSound();

                        if (finishLinePhase && racer.finishRank === 0) {
                            podiumLocked.push(racer);
                            racer.finishRank = podiumLocked.length;

                            if (podiumLocked.length >= Math.min(3, racers.length)) {
                                endGame(true);
                                return;
                            }
                        }
                    }
                } else {
                    racer.tileX += (dx / distTiles) * stepTiles; racer.tileY += (dy / distTiles) * stepTiles;
                }
            });

            if (now - lastPanelRenderTime > 160) {
                lastPanelRenderTime = now;
                const currentSorted = getSortedRacers();
                if (gameRunning && currentSorted.length > 0 && now - raceStartTime > 1000) processLiveCommentary(currentSorted);
                renderLeftPanelDOM(currentSorted, now);
            }
        }

        function renderLeftPanelDOM(sortedList, now = performance.now()) {
            document.getElementById('leftRacerList').innerHTML = sortedList.map((r, index) => {
                const rank = index + 1;
                let badgeColor = 'bg-gray-700 text-gray-200'; let cardBorder = 'border-gray-700 bg-gray-900/90';
                if (rank === 1) { badgeColor = 'bg-yellow-400 text-gray-900'; cardBorder = 'border-yellow-500/80 bg-gray-900'; }
                else if (rank === 2) { badgeColor = 'bg-gray-300 text-gray-900'; }
                else if (rank === 3) { badgeColor = 'bg-amber-600 text-white'; }
                const isCrashed = now < r.crashedUntil;
                const isBoosted = now < r.boostUntil;
                const statusIcon = r.finishRank > 0
                    ? `🏁#${r.finishRank}`
                    : (isCrashed ? '🪨🔥💥' : (r.stoppedByAnimal ? '🐄' : (r.isStoppedAtLight ? '🔴' : (isBoosted ? '⚡' : `L${r.laps + 1}`))));
                return `<div class="flex items-center justify-between px-1.5 py-0.5 rounded-lg border ${cardBorder}">
                            <div class="flex items-center gap-1.5 min-w-0">

                                <div class="flex flex-col items-start leading-none min-w-0">
                                    <span class="font-bold text-[11px] text-white truncate max-w-[68px]">${r.name}</span>
                                    <span class="text-base mt-0.5 leading-none">${r.emoji}</span>
                                </div>
                            </div>
                            <div class="text-right shrink-0"><span class="text-[10px] font-extrabold text-yellow-400">${statusIcon}</span></div>
                        </div>`;
            }).join('');
        }

        function drawRacerSprite(racer, now) {
            const isCrashed = now < racer.crashedUntil;
            const isBoosted = now < racer.boostUntil;
            const rx = racer.tileX * TILE_SIZE; const ry = racer.tileY * TILE_SIZE;

            ctx.save(); ctx.translate(rx, ry);
            if (racer.facingRight) ctx.scale(-1, 1);
            if (isCrashed) ctx.rotate((now * 0.015) % (Math.PI * 2));
            else if (racer.tiltAngle !== 0) ctx.rotate(racer.tiltAngle);

            ctx.font = `${TILE_SIZE * 0.78}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(racer.emoji, 0, 0);

            if (isBoosted && !isCrashed) { ctx.font = `${TILE_SIZE * 0.5}px sans-serif`; ctx.fillText('💨', TILE_SIZE * 0.6, 0); }
            ctx.restore();

            if (isCrashed) { ctx.font = `${TILE_SIZE * 0.62}px sans-serif`; ctx.fillText('🪨🔥💥', rx, ry - TILE_SIZE * 0.55); }
            else if (racer.stoppedByAnimal) { ctx.font = `${TILE_SIZE * 0.42}px sans-serif`; ctx.fillText('🛑', rx, ry - TILE_SIZE * 0.48); }
        }

        function isRacerOnOverpassBridge(racer) {
            if (currentTrackId !== 4) return false;
            return [4, 5, 7, 8, 19].includes(racer.waypointIndex);
        }

        // --- 7. RENDERING ---
        function drawTrack() {
            const now = performance.now();
            const cfg = TRACK_CONFIGS[currentTrackId];
            ctx.fillStyle = '#4d8a3b'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const tile = map[y][x]; const px = x * TILE_SIZE; const py = y * TILE_SIZE;
                    if (tile === 1 || tile === 4) {
                        ctx.fillStyle = currentTrackId === 3 ? '#312e81' : (currentTrackId === 4 ? '#1f2937' : '#374151');
                        ctx.fillRect(px, py, TILE_SIZE + 0.6, TILE_SIZE + 0.6);
                        ctx.fillStyle = currentTrackId === 3 ? '#818cf8' : (currentTrackId === 4 ? '#fbbf24' : '#9ca3af');
                        ctx.fillRect(px + TILE_SIZE * 0.38, py + TILE_SIZE * 0.45, TILE_SIZE * 0.22, TILE_SIZE * 0.08);
                    }

                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

                    else if (tile === 4) {

                        ctx.font = `${TILE_SIZE * 0.82}px sans-serif`; ctx.fillText(EMOJIS.finish, centerX, centerY);
                    }
                }
            }

            activeBoosts.forEach(b => {
                ctx.save();
                ctx.font = `${TILE_SIZE * 0.85}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('⚡', b.tileX * TILE_SIZE, b.tileY * TILE_SIZE);
                ctx.restore();
            });
            activeRocks.forEach(r => {
                ctx.font = `${TILE_SIZE * 0.82}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('🪨', r.tileX * TILE_SIZE, r.tileY * TILE_SIZE);
            });

            activeAnimals.forEach(a => {
                const ax = a.tileX * TILE_SIZE; const ay = a.tileY * TILE_SIZE; const roadCenterY = (a.roadRow + 0.5) * TILE_SIZE;
                ctx.fillStyle = 'rgba(250, 204, 21, 0.55)';
                for (let s = -0.35; s <= 0.35; s += 0.22) ctx.fillRect(ax - TILE_SIZE * 0.35, roadCenterY + s * TILE_SIZE, TILE_SIZE * 0.7, TILE_SIZE * 0.1);
                ctx.font = `${TILE_SIZE * 0.45}px sans-serif`; ctx.fillText('⚠️', ax, roadCenterY - TILE_SIZE * 0.55);
                ctx.font = `${TILE_SIZE * 0.85}px sans-serif`; ctx.fillText(a.emoji, ax, ay);
            });

            racers.forEach(racer => {
                if (!isRacerOnOverpassBridge(racer)) drawRacerSprite(racer, now);
            });

            if (cfg.overpasses && cfg.overpasses.length > 0) {
                cfg.overpasses.forEach(ov => {
                    const ox = ov.x * TILE_SIZE; const oy = ov.y * TILE_SIZE;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    ctx.fillRect(ox - TILE_SIZE * 0.18, oy, TILE_SIZE * 1.36, TILE_SIZE);
                    ctx.fillStyle = '#4b5563';
                    ctx.fillRect(ox, oy - TILE_SIZE * 0.1, TILE_SIZE, TILE_SIZE * 1.2);
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(ox - 2, oy - TILE_SIZE * 0.1, 4, TILE_SIZE * 1.2);
                    ctx.fillRect(ox + TILE_SIZE - 2, oy - TILE_SIZE * 0.1, 4, TILE_SIZE * 1.2);
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(ox + TILE_SIZE * 0.46, oy + TILE_SIZE * 0.25, TILE_SIZE * 0.08, TILE_SIZE * 0.5);
                });
            }

            racers.forEach(racer => {
                if (isRacerOnOverpassBridge(racer)) drawRacerSprite(racer, now);
            });

            if (cfg.tunnels && cfg.tunnels.length > 0) {
                cfg.tunnels.forEach(t => {
                    const minX = Math.min(t.x1, t.x2) * TILE_SIZE;
                    const minY = Math.min(t.y1, t.y2) * TILE_SIZE;
                    const width = (Math.abs(t.x2 - t.x1) + 1) * TILE_SIZE;
                    const height = (Math.abs(t.y2 - t.y1) + 1) * TILE_SIZE;

                    ctx.fillStyle = 'rgba(17, 24, 39, 0.86)';
                    ctx.fillRect(minX, minY, width, height);
                    ctx.strokeStyle = '#9ca3af';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(minX, minY, width, height);

                    ctx.fillStyle = '#6b7280';
                    if (t.orientation === 'vertical') {
                        ctx.fillRect(minX - 3, minY, width + 6, TILE_SIZE * 0.28);
                        ctx.fillRect(minX - 3, minY + height - TILE_SIZE * 0.28, width + 6, TILE_SIZE * 0.28);
                    } else {
                        ctx.fillRect(minX, minY - 3, TILE_SIZE * 0.28, height + 6);
                        ctx.fillRect(minX + width - TILE_SIZE * 0.28, minY - 3, TILE_SIZE * 0.28, height + 6);
                    }

                    ctx.fillStyle = '#fde047';
                    ctx.font = `bold ${Math.max(9, TILE_SIZE * 0.32)}px Inter, sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(`🏔️ ${t.label}`, minX + width / 2, minY + height / 2);
                });
            }

            activeTrafficLights.forEach(light => {
                const lx = (light.x + 0.5) * TILE_SIZE; const ly = (light.y + 0.5) * TILE_SIZE;
                ctx.fillStyle = '#222'; ctx.fillRect(lx - TILE_SIZE*0.25, ly - TILE_SIZE*1.2, TILE_SIZE*0.5, TILE_SIZE*1.05);
                ctx.fillStyle = light.state === 'red' ? '#ff4444' : '#444'; ctx.beginPath(); ctx.arc(lx, ly - TILE_SIZE*0.95, TILE_SIZE*0.12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = light.state === 'yellow' ? '#ffff44' : '#444'; ctx.beginPath(); ctx.arc(lx, ly - TILE_SIZE*0.65, TILE_SIZE*0.12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = light.state === 'green' ? '#44ff44' : '#444'; ctx.beginPath(); ctx.arc(lx, ly - TILE_SIZE*0.35, TILE_SIZE*0.12, 0, Math.PI*2); ctx.fill();
            });

            if (celebrationActive || fireworks.length > 0) {
                if (celebrationActive && Math.random() < 0.24) {
                    const x = (0.08 + Math.random() * 0.84) * canvas.width; const y = (0.08 + Math.random() * 0.65) * canvas.height;
                    const colors = ['#facc15', '#f87171', '#60a5fa', '#34d399', '#c084fc', '#fb923c', '#ffffff', '#f472b6'];
                    for (let i = 0; i < 55; i++) fireworks.push({ x: x, y: y, vx: Math.cos((Math.PI * 2 * i) / 55 + (Math.random() * 0.25)) * (1.8 + Math.random() * 5.8), vy: Math.sin((Math.PI * 2 * i) / 55 + (Math.random() * 0.25)) * (1.8 + Math.random() * 5.8), color: colors[i % colors.length], alpha: 1, size: 3 + Math.random() * 3.5 });
                    if(soundInitialized){ try{ fireworkNoise.triggerAttackRelease('8n', Tone.now()); polySynth.triggerAttackRelease([['C5', 'E5', 'G5', 'B5', 'C6', 'D6', 'E6'][Math.floor(Math.random() * 7)], 'G5'], '16n', Tone.now() + 0.05); }catch(e){} }
                }
                for (let i = fireworks.length - 1; i >= 0; i--) {
                    const p = fireworks[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.alpha -= 0.013;
                    if (p.alpha <= 0) { fireworks.splice(i, 1); continue; }
                    ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                }
            }
        }

        // --- 8. INITIALIZATION & UI BINDING ---
        function resizeCanvasOnly() {
            const container = canvas.parentElement; const cw = container.clientWidth || 800; const ch = container.clientHeight || 500;
            const aspect = cols / rows; let width = cw; let height = cw / aspect;
            if (height > ch) { height = ch; width = ch * aspect; }
            canvas.width = Math.max(360, Math.floor(width)); canvas.height = Math.max(240, Math.floor(height)); TILE_SIZE = canvas.width / cols;
        }

        async function startGame() {
            if (gameRunning) return;
            await initAudioEngine(); playStartSound();
            if (racers.length === 0 || remainingTimeMs <= 0 || celebrationActive || finishLinePhase) {
                endGame(false); celebrationActive = false; finishLinePhase = false; podiumLocked = []; fireworks = []; remainingTimeMs = raceDurationMs;
                activeAnimals = []; activeRocks = []; activeBoosts = []; urgentAnnouncementQueue = []; prevTopThreeNames = ["", "", ""];
                hazardBanner.classList.add('hidden'); commentaryBanner.classList.add('hidden');
                
                buildActiveTrackMap(); resizeCanvasOnly();
                const cfg = TRACK_CONFIGS[currentTrackId]; const availableVehicles = [...FLEET_VEHICLES].sort(() => 0.5 - Math.random()); const chosenNames = Array.from(selectedStudents);
                const maxSpanCols = Math.max(4, (cols - 4) - cfg.startCol);
                const spacingCols = Math.min(0.42, maxSpanCols / Math.max(1, chosenNames.length));

                for (let b = 0; b < 3; b++) {
                    if (hazardRoadCandidates.length > 0) {
                        const pt = hazardRoadCandidates[Math.floor(Math.random() * hazardRoadCandidates.length)];
                        activeBoosts.push({ tileX: pt.x + 0.5, tileY: pt.y + 0.5 });
                    }
                }

                racers = chosenNames.map((name, idx) => {
                    const laneOffset = ((idx % 5) - 2) * 0.09;
                    return { id: idx, name: name, emoji: availableVehicles[idx % availableVehicles.length], tileX: cfg.startCol + 0.5 + (idx * spacingCols), tileY: cfg.startRow + 0.5 + laneOffset, baseSpeed: 1.65 + (Math.random() * 0.16), speed: 1.7, speedChangeTimer: 0, waypointIndex: 1, laps: 0, finishRank: 0, laneOffset: laneOffset, facingRight: false, tiltAngle: 0, isStoppedAtLight: false, stoppedByAnimal: false, crashedUntil: 0, boostUntil: 0 };
                });
            }

            celebrationActive = false; fireworks = []; gameRunning = true;

            raceStartTime = performance.now(); lastTime = raceStartTime; lastPanelRenderTime = raceStartTime;
            nextAnimalSpawnTime = raceStartTime + 2200; nextRockSpawnTime = raceStartTime + 2000; nextBoostSpawnTime = raceStartTime + 2500; nextRandomHornTime = raceStartTime + 1800; lastSpeechEndTime = raceStartTime;

            const trackIntro = currentTrackId === 4
                ? `Green light on Track 4, the Overpass and Tunnel Circuit! Watch cars race through the mountain tunnels, underpasses, and bridges!`
                : `Green light on Track ${currentTrackId}, ${TRACK_CONFIGS[currentTrackId].name}! Watch out for animal crossings, rock crashes, and lightning power boosts!`;

        }

                for (let b = 0; b < 5; b++) {

                if (!('speechSynthesis' in window) || sorted.length === 0) return;

        function gameLoop(now) {
            if (gameRunning) {
                const dt = now - lastTime; lastTime = now;
                const elapsed = now - raceStartTime; remainingTimeMs = Math.max(0, raceDurationMs - elapsed);
                if (remainingTimeMs > 0) {
                    const totalSecs = Math.ceil(remainingTimeMs / 1000);
                    document.getElementById('raceTimerDisplay').textContent = `${String(Math.floor(totalSecs / 60)).padStart(2, '0')}:${String(totalSecs % 60).padStart(2, '0')}`;
                } else {
                    document.getElementById('raceTimerDisplay').textContent = `🏁 LAP`;

                        queueUrgentEventAnnouncement(`Time is up! Checkered flag is out at the finish line! First cars to cross the finish line take first, second, and third!`);

        function renderStudentGrid() {

                const btn = document.createElement('button'); btn.type = 'button';

        function switchClass(className) {
            if (currentClass !== className) {
                currentClass = className; 
                selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS));
            }
            document.getElementById('classBtn6H2').classList.toggle('active', currentClass === '6H2');
            document.getElementById('classBtn5M2').classList.toggle('active', currentClass === '5M2');
            document.getElementById('activeClassBadge').textContent = `Class ${currentClass}`;
            document.getElementById('quickSwitchClassBtn').textContent = currentClass === '6H2' ? '5M2' : '6H2';
            renderStudentGrid();
        }

        document.getElementById('classBtn6H2').addEventListener('click', () => switchClass('6H2'));
        document.getElementById('classBtn5M2').addEventListener('click', () => switchClass('5M2'));
        document.getElementById('quickSwitchClassBtn').addEventListener('click', () => { 
            switchClass(currentClass === '6H2' ? '5M2' : '6H2'); 
            racers = [];
            endGame(); document.getElementById('messageOverlay').classList.add('hidden'); startGame(); 
        });

        document.querySelectorAll('.track-btn').forEach(btn => btn.addEventListener('click', () => {
            currentTrackId = parseInt(btn.dataset.track, 10);
            document.querySelectorAll('.track-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.track, 10) === currentTrackId));
            if (!document.getElementById('gameScreen').classList.contains('hidden')) { racers = []; endGame(); document.getElementById('messageOverlay').classList.add('hidden'); startGame(); }
        }));
        
        document.querySelectorAll('.time-btn').forEach(btn => btn.addEventListener('click', () => {
            const mins = parseInt(btn.dataset.mins, 10); selectedDurationMinutes = mins; raceDurationMs = mins * 60 * 1000;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.mins, 10) === mins));
            if (!gameRunning) document.getElementById('raceTimerDisplay').textContent = `${String(mins).padStart(2, '0')}:00`;
        }));

        document.getElementById('btnFirst16').addEventListener('click', () => { selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS)); renderStudentGrid(); });
        document.getElementById('btnRemaining').addEventListener('click', () => { const rem = CLASS_ROSTERS[currentClass].slice(MAX_RACERS); selectedStudents = new Set(rem.length > 0 ? rem.slice(0, MAX_RACERS) : CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS)); renderStudentGrid(); });
        document.getElementById('btnRandom16').addEventListener('click', () => { selectedStudents = new Set([...CLASS_ROSTERS[currentClass]].sort(() => 0.5 - Math.random()).slice(0, MAX_RACERS)); renderStudentGrid(); });
        document.getElementById('btnClearAll').addEventListener('click', () => { selectedStudents.clear(); renderStudentGrid(); });

        document.getElementById('goToTrackBtn').addEventListener('click', () => {
            if (selectedStudents.size === 0) return;
            document.getElementById('selectionScreen').classList.add('hidden'); document.getElementById('gameScreen').classList.remove('hidden');
            setTimeout(() => { racers = []; endGame(); document.getElementById('messageOverlay').classList.add('hidden'); startGame(); }, 50);
        });

        document.getElementById('startButton').addEventListener('click', () => { if (gameRunning) { racers = []; endGame(); document.getElementById('messageOverlay').classList.add('hidden'); } startGame(); });
        document.getElementById('backButton').addEventListener('click', () => { endGame(false); document.getElementById('gameScreen').classList.add('hidden'); document.getElementById('selectionScreen').classList.remove('hidden'); });
        document.getElementById('overlayRestartBtn').addEventListener('click', () => { document.getElementById('messageOverlay').classList.add('hidden'); racers = []; endGame(); startGame(); });
        document.getElementById('overlayRosterBtn').addEventListener('click', () => { document.getElementById('messageOverlay').classList.add('hidden'); endGame(false); document.getElementById('gameScreen').classList.add('hidden'); document.getElementById('selectionScreen').classList.remove('hidden'); });
        document.getElementById('speedSlider').addEventListener('input', (e) => { simulationSpeed = parseFloat(e.target.value); });
        
        window.addEventListener('resize', () => {
            if (!document.getElementById('gameScreen').classList.contains('hidden')) {
                resizeCanvasOnly();
                drawTrack();
            }
        });

        switchClass(currentClass);
    </script>
</body>
</html>
