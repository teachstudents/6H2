<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Lap Racer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel-2: #111827;
      --line: #374151;
      --green: #22c55e;
      --amber: #fbbf24;
      --red: #ef4444;
      --blue: #60a5fa;
      --purple: #a78bfa;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      touch-action: none;
    }

    * { box-sizing: border-box; }

    canvas {
      width: 100%;
      height: 100%;
      background: #4d8a3b;
      border: 3px solid #374151;
      border-radius: 0.75rem;
      box-shadow: 0 10px 25px rgba(0,0,0,.5);
      display: block;
    }

    .student-card.selected {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: #93c5fd;
      transform: translateY(-1px);
    }

    .class-tab.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #111827;
      border-color: #fde68a;
    }

    .track-btn.active {
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: white;
      border-color: #f9a8d4;
    }

    .time-btn.active {
      background-color: #10b981;
      color: #111827;
      border-color: #6ee7b7;
    }

    @keyframes flash { 
      0%,100% { color:#4ade80; transform: scale(1); }
      50% { color:#f87171; transform: scale(1.12); }
    }

    .flash-red { animation: flash 0.45s ease-in-out; }

    @keyframes floatVehicle {
      0%,100% { transform: translateY(0px) rotate(-3deg) scale(1); }
      50% { transform: translateY(-10px) rotate(4deg) scale(1.08); }
    }

    .floating-vehicle {
      display: inline-block;
      animation: floatVehicle 2.2s ease-in-out infinite;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.5));
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0);
      white-space: nowrap; border: 0;
    }
  </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen p-1.5 md:p-2 select-none">

        waypoints: [
          {x:24,y:1},{x:22,y:1},{x:22,y:4},{x:18,y:4},{x:18,y:1},
          {x:14,y:1},{x:14,y:4},{x:10,y:4},{x:10,y:1},{x:6,y:1},
          {x:6,y:4},{x:2,y:4},{x:2,y:7},{x:7,y:7},{x:7,y:10},
          {x:12,y:10},{x:12,y:7},{x:17,y:7},{x:17,y:10},{x:22,y:10},
          {x:22,y:7},{x:27,y:7},{x:27,y:10},{x:30,y:10},{x:30,y:13},
          {x:25,y:13},{x:25,y:16},{x:20,y:16},{x:20,y:13},{x:15,y:13},
          {x:15,y:16},{x:10,y:16},{x:10,y:13},{x:5,y:13},{x:5,y:16},
          {x:2,y:16},{x:2,y:20},{x:8,y:20},{x:8,y:18},{x:14,y:18},
          {x:14,y:20},{x:20,y:20},{x:20,y:18},{x:26,y:18},{x:26,y:20},

      },
      3: {

        startCol: 22, startRow: 1,
        treeChance: 0.16, buildingChance: 0.22,
        trafficLights: [1,3,5,7,10,14,18],
        waypoints: [
          {x:22,y:1},{x:2,y:1},{x:2,y:19},{x:29,y:19},{x:29,y:4},
          {x:6,y:4},{x:6,y:16},{x:25,y:16},{x:25,y:7},{x:10,y:7},
          {x:10,y:13},{x:21,y:13},{x:21,y:10},{x:14,y:10},{x:14,y:20},
          {x:20,y:20},{x:20,y:18},{x:26,y:18},{x:26,y:20},{x:33,y:20},

        trafficLights: [1,4,8,12,16,20],
        waypoints: [
          {x:20,y:1},{x:3,y:1},{x:3,y:9},{x:10,y:9},{x:10,y:2},{x:10,y:18},
          {x:26,y:18},{x:26,y:3},{x:31,y:3},{x:31,y:16},{x:22,y:16},{x:22,y:5},
          {x:6,y:5},{x:6,y:11},{x:29,y:11},{x:29,y:14},{x:8,y:14},{x:8,y:20},
          {x:18,y:20},{x:18,y:3},{x:2,y:3},{x:2,y:20},{x:33,y:20},{x:33,y:1}
        ]
      }
    };

    const MAX_RACERS = 16;
    const cols = 36;
    const rows = 22;
    const TILE_SIZE = 32;

    // --------------------------
    // STATE
    // --------------------------
    let currentClass = "6H2";
    let currentTrackId = 1;
    let selectedDurationMinutes = 2;
    let raceDurationMs = selectedDurationMinutes * 60 * 1000;

    let selectedStudents = new Set(CLASS_ROSTERS["6H2"].slice(0, MAX_RACERS));
    let racers = [];
    let activeHazards = [];
    let activeAnimals = [];
    let activeRocks = [];
    let activeBoosts = [];
    let activeTrafficLights = [];
    let fireworks = [];

    let map = Array.from({ length: rows }, () => Array(cols).fill(0));
    let lapWaypoints = [];
    let cumulativeLengths = [0];
    let totalLapLength = 1;
    let currentTrackName = "City Boulevard";
    let finishLinePhase = false;
    let podiumLocked = [];
    let celebrationActive = false;

    let simulationSpeed = 1;
    let gameRunning = false;
    let animationFrameId = null;
    let lastTime = 0;
    let raceStartTime = 0;
    let remainingTimeMs = raceDurationMs;
    let lastPanelRenderTime = 0;

    let nextAnimalSpawnTime = 0;
    let nextRockSpawnTime = 0;
    let nextBoostSpawnTime = 0;
    let nextRandomHornTime = 0;

    let prevTopThreeNames = ["","",""];
    let commentatorTurn = 0;
    let commentaryStyleIndex = 0;
    let urgentAnnouncementQueue = [];
    let lastCommentaryWasUrgent = false;
    let lastSpeechStartTime = 0;
    let lastSpeechEndTime = 0;
    let emmaVoice = null;
    let andrewVoice = null;
    let ttsQueue = [];
    let ttsReadyTriggered = false;

    // --------------------------
    // DOM
    // --------------------------
    const selectionScreen = document.getElementById("selectionScreen");
    const gameScreen = document.getElementById("gameScreen");
    const studentGrid = document.getElementById("studentGrid");
    const selectedCountBadge = document.getElementById("selectedCountBadge");
    const activeClassBadge = document.getElementById("activeClassBadge");
    const raceTimerDisplay = document.getElementById("raceTimerDisplay");
    const leftRacerList = document.getElementById("leftRacerList");
    const commentaryBanner = document.getElementById("commentaryBanner");
    const commentaryText = document.getElementById("commentaryText");
    const hazardBanner = document.getElementById("hazardBanner");
    const hazardBannerIcon = document.getElementById("hazardBannerIcon");
    const hazardBannerText = document.getElementById("hazardBannerText");
    const messageOverlay = document.getElementById("messageOverlay");
    const messageTitle = document.getElementById("messageTitle");
    const podiumDetails = document.getElementById("podiumDetails");
    const winnerEmoji = document.getElementById("winnerEmoji");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // --------------------------
    // TRACK BUILD
    // --------------------------
    function buildTrackMap() {
      const cfg = TRACK_CONFIGS[currentTrackId];
      lapWaypoints = cfg.waypoints;
      currentTrackName = cfg.name;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          map[r][c] = 0;
        }
      }

      cumulativeLengths = [0];
      totalLapLength = 0;

      for (let i = 0; i < lapWaypoints.length; i++) {
        const p1 = lapWaypoints[i];
        const p2 = lapWaypoints[(i + 1) % lapWaypoints.length];
        const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        totalLapLength += segLen;
        cumulativeLengths.push(totalLapLength);
      }

      for (let i = 0; i < lapWaypoints.length; i++) {
        const p1 = lapWaypoints[i];
        const p2 = lapWaypoints[(i + 1) % lapWaypoints.length];
        const minX = Math.min(p1.x, p2.x);
        const maxX = Math.max(p1.x, p2.x);
        const minY = Math.min(p1.y, p2.y);
        const maxY = Math.max(p1.y, p2.y);

        for (let r = minY; r <= maxY; r++) {
          for (let c = minX; c <= maxX; c++) {
            map[r][c] = 1;
          }
        }
      }

      // background decorations
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (map[r][c] === 0) {
            if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
              if ((r + c) % 2 === 0) map[r][c] = 3;
            } else if (Math.random() < cfg.buildingChance) {
              map[r][c] = 2;
            } else if (Math.random() < cfg.treeChance) {
              map[r][c] = 3;
            }
          }
        }
      }
    }

    function getPointAlongTrack(distanceFromStart) {
      const total = totalLapLength;
      const wrapped = ((distanceFromStart % total) + total) % total;
      let seg = 0;
      while (seg < cumulativeLengths.length - 1 && wrapped > cumulativeLengths[seg + 1]) seg++;
      const a = lapWaypoints[seg];
      const b = lapWaypoints[(seg + 1) % lapWaypoints.length];
      const segStart = cumulativeLengths[seg];
      const segEnd = cumulativeLengths[seg + 1];
      const local = (wrapped - segStart) / Math.max(0.0001, segEnd - segStart);
      const x = a.x + (b.x - a.x) * local;
      const y = a.y + (b.y - a.y) * local;
      return { x, y, segIndex: seg, local };
    }

    function getRacerProgress(racer) {
      return racer.laps * totalLapLength + racer.distanceAlongCurrentLap;
    }

    function compareRacers(a, b) {
      return getRacerProgress(b) - getRacerProgress(a);
    }

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;

      emmaVoice = voices.find(v =>
        /microsoft.*emma/i.test(v.name) && /(online|natural)/i.test(v.name)
      ) || voices.find(v => /microsoft.*emma/i.test(v.name)) || voices.find(v =>
        /emma/i.test(v.name) && /(online|natural)/i.test(v.name)
      ) || voices.find(v => /emma/i.test(v.name)) || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));

      andrewVoice = voices.find(v =>
        /microsoft.*andrew/i.test(v.name) && /(online|natural)/i.test(v.name)
      ) || voices.find(v => /microsoft.*andrew/i.test(v.name)) || voices.find(v =>
        /andrew/i.test(v.name) && /(online|natural)/i.test(v.name)
      ) || voices.find(v => /andrew/i.test(v.name)) || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    }

    function speakCommentary(speaker, text, interrupt = false) {
      if (!('speechSynthesis' in window)) return;

      const synth = window.speechSynthesis;
      loadVoices();

      if (interrupt) {
        synth.cancel();
        ttsQueue = [];
      }

      if (synth.speaking || synth.pending) {
        if (!interrupt) {
          ttsQueue.push({ speaker, text });
          return;
        }
      }

      const utter = new SpeechSynthesisUtterance(text);
      utter.volume = 1;
      utter.rate = 1;
      utter.pitch = speaker === 'Emma' ? 1.05 : 0.96;
      utter.lang = 'en-US';

      if (speaker === 'Emma' && emmaVoice) utter.voice = emmaVoice;
      if (speaker === 'Andrew' && andrewVoice) utter.voice = andrewVoice;

      utter.onstart = () => {
        lastSpeechStartTime = performance.now();
        commentaryBanner.classList.remove('hidden');
        commentaryText.textContent = `${speaker}: ${text}`;
      };

      utter.onend = () => {
        lastSpeechEndTime = performance.now();
        commentaryBanner.classList.add('hidden');
        if (ttsQueue.length > 0) {
          const next = ttsQueue.shift();
          setTimeout(() => speakCommentary(next.speaker, next.text, false), 120);
        }
      };

      utter.onerror = () => {
        lastSpeechEndTime = performance.now();
        commentaryBanner.classList.add('hidden');
        if (ttsQueue.length > 0) {
          const next = ttsQueue.shift();
          setTimeout(() => speakCommentary(next.speaker, next.text, false), 120);
        }
      };

      try { synth.resume(); } catch (e) {}
      synth.speak(utter);
    }

    function ensureSpeechReadyAndAnnounce() {
      if (!('speechSynthesis' in window)) return;
      const synth = window.speechSynthesis;
      loadVoices();
      try { synth.resume(); } catch (e) {}
      if (!ttsReadyTriggered) {
        ttsReadyTriggered = true;
        setTimeout(() => {
          speakCommentary('Emma', 'Race starting. Emma and Andrew are live. Cars are on the grid and ready to go.', true);
        }, 250);
      }
    }

    function queueUrgentEventAnnouncement(text) {
      urgentAnnouncementQueue.push(text);
      if (urgentAnnouncementQueue.length > 5) urgentAnnouncementQueue.shift();
    }

    function processLiveCommentary(sortedRacers) {
      if (!sortedRacers || sortedRacers.length === 0) return;
      if (!('speechSynthesis' in window)) return;

      const synth = window.speechSynthesis;
      const now = performance.now();

      if (synth.speaking || synth.pending) {
        if (now - lastSpeechStartTime > 8500) {
          synth.cancel();
        } else {
          return;
        }
      }

      const first = sortedRacers[0];
      const second = sortedRacers[1];
      const third = sortedRacers[2];
      const oldFirst = prevTopThreeNames[0];
      const oldSecond = prevTopThreeNames[1];

      const firstChanged = oldFirst && first && first.name !== oldFirst;
      const secondChanged = second && oldSecond && second.name !== oldSecond;

      if (urgentAnnouncementQueue.length > 0 && !lastCommentaryWasUrgent && (now - lastSpeechEndTime > 220)) {
        const speaker = commentatorTurn % 2 === 0 ? 'Emma' : 'Andrew';
        commentatorTurn++;
        lastCommentaryWasUrgent = true;
        speakCommentary(speaker, urgentAnnouncementQueue.shift(), false);
        return;
      }

      if (now - lastSpeechEndTime < (firstChanged ? 180 : 550)) return;

      lastCommentaryWasUrgent = false;
      prevTopThreeNames = [
        first ? first.name : "",
        second ? second.name : "",
        third ? third.name : ""
      ];

      const speaker = commentatorTurn % 2 === 0 ? 'Emma' : 'Andrew';
      commentatorTurn++;
      commentaryStyleIndex++;

      let line = "";
      const v1 = VEHICLE_NAMES[first.emoji] || 'car';
      const v2 = second ? (VEHICLE_NAMES[second.emoji] || 'car') : 'car';
      const v3 = third ? (VEHICLE_NAMES[third.emoji] || 'car') : 'car';

      if (finishLinePhase) {
        const finishLines = [
          `Final sprint! ${first.name} in the ${v1} is leading, with ${second ? second.name + ' in the ' + v2 : 'the field'} closing in.`,
          `Checkered flag pressure! ${first.name} still leads in the ${v1}, chasing the finish with ${second ? second.name + ' right behind in the ' + v2 : 'the pack'}.`,
          `The finish is here! ${first.name} is pressing on in the ${v1}, just ahead of ${second ? second.name + ' in the ' + v2 : 'the rest of the field'}.`
        ];
        line = finishLines[commentaryStyleIndex % finishLines.length];
      } else if (firstChanged) {
        const leadLinesEmma = [
          `What a move! ${first.name} in the ${v1} has blasted into first place, passing ${oldFirst}. ${second.name} is now second in the ${v2}.`,
          `New leader! ${first.name} charges to the front in the ${v1}. ${second.name} is second in the ${v2}, and ${third.name} holds third in the ${v3}.`,
          `Amazing overtake! ${first.name} takes the lead in the ${v1}. ${second.name} is chasing in second in the ${v2}. The third-place battle continues.`
        ];
        const leadLinesAndrew = [
          `That is a huge pass! ${first.name} surges into first in the ${v1}, leaving ${oldFirst} behind. ${second.name} is next in the ${v2}.`,
          `Top of the field is changing! ${first.name} takes the lead in the ${v1}, with ${second.name} still in second in the ${v2}.`,
          `Huge move at the front! ${first.name} powers past ${oldFirst} and takes the lead in the ${v1}.`
        ];
        line = speaker === 'Emma' ? leadLinesEmma[commentaryStyleIndex % leadLinesEmma.length] : leadLinesAndrew[commentaryStyleIndex % leadLinesAndrew.length];
      } else if (secondChanged) {
        line = speaker === 'Emma'
          ? `Major battle for second! ${second.name} in the ${v2} just moved ahead of ${oldSecond}. ${first.name} still leads in the ${v1}.`
          : `The podium fight is hot! ${second.name} powers into second in the ${v2}, while ${first.name} remains ahead in the ${v1}.`;
      } else {
        const normalLines = [
          `${first.name} leads in the ${v1}, with ${second.name} in second in the ${v2} and ${third.name} in third in the ${v3}.`,
          `Top three are ${first.name} in the ${v1}, ${second.name} in the ${v2}, and ${third.name} in the ${v3}.`,
          `${first.name} is still out front in the ${v1}. ${second.name} is chasing in the ${v2}, and ${third.name} rounds out the podium in the ${v3}.`
        ];
        line = normalLines[commentaryStyleIndex % normalLines.length];
      }

      speakCommentary(speaker, line, false);
    }

    // --------------------------
    // AUDIO ENGINE
    // --------------------------
    let polySynth, bassSynth, hornSquareSynth, airHornSynth, crashSynth, boostSynth, musicLoop;
    let soundInitialized = false;

    async function initAudioEngine() {
      if (soundInitialized) return;
      try {
        await Tone.start();

        polySynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.02, decay: 0.12, sustain: 0.2, release: 0.2 }
        }).toDestination();
        polySynth.volume.value = -14;

        bassSynth = new Tone.MonoSynth({
          oscillator: { type: 'square' },
          envelope: { attack: 0.01, decay: 0.15, sustain: 0.08, release: 0.08 }
        }).toDestination();
        bassSynth.volume.value = -20;

        hornSquareSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'square' },
          envelope: { attack: 0.005, decay: 0.08, sustain: 0.25, release: 0.08 }
        }).toDestination();
        hornSquareSynth.volume.value = -12;

        airHornSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'fatsawtooth', count: 3, spread: 20 },
          envelope: { attack: 0.04, decay: 0.24, sustain: 0.4, release: 0.2 }
        }).toDestination();
        airHornSynth.volume.value = -18;

        crashSynth = new Tone.NoiseSynth({
          noise: { type: 'brown' },
          envelope: { attack: 0.002, decay: 0.5, sustain: 0.05, release: 0.25 }
        }).toDestination();
        crashSynth.volume.value = -16;

        boostSynth = new Tone.NoiseSynth({
          noise: { type: 'white' },
          envelope: { attack: 0.02, decay: 0.25, sustain: 0.1, release: 0.7 }
        }).toDestination();
        boostSynth.volume.value = -14;

        const melodyNotes = ['C5','E5','G5','E5','F5','A5','G5','E5','D5','F5','A5','F5','G5','B5','C6','G5'];
        const bassNotes = ['C3','C3','G2','G2','F2','F2','C3','C3','D2','D2','A2','A2','G2','G2','G2','B2'];
        let step = 0;

        musicLoop = new Tone.Loop((time) => {
          if (!gameRunning) return;
          polySynth.triggerAttackRelease(melodyNotes[step % melodyNotes.length], '16n', time);
          bassSynth.triggerAttackRelease(bassNotes[step % bassNotes.length], '8n', time);
          step++;
        }, '8n');

        Tone.Transport.bpm.value = 140;
        soundInitialized = true;
      } catch (e) {
        console.warn('Audio init warning:', e);
      }
    }

    function startBackgroundMusic() {
      if (!soundInitialized) return;
      try {
        if (Tone.Transport.state !== 'started') Tone.Transport.start();
        if (musicLoop && !musicLoop.state) musicLoop.start(0);
      } catch (e) {}
    }

    function stopBackgroundMusic() {
      if (!soundInitialized) return;
      try {
        if (musicLoop) musicLoop.stop();
      } catch (e) {}
    }

    function playCrashSound() {
      if (!soundInitialized) return;
      try {
        const now = Tone.now() + 0.01;
        crashSynth.triggerAttackRelease('4n', now);
        polySynth.triggerAttackRelease(['C2','F#2'], '8n', now + 0.1);
      } catch (e) {}
    }

    function playVariedCarHorn() {
      if (!soundInitialized) return;
      try {
        hornSquareSynth.triggerAttackRelease(['A5','C#6'], '16n', Tone.now() + 0.01);
      } catch (e) {}
    }

    function playStartSound() {
      if (!soundInitialized) return;
      try {
        const now = Tone.now() + 0.02;
        polySynth.triggerAttackRelease('C5', '16n', now);
        polySynth.triggerAttackRelease('C5', '16n', now + 0.12);
      } catch (e) {}
    }

    function playLapSound() {
      if (!soundInitialized) return;
      try {
        polySynth.triggerAttackRelease(['E5','G5','C6'], '16n', Tone.now() + 0.02);
      } catch (e) {}
    }

    function playBoostSound() {
      if (!soundInitialized) return;
      try {
        boostSynth.triggerAttackRelease('8n', Tone.now());
      } catch (e) {}
    }

          boostUntil: 0,
          crashedUntil: 0,

          isStoppedAtLight: false,

          laneOffset: (Math.random() - 0.5) * 0.8,

    function resetRaceState() {
      buildTrackMap();
      generateRacers();
      urgentAnnouncementQueue = [];
      lastCommentaryWasUrgent = false;
      prevTopThreeNames = ["","",""];
      lastSpeechStartTime = 0;
      lastSpeechEndTime = 0;
      finishLinePhase = false;
      podiumLocked = [];
      celebrationActive = false;
      lastPanelRenderTime = 0;
      raceStartTime = performance.now();
      remainingTimeMs = raceDurationMs;
      nextAnimalSpawnTime = 2000;
      nextRockSpawnTime = 1800;
      nextBoostSpawnTime = 2600;
      nextRandomHornTime = 1250;

      activeRocks = [];

      activeTrafficLights = TRACK_CONFIGS[currentTrackId].trafficLights.map((wpIdx, i) => ({

    function updateRaceTimerDisplay() {

      const secs = Math.ceil(totalMs / 1000);
      const minutes = String(Math.floor(secs / 60)).padStart(2, '0');

    }

    function getPodiumList() {
      return [...racers].sort((a,b) => {
        if (a.finishRank && b.finishRank) return a.finishRank - b.finishRank;

      }).slice(0,3);

    // --------------------------
    // HAZARDS / LIGHTS
    // --------------------------
    function updateTrafficLights(dt) {
      activeTrafficLights.forEach(light => {
        light.timer -= dt;
        if (light.timer <= 0) {
          if (light.state === 'green') {
            light.state = 'yellow';
            light.timer = 1200 + Math.random() * 600;
          } else if (light.state === 'yellow') {
            light.state = 'red';
            light.timer = 2600 + Math.random() * 1400;
          } else {
            light.state = 'green';
            light.timer = 3500 + Math.random() * 2200;
          }
        }
      });
    }

    function updateAnimalsAndHazards(now, dt) {
      if (now > nextAnimalSpawnTime && activeAnimals.length < 4) {
        const animalSpec = CROSSING_ANIMALS[Math.floor(Math.random() * CROSSING_ANIMALS.length)];
        const x = Math.floor(Math.random() * cols);
        const y = Math.floor(Math.random() * rows);
        const valid = map[y] && map[y][x] === 1;

        if (valid) {
          const dir = Math.random() < 0.5 ? -1 : 1;
          activeAnimals.push({
            emoji: animalSpec.emoji,
            name: animalSpec.name,
            tileX: x + 0.5,
            tileY: y + 0.5,
            endY: y + 0.5 + dir * 1.2,
            dir,
            speed: animalSpec.speed * 0.9,
            announced: false
          });
          hazardBannerIcon.textContent = animalSpec.emoji;
          hazardBannerText.textContent = `${animalSpec.emoji} ${animalSpec.name} crossing the road!`;
          hazardBanner.classList.remove('hidden');
          playVariedCarHorn();

          if (Math.random() < 0.7) {
            queueUrgentEventAnnouncement(`Heads up! A ${animalSpec.name} is crossing the road!`);
          }
        }

        nextAnimalSpawnTime = now + 2200 + Math.random() * 2600;
      }

      if (now > nextRockSpawnTime && activeRocks.length < 5) {
        const x = Math.floor(Math.random() * cols);
        const y = Math.floor(Math.random() * rows);
        if (map[y] && map[y][x] === 1) {
          activeRocks.push({
            tileX: x + 0.5,
            tileY: y + 0.5,
            expiresAt: now + 10000
          });
          nextRockSpawnTime = now + 2800 + Math.random() * 2200;
        }
      }

      if (now > nextBoostSpawnTime && activeBoosts.length < 4) {
        const x = Math.floor(Math.random() * cols);
        const y = Math.floor(Math.random() * rows);
        if (map[y] && map[y][x] === 1) {
          const tooClose = activeBoosts.some(b => Math.hypot(b.tileX - (x + 0.5), b.tileY - (y + 0.5)) < 1.2);
          if (!tooClose) {
            activeBoosts.push({ tileX: x + 0.5, tileY: y + 0.5 });
          }
        }
        nextBoostSpawnTime = now + 3500 + Math.random() * 2800;
      }

      if (now > nextRandomHornTime) {
        playVariedCarHorn();
        nextRandomHornTime = now + 1800 + Math.random() * 2600;
      }

      activeAnimals.forEach(animal => {
        animal.tileY += animal.dir * animal.speed * dt * 0.06;
      });

      activeAnimals = activeAnimals.filter(animal => {
        return animal.dir > 0 ? animal.tileY < animal.endY : animal.tileY > animal.endY;
      });

      activeRocks = activeRocks.filter(r => now < r.expiresAt);

      if (activeAnimals.length === 0 && !racers.some(r => now < r.crashedUntil)) {
        hazardBanner.classList.add('hidden');
      }
    }

    function computeRacerPosition(racer) {
      const p = getPointAlongTrack(racer.distanceAlongCurrentLap + racer.laps * totalLapLength);
      return { x: p.x + 0.5, y: p.y + 0.5 };
    }

    // --------------------------
    // RACE LOOP
    // --------------------------
    function updateRacers(now, dt) {
      const sorted = racers.slice().sort(compareRacers);
      const leader = sorted[0];

      const leadProgress = leader ? getRacerProgress(leader) : 0;

      racers.forEach((racer) => {
        if (racer.finishRank > 0) return;

        if (now < racer.crashedUntil) return;

        // crash into rock
        const rockHit = activeRocks.find(r => Math.hypot(racer.tileX - r.tileX, racer.tileY - r.tileY) < 0.7);
        if (rockHit) {
          activeRocks.splice(activeRocks.indexOf(rockHit), 1);
          racer.crashedUntil = now + 2200;
          playCrashSound();

          const phrase = `${racer.name} in the ${racer.vehicleName} smashed into a rock and crashed!`;
          queueUrgentEventAnnouncement(phrase);

          hazardBannerIcon.textContent = '🪨🔥💥';
          hazardBannerText.textContent = `ACCIDENT! ${racer.name} crashed!`;
          hazardBanner.classList.remove('hidden');
          return;
        }

        // boost pad
        const boostHit = activeBoosts.find(b => Math.hypot(racer.tileX - b.tileX, racer.tileY - b.tileY) < 0.75);
        if (boostHit) {
          activeBoosts.splice(activeBoosts.indexOf(boostHit), 1);
          racer.boostUntil = now + 2600;
          playBoostSound();

          const boostText = `${racer.name} hit a lightning boost and is ripping through the field!`;
          queueUrgentEventAnnouncement(boostText);
        }

        // animal blocking
        const blockedAnimal = activeAnimals.find(a => Math.hypot(racer.tileX - a.tileX, racer.tileY - a.tileY) < 0.9);
        if (blockedAnimal) {
          if (!racer.stoppedByAnimal) {
            if (!blockedAnimal.announced) {
              blockedAnimal.announced = true;
              const animalText = `${racer.name} in the ${racer.vehicleName} is stopped by a ${blockedAnimal.name} crossing the track!`;
              queueUrgentEventAnnouncement(animalText);
            }
          }
          racer.stoppedByAnimal = true;
          return;
        } else {
          racer.stoppedByAnimal = false;
        }

        // red / yellow light
        const nextLight = activeTrafficLights.find(light => light.wpIdx === racer.nextWaypointIndex || light.wpIdx === racer.closestWaypointIndex);
        if (nextLight && (nextLight.state === 'red' || nextLight.state === 'yellow')) {
          const dist = Math.hypot(racer.tileX - nextLight.x, racer.tileY - nextLight.y);
          if (dist < 1.2) {
            racer.isStoppedAtLight = true;
            const lightText = `${racer.name} is stopping for a ${nextLight.state} light in the ${racer.vehicleName}.`;
            queueUrgentEventAnnouncement(lightText);
            return;
          }
        } else {
          racer.isStoppedAtLight = false;
        }

        // speed update
        if (now > racer.speedChangeTimer) {
          const rankIndex = sorted.findIndex((r) => r.id === racer.id);
          const gap = Math.max(0, leadProgress - getRacerProgress(racer));

          let chaos = 0.78 + Math.random() * 0.65;
          if (rankIndex === 0) chaos = 0.72 + Math.random() * 0.35;
          else if (rankIndex <= 5) chaos = 0.92 + Math.random() * 0.7 + Math.min(0.4, gap * 0.02);
          else chaos = 1.1 + Math.random() * 0.9 + Math.min(0.6, gap * 0.025);

          if (Math.random() < 0.12 && rankIndex > 2) chaos *= 1.35;
          if (Math.random() < 0.08 && rankIndex === 0) chaos *= 0.7;

          racer.speed = racer.baseSpeed * chaos;
          racer.speedChangeTimer = now + 500 + Math.random() * 800;
        }

        let finalSpeed = racer.speed;
        if (now < racer.boostUntil) finalSpeed *= 2.35;
        if (finishLinePhase) finalSpeed *= 1.2;

        const moveDistance = finalSpeed * dt * 0.06 * simulationSpeed;
        racer.distanceAlongCurrentLap += moveDistance;

        while (racer.distanceAlongCurrentLap >= totalLapLength) {
          racer.distanceAlongCurrentLap -= totalLapLength;
          racer.laps += 1;
          playLapSound();

          // if near finish line and not already locked, start finish line phase
          const elapsed = performance.now() - raceStartTime;
          if (elapsed > raceDurationMs * 0.8) {
            finishLinePhase = true;
          }
        }

        // check finish line crossing
        if (racer.laps > 0 && racer.distanceAlongCurrentLap < 1.5 && racer.finishRank === 0 && finishLinePhase) {
          podiumLocked.push(racer);
          racer.finishRank = podiumLocked.length;
          if (podiumLocked.length >= 3) {
            endRace(true);
            return;
          }
        }

        const pos = computeRacerPosition(racer);
        racer.tileX = pos.x;
        racer.tileY = pos.y;

        const nextWpIndex = Math.floor((racer.distanceAlongCurrentLap % totalLapLength) / (totalLapLength / lapWaypoints.length));
        racer.closestWaypointIndex = nextWpIndex;
        racer.nextWaypointIndex = (nextWpIndex + 1) % lapWaypoints.length;

        if (racer.laps >= 1 && activityWindowReached(racer)) {
          const top3 = racers.slice().sort(compareRacers).slice(0,3);
          processLiveCommentary(top3);
        }
      });

      const nowMs = performance.now();
      if (nowMs - lastPanelRenderTime > 160) {
        lastPanelRenderTime = nowMs;
        renderLeftPanelDOM();
      }
    }

    function activityWindowReached(racer) {
      return true;
    }

    function renderLeftPanelDOM() {
      const ordered = racers.slice().sort(compareRacers);
      leftRacerList.innerHTML = ordered.map((r, index) => {
        const rank = index + 1;
        let badgeColor = 'bg-gray-700 text-gray-200';
        let cardBorder = 'border-gray-700 bg-gray-900/90';
        if (rank === 1) { badgeColor = 'bg-yellow-400 text-gray-900'; cardBorder = 'border-yellow-500/80 bg-gray-900'; }
        else if (rank === 2) { badgeColor = 'bg-gray-300 text-gray-900'; }
        else if (rank === 3) { badgeColor = 'bg-amber-600 text-white'; }

        const statusIcon = r.finishRank > 0
          ? `🏁#${r.finishRank}`
          : (nowOrCrashes(r) ? '🪨🔥💥' : (r.stoppedByAnimal ? '🐄' : (r.isStoppedAtLight ? '🔴' : (nowIsBoosted(r) ? '⚡' : `L${r.laps + 1}`))));

        return `
          <div class="flex items-center justify-between px-1.5 py-0.5 rounded-lg border ${cardBorder}">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="w-4 h-4 rounded-full text-[10px] font-black flex items-center justify-center shrink-0 ${badgeColor}">${rank}</span>
              <div class="flex flex-col items-start leading-none min-w-0">
                <span class="font-bold text-[11px] text-white truncate max-w-[68px]">${r.name}</span>
                <span class="text-base mt-0.5 leading-none">${r.emoji}</span>
              </div>
            </div>
            <div class="text-right shrink-0">
              <span class="text-[10px] font-extrabold text-yellow-400">${statusIcon}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function nowOrCrashes(r) {
      return performance.now() < r.crashedUntil;
    }

    function nowIsBoosted(r) {
      return performance.now() < r.boostUntil;
    }

    // --------------------------
    // DRAW
    // --------------------------
    function drawTrack() {
      const now = performance.now();
      ctx.fillStyle = '#4d8a3b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const tile = map[y][x];
          if (tile === 2) {
            ctx.fillStyle = '#374151';
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            ctx.font = `${TILE_SIZE * 0.7}px sans-serif`;
            ctx.fillText(EMOJIS.building[Math.floor(Math.random() * EMOJIS.building.length)], x * TILE_SIZE + 8, y * TILE_SIZE + 22);
          } else if (tile === 3) {
            ctx.fillStyle = '#2d5a2a';
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            ctx.font = `${TILE_SIZE * 0.7}px sans-serif`;
            ctx.fillText(EMOJIS.tree[Math.floor(Math.random() * EMOJIS.tree.length)], x * TILE_SIZE + 8, y * TILE_SIZE + 22);
          } else if (tile === 1) {
            ctx.fillStyle = '#6d8b47';
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          } else {
            ctx.fillStyle = '#2d7d46';
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      // road center line
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < lapWaypoints.length; i++) {
        const p1 = lapWaypoints[i];
        const p2 = lapWaypoints[(i + 1) % lapWaypoints.length];
        ctx.moveTo((p1.x + 0.5) * TILE_SIZE, (p1.y + 0.5) * TILE_SIZE);
        ctx.lineTo((p2.x + 0.5) * TILE_SIZE, (p2.y + 0.5) * TILE_SIZE);
      }
      ctx.stroke();

      // lights
      activeTrafficLights.forEach(light => {
        const px = (light.x + 0.5) * TILE_SIZE;
        const py = (light.y + 0.5) * TILE_SIZE;

        ctx.fillStyle = '#111827';
        ctx.fillRect(px - 8, py - 20, 16, 40);

        const colors = {
          green: '#22c55e',
          yellow: '#fbbf24',
          red: '#ef4444'
        };

        ctx.fillStyle = colors[light.state];
        ctx.beginPath();
        ctx.arc(px, py - 10, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#4b5563';
        ctx.beginPath();
        ctx.arc(px, py + 10, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // hazards
      activeAnimals.forEach(animal => {
        ctx.font = `${TILE_SIZE * 0.8}px sans-serif`;
        ctx.fillText(animal.emoji, animal.tileX * TILE_SIZE, animal.tileY * TILE_SIZE);
      });

      activeRocks.forEach(rock => {
        ctx.font = `${TILE_SIZE * 0.8}px sans-serif`;
        ctx.fillText('🪨', rock.tileX * TILE_SIZE, rock.tileY * TILE_SIZE);
      });

      activeBoosts.forEach(boost => {
        ctx.font = `${TILE_SIZE * 0.9}px sans-serif`;
        ctx.fillText('⚡', boost.tileX * TILE_SIZE, boost.tileY * TILE_SIZE);
      });

      // racers
      racers.forEach(racer => {
        const rx = racer.tileX * TILE_SIZE;
        const ry = racer.tileY * TILE_SIZE;

        ctx.save();
        ctx.translate(rx, ry);

        if (racer.facingRight) ctx.scale(-1, 1);
        if (performance.now() < racer.crashedUntil) ctx.rotate((now * 0.014) % (Math.PI * 2));
        else if (racer.tiltAngle) ctx.rotate(racer.tiltAngle);

        ctx.font = `${TILE_SIZE * 0.8}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(racer.emoji, 0, 0);

        if (performance.now() < racer.boostUntil && performance.now() >= racer.crashedUntil) {
          ctx.font = `${TILE_SIZE * 0.45}px sans-serif`;
          ctx.fillText('💨', TILE_SIZE * 0.65, 0);
        }

        ctx.restore();

        if (performance.now() < racer.crashedUntil) {
          ctx.font = `${TILE_SIZE * 0.6}px sans-serif`;
          ctx.fillText('🪨🔥💥', rx, ry - TILE_SIZE * 0.55);
        } else if (racer.stoppedByAnimal) {
          ctx.font = `${TILE_SIZE * 0.42}px sans-serif`;
          ctx.fillText('🛑', rx, ry - TILE_SIZE * 0.48);
        }
      });

      // finish line marker
      const finish = lapWaypoints[0];
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('🏁', (finish.x + 0.5) * TILE_SIZE, (finish.y + 0.5) * TILE_SIZE);
    }

    function updateCanvasSize() {
      const ratio = 1;
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      TILE_SIZE = Math.min(canvas.width / cols, canvas.height / rows);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // --------------------------
    // GAME FLOW
    // --------------------------
    async function startGame() {
      if (!selectedStudents || selectedStudents.size === 0) {
        selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS));
      }

      selectionScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      gameScreen.classList.add('flex');

      await initAudioEngine();
      startBackgroundMusic();
      resetRaceState();
      gameRunning = true;
      ttsReadyTriggered = false;
      ensureSpeechReadyAndAnnounce();

      const now = performance.now();
      lastTime = now;
      cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function endRace(wasWinner = false) {
      gameRunning = false;
      stopBackgroundMusic();

      const ordered = racers.slice().sort(compareRacers);
      const podium = ordered.slice(0,3);

      if (podium.length > 0) {
        const [first, second, third] = podium;
        const winnerText = `Winner: ${first.name}!`;
        messageTitle.textContent = winnerText;
        winnerEmoji.textContent = '🏆';
        podiumDetails.innerHTML = `
          <div class="bg-gray-800/90 rounded-lg p-2 border border-yellow-400">
            <div class="text-[10px] uppercase tracking-wide text-yellow-300 font-black">1st</div>
            <div class="font-black text-yellow-100">${first.name}</div>
            <div class="text-lg">${first.emoji}</div>
          </div>
          <div class="bg-gray-800/90 rounded-lg p-2 border border-gray-400">
            <div class="text-[10px] uppercase tracking-wide text-gray-300 font-black">2nd</div>
            <div class="font-black text-gray-100">${second ? second.name : '-'}</div>
            <div class="text-lg">${second ? second.emoji : '—'}</div>
          </div>
          <div class="bg-gray-800/90 rounded-lg p-2 border border-amber-600">
            <div class="text-[10px] uppercase tracking-wide text-amber-300 font-black">3rd</div>
            <div class="font-black text-amber-100">${third ? third.name : '-'}</div>
            <div class="text-lg">${third ? third.emoji : '—'}</div>
          </div>
        `;

        const winText = `${first.name} wins the race in the ${first.vehicleName}! Second place goes to ${second ? second.name : 'nobody'} in the ${second ? second.vehicleName : 'vehicle'}, and third place goes to ${third ? third.name : 'nobody'} in the ${third ? third.vehicleName : 'vehicle'}.`;
        queueUrgentEventAnnouncement(winText);
        speakCommentary('Emma', winText, true);
      }

      messageOverlay.classList.remove('hidden');
      messageOverlay.classList.add('flex');
      messageOverlay.classList.remove('pointer-events-none');
      messageOverlay.style.pointerEvents = 'auto';

      cancelAnimationFrame(animationFrameId);
    }

    function gameLoop(ts) {
      if (!gameRunning) return;

      const dt = Math.min(32, ts - lastTime || 16);
      lastTime = ts;
      remainingTimeMs = Math.max(0, raceDurationMs - (ts - raceStartTime));
      updateRaceTimerDisplay();

      const shouldEndByTime = remainingTimeMs <= 0;
      if (shouldEndByTime) {
        endRace();
        return;
      }

      updateTrafficLights(dt);
      updateAnimalsAndHazards(ts, dt);
      updateRacers(ts, dt);

      drawTrack();
      renderLeftPanelDOM();

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // --------------------------
    // EVENT BINDINGS
    // --------------------------
    function bindUI() {
      document.querySelectorAll('.class-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const className = btn.id.includes('6H2') ? '6H2' : '5M2';
          currentClass = className;
          selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS));
          setClassButtons();
          renderStudentGrid();
          updateSelectedBadge();
        });
      });

      document.querySelectorAll('.track-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentTrackId = Number(btn.dataset.track);
          if (!currentTrackId) currentTrackId = 1;
          setTrackButtons();
          buildTrackMap();
        });
      });

      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedDurationMinutes = Number(btn.dataset.mins);
          raceDurationMs = selectedDurationMinutes * 60 * 1000;
          remainingTimeMs = raceDurationMs;
          setTimeButtons();
          updateRaceTimerDisplay();
        });
      });

      document.getElementById('btnFirst16').addEventListener('click', selectFirst16);
      document.getElementById('btnRemaining').addEventListener('click', selectRemaining);
      document.getElementById('btnRandom16').addEventListener('click', selectRandom16);
      document.getElementById('btnClearAll').addEventListener('click', clearAll);

      document.getElementById('goToTrackBtn').addEventListener('click', async () => {
        await startGame();
      });

      document.getElementById('startButton').addEventListener('click', async () => {
        if (!gameRunning) {
          await startGame();
        } else {
          endRace(false);
          await startGame();
        }
      });

      document.getElementById('backButton').addEventListener('click', () => {
        gameRunning = false;
        cancelAnimationFrame(animationFrameId);
        selectionScreen.classList.remove('hidden');
        gameScreen.classList.add('hidden');
        gameScreen.classList.remove('flex');
        stopBackgroundMusic();
      });

      document.getElementById('quickSwitchClassBtn').addEventListener('click', () => {
        currentClass = currentClass === '6H2' ? '5M2' : '6H2';
        selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS));
        setClassButtons();
        renderStudentGrid();
        updateSelectedBadge();
      });

      document.getElementById('overlayRestartBtn').addEventListener('click', async () => {
        messageOverlay.classList.add('hidden');
        await startGame();
      });

      document.getElementById('overlayRosterBtn').addEventListener('click', () => {
        messageOverlay.classList.add('hidden');
        selectionScreen.classList.remove('hidden');
        gameScreen.classList.add('hidden');
        gameScreen.classList.remove('flex');
      });

      const slider = document.getElementById('speedSlider');
      if (slider) {
        slider.addEventListener('input', (e) => {
          simulationSpeed = Number(e.target.value);
        });
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
    }

    // --------------------------
    // INIT
    // --------------------------
    function init() {
      buildTrackMap();
      setClassButtons();
      setTrackButtons();
      setTimeButtons();
      renderStudentGrid();
      updateSelectedBadge();
      updateRosterSelectionByClicks();
      bindUI();
      updateRaceTimerDisplay();
      drawTrack();
      updateCanvasSize();
      window.addEventListener('resize', updateCanvasSize);
      window.addEventListener('load', () => {
        if ('speechSynthesis' in window) {
          loadVoices();
        }
      });
    }

    init();
  </script>
</body>
