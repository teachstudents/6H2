    :root {

      --panel: #1f2937;
      --line: #374151;
      --green: #22c55e;

      --red: #ef4444;
      --blue: #60a5fa;

      --text: #f3f4f6;

    html, body {
      margin: 0;
      height: 100%;

      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      touch-action: none;
    }

    * { box-sizing: border-box; }

    canvas {
      display: block;
      background: #4d8a3b;
      border: 3px solid #374151;
      border-radius: 0.75rem;
      width: 100%;
      height: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);

      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: #93c5fd;
      transform: translateY(-1px);

    .class-tab.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);

      border-color: #fde68a;
    }

    .track-btn.active {
      background: linear-gradient(135deg, #ec4899, #be185d);

      border-color: #f9a8d4;
    }

    .time-btn.active {
      background-color: #10b981;
      color: #111827;
      border-color: #6ee7b7;
    }

    @keyframes flash {

      50% { color: #f87171; transform: scale(1.12); }
    }

    .flash-red { animation: flash 0.45s ease-in-out; }

    }

    function buildTrackMap() {
      const cfg = TRACK_CONFIGS[currentTrackId];
      lapWaypoints = cfg.waypoints;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          map[r][c] = 0;
        }
      }

      cumulativeLengths = [0];
      totalLapLength = 0;

      for (let i = 0; i < lapWaypoints.length; i++) {
        const p1 = lapWaypoints[i];
        const p2 = lapWaypoints[(i + 1) % lapWaypoints.length];
        const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        totalLapLength += segLen;
        cumulativeLengths.push(totalLapLength);
      }

      for (let i = 0; i < lapWaypoints.length; i++) {
        const p1 = lapWaypoints[i];
        const p2 = lapWaypoints[(i + 1) % lapWaypoints.length];
        const minX = Math.min(p1.x, p2.x);
        const maxX = Math.max(p1.x, p2.x);
        const minY = Math.min(p1.y, p2.y);
        const maxY = Math.max(p1.y, p2.y);

        for (let r = minY; r <= maxY; r++) {
          for (let c = minX; c <= maxX; c++) {
            map[r][c] = 1;
          }
        }
      }

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (map[r][c] === 0) {
            if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
              if ((r + c) % 2 === 0) map[r][c] = 3;
            } else if (Math.random() < cfg.buildingChance) {
              map[r][c] = 2;
            } else if (Math.random() < cfg.treeChance) {
              map[r][c] = 3;
            }
          }
        }
      }

      emojiMap = map.map(row => row.map(tile => {
        if (tile === 2) return EMOJIS.building[Math.floor(Math.random() * EMOJIS.building.length)];
        if (tile === 3) return EMOJIS.tree[Math.floor(Math.random() * EMOJIS.tree.length)];
        return null;
      }));
    }

    function getPointAlongTrack(distanceFromStart) {
      const wrapped = ((distanceFromStart % totalLapLength) + totalLapLength) % totalLapLength;
      let segIndex = 0;

      while (segIndex < cumulativeLengths.length - 1 && wrapped > cumulativeLengths[segIndex + 1]) {
        segIndex++;
      }

      const segStart = cumulativeLengths[segIndex];
      const segEnd = cumulativeLengths[segIndex + 1];
      const localT = (wrapped - segStart) / Math.max(0.0001, segEnd - segStart);

      const a = lapWaypoints[segIndex];
      const b = lapWaypoints[(segIndex + 1) % lapWaypoints.length];

      return {
        x: a.x + (b.x - a.x) * localT,
        y: a.y + (b.y - a.y) * localT
      };
    }

    function getRacerProgress(racer) {
      return racer.laps * totalLapLength + racer.distanceAlongCurrentLap;
    }

    function compareRacers(a, b) {
      return getRacerProgress(b) - getRacerProgress(a);
    }

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;

      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;

      const englishMicrosoftVoices = voices.filter(v => /^en/i.test(v.lang) && /microsoft/i.test(v.name));
      const femaleMicrosoftVoices = englishMicrosoftVoices.filter(v => /aria|zira|jenny|hazel|susan|ivy|ava|zoe|luna|samantha|cora|amanda/i.test(v.name));
      const maleMicrosoftVoices = englishMicrosoftVoices.filter(v => /david|mark|steffan|jason|guy|michael|john|robert|mason|ryan|jesse/i.test(v.name));

      const pickPreferred = (preferredList, fallbackList) => {
        if (preferredList.length) return preferredList[0];
        const fallback = fallbackList.find(v => /^en/i.test(v.lang));
        return fallback || voices[0];
      };

      emmaVoice = pickPreferred(femaleMicrosoftVoices, englishMicrosoftVoices);
      andrewVoice = pickPreferred(maleMicrosoftVoices, englishMicrosoftVoices);
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakCommentary(speaker, text, interrupt = false) {
      if (!("speechSynthesis" in window)) return;
      const synth = window.speechSynthesis;
      loadVoices();

      if (interrupt) {
        synth.cancel();
        ttsQueue = [];
      }

      if (synth.speaking || synth.pending) {
        if (!interrupt) {
          ttsQueue.push({ speaker, text });
          return;
        }
      }

      const utter = new SpeechSynthesisUtterance(text);
      utter.volume = 1.0;
      utter.rate = 1.0;
      utter.pitch = speaker === "Emma" ? 1.04 : 0.96;
      utter.lang = "en-US";

      const preferredVoice = speaker === "Emma" ? emmaVoice : andrewVoice;
      if (preferredVoice) utter.voice = preferredVoice;

      if (!utter.voice) {
        const englishVoice = synth.getVoices().find(v => /^en/i.test(v.lang));
        if (englishVoice) utter.voice = englishVoice;
      }

      utter.onstart = () => {
        lastSpeechStartTime = performance.now();
        commentaryBanner.classList.remove("hidden");
        commentaryText.textContent = `${speaker}: ${text}`;
      };

      utter.onend = () => {
        lastSpeechEndTime = performance.now();
        commentaryBanner.classList.add("hidden");

        if (ttsQueue.length > 0) {
          const next = ttsQueue.shift();
          setTimeout(() => speakCommentary(next.speaker, next.text, false), 120);
        }
      };

      utter.onerror = () => {
        lastSpeechEndTime = performance.now();
        commentaryBanner.classList.add("hidden");

        if (ttsQueue.length > 0) {
          const next = ttsQueue.shift();
          setTimeout(() => speakCommentary(next.speaker, next.text, false), 120);
        }
      };

      try { synth.resume(); } catch (e) {}
      synth.speak(utter);
    }

    function queueUrgentEventAnnouncement(text) {
      urgentAnnouncementQueue.push(text);
      if (urgentAnnouncementQueue.length > 8) urgentAnnouncementQueue.shift();
    }

    function processLiveCommentary(sortedRacers) {
      if (!("speechSynthesis" in window) || !sortedRacers || sortedRacers.length === 0) return;

      const synth = window.speechSynthesis;
      const now = performance.now();

      if (synth.speaking || synth.pending) {
        if (now - lastSpeechStartTime > 8500) {
          synth.cancel();
        } else {
          return;
        }
      }

      const first = sortedRacers[0];
      const second = sortedRacers[1];
      const third = sortedRacers[2];

      const oldFirst = prevTopThreeNames[0];
      const oldSecond = prevTopThreeNames[1];
      const firstChanged = oldFirst && first && first.name !== oldFirst;
      const secondChanged = second && oldSecond && second.name !== oldSecond;

      if (urgentAnnouncementQueue.length > 0 && !lastCommentaryWasUrgent && (now - lastSpeechEndTime > 180)) {
        const line = urgentAnnouncementQueue.shift();
        lastCommentaryWasUrgent = true;
        speakCommentary(nextSpeaker, line, false);
        nextSpeaker = nextSpeaker === "Emma" ? "Andrew" : "Emma";
        return;
      }

      if (now - lastSpeechEndTime < (firstChanged ? 220 : 600)) return;

      lastCommentaryWasUrgent = false;
      prevTopThreeNames = [first ? first.name : "", second ? second.name : "", third ? third.name : ""];

      const speaker = nextSpeaker;
      nextSpeaker = nextSpeaker === "Emma" ? "Andrew" : "Emma";

      const v1 = VEHICLE_NAMES[first.emoji] || "car";
      const v2 = second ? (VEHICLE_NAMES[second.emoji] || "car") : "car";
      const v3 = third ? (VEHICLE_NAMES[third.emoji] || "car") : "car";

      let line = "";

      if (finishLinePhase) {
        const finishLines = [
          `Final sprint! ${first.name} in the ${v1} is leading the charge towards the finish line, with ${second ? second.name + " in the " + v2 : "the field"} still chasing.`,
          `This is the finish! ${first.name} holds the lead in the ${v1}, while ${second ? second.name + " in the " + v2 : "the rest of the field"} pushes for second.`,
          `${first.name} is pushing hard in the ${v1} as the race reaches the checkered flag. ${second ? second.name + " is right behind in the " + v2 : "The pack is close behind."}`
        ];
        line = finishLines[commentaryStyleIndex % finishLines.length];
      } else if (firstChanged) {
        const leadEmma = [
          `What a move! ${first.name} in the ${v1} has just taken the lead from ${oldFirst}. ${second.name} is now in second place in the ${v2}.`,
          `New leader on the track! ${first.name} surges into first in the ${v1}. ${second.name} is chasing hard in the ${v2}.`,
          `Amazing pass! ${first.name} takes the lead in the ${v1}, leaving ${oldFirst} behind. ${second.name} stays close in second in the ${v2}.`
        ];

        const leadAndrew = [
          `That is a big change at the front! ${first.name} drives the ${v1} into first place, passing ${oldFirst}. ${second.name} is right behind in the ${v2}.`,
          `Huge move! ${first.name} marches to the front in the ${v1}, and ${second.name} is now chasing in second in the ${v2}.`,
          `A brilliant overtake! ${first.name} gets ahead in the ${v1}, while ${second.name} stays in second in the ${v2}.`
        ];

        line = speaker === "Emma"
          ? leadEmma[commentaryStyleIndex % leadEmma.length]
          : leadAndrew[commentaryStyleIndex % leadAndrew.length];
      } else if (secondChanged) {
        line = speaker === "Emma"
          ? `Big battle for second place! ${second.name} in the ${v2} has moved ahead of ${oldSecond}, while ${first.name} still leads in the ${v1}.`
          : `The podium battle is heating up! ${second.name} in the ${v2} has moved into second, while ${first.name} remains in front in the ${v1}.`;
      } else {
        const standardLines = [
          `${first.name} leads the race in the ${v1}, with ${second.name} in second in the ${v2} and ${third.name} in third in the ${v3}.`,
          `Top three right now: ${first.name} in the ${v1}, ${second.name} in the ${v2}, and ${third.name} in the ${v3}.`,
          `${first.name} is still out front in the ${v1}. ${second.name} is close behind in the ${v2}, and ${third.name} is holding third in the ${v3}.`
        ];
        line = standardLines[commentaryStyleIndex % standardLines.length];
      }

      commentaryStyleIndex++;
      speakCommentary(speaker, line, false);
    }

    let polySynth, bassSynth, hornSquareSynth, airHornSynth, crashSynth, boostSynth, musicLoop;
    let soundInitialized = false;

    async function initAudioEngine() {
      if (soundInitialized) return;
      try {
        await Tone.start();

        polySynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.02, decay: 0.12, sustain: 0.2, release: 0.2 }
        }).toDestination();
        polySynth.volume.value = -14;

        bassSynth = new Tone.MonoSynth({
          oscillator: { type: 'square' },
          envelope: { attack: 0.01, decay: 0.15, sustain: 0.08, release: 0.08 }
        }).toDestination();
        bassSynth.volume.value = -20;

        hornSquareSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'square' },
          envelope: { attack: 0.005, decay: 0.08, sustain: 0.25, release: 0.08 }
        }).toDestination();
        hornSquareSynth.volume.value = -12;

        airHornSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'fatsawtooth', count: 3, spread: 20 },
          envelope: { attack: 0.04, decay: 0.24, sustain: 0.4, release: 0.2 }
        }).toDestination();
        airHornSynth.volume.value = -18;

        crashSynth = new Tone.NoiseSynth({
          noise: { type: 'brown' },
          envelope: { attack: 0.002, decay: 0.5, sustain: 0.05, release: 0.25 }
        }).toDestination();
        crashSynth.volume.value = -16;

        boostSynth = new Tone.NoiseSynth({
          noise: { type: 'white' },
          envelope: { attack: 0.02, decay: 0.25, sustain: 0.1, release: 0.7 }
        }).toDestination();
        boostSynth.volume.value = -14;

        const melodyNotes = ['C5','E5','G5','E5','F5','A5','G5','E5','D5','F5','A5','F5','G5','B5','C6','G5'];
        const bassNotes = ['C3','C3','G2','G2','F2','F2','C3','C3','D2','D2','A2','A2','G2','G2','G2','B2'];
        let step = 0;

        musicLoop = new Tone.Loop((time) => {
          if (!gameRunning) return;
          polySynth.triggerAttackRelease(melodyNotes[step % melodyNotes.length], '16n', time);
          bassSynth.triggerAttackRelease(bassNotes[step % bassNotes.length], '8n', time);
          step++;
        }, '8n');

        Tone.Transport.bpm.value = 140;
        soundInitialized = true;
      } catch (e) {
        console.warn('Audio init warning:', e);
      }
    }

    function startBackgroundMusic() {
      if (!soundInitialized) return;
      try {
        if (Tone.Transport.state !== 'started') Tone.Transport.start();
        if (musicLoop && musicLoop.state !== 'started') musicLoop.start(0);
      } catch (e) {}
    }

    function stopBackgroundMusic() {
      if (!soundInitialized) return;
      try {

    function setMusicAndHornsDucked(isDucked) {

    function updateTrafficLights(dt) {
      activeTrafficLights.forEach(light => {
        light.timer -= dt;
        if (light.timer <= 0) {
          if (light.state === 'green') {
            light.state = 'yellow';
            light.timer = 1200 + Math.random() * 600;
          } else if (light.state === 'yellow') {
            light.state = 'red';
            light.timer = 2600 + Math.random() * 1400;
          } else {
            light.state = 'green';
            light.timer = 3500 + Math.random() * 2200;
          }
        }
      });
    }

    function updateAnimalsAndHazards(now, dt) {
      if (now > nextAnimalSpawnTime && activeAnimals.length < 4) {
        const animalSpec = CROSSING_ANIMALS[Math.floor(Math.random() * CROSSING_ANIMALS.length)];
        const x = Math.floor(Math.random() * cols);
        const y = Math.floor(Math.random() * rows);

        if (map[y] && map[y][x] === 1) {
          const dir = Math.random() < 0.5 ? -1 : 1;
          activeAnimals.push({
            emoji: animalSpec.emoji,
            name: animalSpec.name,
            tileX: x + 0.5,
            tileY: y + 0.5,
            endY: y + 0.5 + dir * 1.2,
            dir,
            speed: animalSpec.speed * 0.9,
            announced: false
          });

          hazardBannerIcon.textContent = animalSpec.emoji;
          hazardBannerText.textContent = `${animalSpec.emoji} ${animalSpec.name} crossing the road!`;
          hazardBanner.classList.remove('hidden');
          playVariedCarHorn();

          if (Math.random() < 0.7) {
            queueUrgentEventAnnouncement(`Heads up! A ${animalSpec.name} is crossing the road!`);
          }
        }
        nextAnimalSpawnTime = now + 2200 + Math.random() * 2600;
      }

      if (now > nextRockSpawnTime && activeRocks.length < 5) {
        const x = Math.floor(Math.random() * cols);
        const y = Math.floor(Math.random() * rows);
        if (map[y] && map[y][x] === 1) {
          activeRocks.push({ tileX: x + 0.5, tileY: y + 0.5, expiresAt: now + 10000 });
          nextRockSpawnTime = now + 2800 + Math.random() * 2200;
        }
      }

      if (now > nextBoostSpawnTime && activeBoosts.length < 4) {
        const x = Math.floor(Math.random() * cols);
        const y = Math.floor(Math.random() * rows);
        if (map[y] && map[y][x] === 1) {
          const alreadyOccupied = activeBoosts.some(b => Math.hypot(b.tileX - (x + 0.5), b.tileY - (y + 0.5)) < 1.4);
          if (!alreadyOccupied) activeBoosts.push({ tileX: x + 0.5, tileY: y + 0.5 });
        }
        nextBoostSpawnTime = now + 3500 + Math.random() * 2800;
      }

      if (now > nextRandomHornTime) {
        playVariedCarHorn();
        nextRandomHornTime = now + 1800 + Math.random() * 2600;
      }

      activeAnimals.forEach(animal => {
        animal.tileY += animal.dir * animal.speed * dt * 0.06;
      });

      activeAnimals = activeAnimals.filter(animal => animal.dir > 0 ? animal.tileY < animal.endY : animal.tileY > animal.endY);
      activeRocks = activeRocks.filter(r => now < r.expiresAt);

      if (activeAnimals.length === 0 && !racers.some(r => now < r.crashedUntil)) {
        hazardBanner.classList.add('hidden');
      }
    }

    function renderTrack() {
      const canvasWidth = canvas.width;
      const canvasHeight = canvas.height;
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      ctx.fillStyle = '#3c7a34';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const tile = map[row][col];
          const px = col * TILE_SIZE;
          const py = row * TILE_SIZE;

          if (tile === 2) {
            ctx.fillStyle = '#4b5563';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#d1d5db';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText(emojiMap[row][col], px + 8, py + 22);
          } else if (tile === 3) {
            ctx.fillStyle = '#2d5d36';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#86efac';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText(emojiMap[row][col], px + 8, py + 22);
          } else {
            ctx.fillStyle = '#4d8a3b';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          }

          if (tile === 1) {
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.strokeRect(px + 0.5, py + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
          }
        }
      }

      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 18 * TILE_SIZE + 8);
      ctx.lineTo(cols * TILE_SIZE, 18 * TILE_SIZE + 8);
      ctx.stroke();

      activeBoosts.forEach(boost => {
        ctx.fillStyle = '#60a5fa';
        ctx.beginPath();
        ctx.arc(boost.tileX * TILE_SIZE, boost.tileY * TILE_SIZE, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('⚡', boost.tileX * TILE_SIZE - 8, boost.tileY * TILE_SIZE + 6);
      });

      activeRocks.forEach(rock => {
        ctx.fillStyle = '#6b7280';
        ctx.beginPath();
        ctx.arc(rock.tileX * TILE_SIZE, rock.tileY * TILE_SIZE, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillText('🪨', rock.tileX * TILE_SIZE - 8, rock.tileY * TILE_SIZE + 6);
      });

      activeAnimals.forEach(animal => {
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText(animal.emoji, animal.tileX * TILE_SIZE - 10, animal.tileY * TILE_SIZE + 7);
      });

      activeTrafficLights.forEach(light => {
        const x = light.x * TILE_SIZE;
        const y = light.y * TILE_SIZE;
        const color = light.state === 'green' ? '#22c55e' : light.state === 'yellow' ? '#fbbf24' : '#ef4444';
        ctx.fillStyle = '#111827';
        ctx.fillRect(x - 6, y - 18, 12, 36);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y - 10, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      racers.forEach(racer => {
        const x = racer.tileX * TILE_SIZE;
        const y = racer.tileY * TILE_SIZE;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(racer.tiltAngle);
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(racer.emoji, 0, 0);
        ctx.restore();
      });
    }

    function resizeCanvas() {
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      const size = Math.min(rect.width, rect.height);
      TILE_SIZE = Math.max(18, size / cols);
      canvas.width = cols * TILE_SIZE;
      canvas.height = rows * TILE_SIZE;
      renderTrack();
    }

    function startRace() {
      if (selectedStudents.size === 0) return;
      gameRunning = true;
      selectionScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      resetRaceState();
      initAudioEngine();
      startBackgroundMusic();
      playStartSound();
      if (typeof window !== 'undefined') {
        window.addEventListener('resize', resizeCanvas);
      }
      resizeCanvas();
    }

    function stopRace() {
      gameRunning = false;
      stopBackgroundMusic();
      window.speechSynthesis?.cancel?.();
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      messageOverlay.classList.add('hidden');
    }

    function showRoster() {
      stopRace();
      gameScreen.classList.add('hidden');
      selectionScreen.classList.remove('hidden');
    }

    function updateRace(dt) {
      if (!gameRunning) return;

      remainingTimeMs = Math.max(0, raceDurationMs - (performance.now() - raceStartTime));
      updateRaceTimerDisplay();

      if (remainingTimeMs <= 0) {
        gameRunning = false;
        stopBackgroundMusic();
        return;
      }

      updateTrafficLights(dt);
      updateAnimalsAndHazards(performance.now(), dt);

      racers.forEach(racer => {
        const currentLight = activeTrafficLights.find(light => Math.abs(light.x - racer.tileX) < 0.8 && Math.abs(light.y - racer.tileY) < 0.8);
        if (currentLight && currentLight.state === 'red') {
          racer.isStoppedAtLight = true;
          racer.speed *= 0.2;
        } else {
          racer.isStoppedAtLight = false;
        }

        const boost = activeBoosts.find(b => Math.hypot(b.tileX - racer.tileX, b.tileY - racer.tileY) < 0.8);
        if (boost) {
          racer.speed += 0.02;
          racer.boostUntil = performance.now() + 1300;
          boost.tileX = -999;
          boost.tileY = -999;
          playBoostSound();
        }

        if (performance.now() < racer.boostUntil) {
          racer.speed = Math.min(racer.speed + 0.03, 0.75);
        }

        racer.distanceAlongCurrentLap += racer.speed * dt * 0.04 * simulationSpeed;
        if (racer.distanceAlongCurrentLap >= totalLapLength) {
          racer.laps += 1;
          racer.distanceAlongCurrentLap = 0;
          playLapSound();
        }

        const pos = getPointAlongTrack(racer.distanceAlongCurrentLap);
        racer.tileX = pos.x;
        racer.tileY = pos.y;
      });

      renderTrack();
      renderLeftPanelDOM();
      processLiveCommentary(racers.slice().sort(compareRacers));
    }

    function animate(ts) {
      if (!lastTime) lastTime = ts;
      const dt = Math.min(32, ts - lastTime);
      lastTime = ts;
      if (gameRunning) updateRace(dt);
      animationFrameId = requestAnimationFrame(animate);
    }

    document.getElementById('goToTrackBtn').addEventListener('click', () => {
      startRace();
    });

    document.getElementById('startButton').addEventListener('click', () => {
      if (!gameRunning) {
        startRace();
      }
    });

    document.getElementById('backButton').addEventListener('click', () => {
      showRoster();
    });

    document.getElementById('overlayRestartBtn').addEventListener('click', () => {
      startRace();
    });

    document.getElementById('overlayRosterBtn').addEventListener('click', () => {
      showRoster();
    });

    document.querySelectorAll('.track-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTrackId = Number(btn.dataset.track);
        setTrackButtons();
      });
    });

    document.querySelectorAll('.time-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedDurationMinutes = Number(btn.dataset.mins);
        raceDurationMs = selectedDurationMinutes * 60 * 1000;
        setTimeButtons();
      });
    });

    document.getElementById('classBtn6H2').addEventListener('click', () => {
      currentClass = '6H2';
      setClassButtons();
      renderStudentGrid();
      updateSelectedBadge();
    });

    document.getElementById('classBtn5M2').addEventListener('click', () => {
      currentClass = '5M2';
      setClassButtons();
      renderStudentGrid();
      updateSelectedBadge();
    });

    document.getElementById('btnFirst16').addEventListener('click', selectFirst16);
    document.getElementById('btnRemaining').addEventListener('click', selectRemaining);
    document.getElementById('btnRandom16').addEventListener('click', selectRandom16);
    document.getElementById('btnClearAll').addEventListener('click', clearAll);

    document.getElementById('quickSwitchClassBtn').addEventListener('click', () => {
      currentClass = currentClass === '6H2' ? '5M2' : '6H2';
      setClassButtons();
      renderStudentGrid();
      updateSelectedBadge();
    });

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      simulationSpeed = Number(e.target.value);
    });

    renderStudentGrid();
    updateSelectedBadge();
    setTrackButtons();
    setTimeButtons();
    setClassButtons();
    resizeCanvas();
    animationFrameId = requestAnimationFrame(animate);
  </script>
</body>
</html>
