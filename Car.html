<!DOCTYPE html>

    :root {
      --bg: #111827;
      --panel: #1f2937;
      --line: #374151;
      --green: #22c55e;
      --amber: #fbbf24;
      --red: #ef4444;
      --blue: #60a5fa;
      --purple: #a78bfa;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      touch-action: none;
    }

    * { box-sizing: border-box; }

    canvas {
      display: block;
      background: #4d8a3b;
      border: 3px solid #374151;
      border-radius: 0.75rem;
      width: 100%;
      height: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .student-card.selected {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: #93c5fd;
      transform: translateY(-1px);
    }

    .class-tab.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #111827;
      border-color: #fde68a;
    }

    .track-btn.active {
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: white;
      border-color: #f9a8d4;
    }

    .time-btn.active {
      background-color: #10b981;
      color: #111827;
      border-color: #6ee7b7;
    }

    @keyframes flash {
      0%, 100% { color: #4ade80; transform: scale(1); }
      50% { color: #f87171; transform: scale(1.12); }
    }

    .flash-red { animation: flash 0.45s ease-in-out; }

    @keyframes floatVehicle {
      0%, 100% { transform: translateY(0px) rotate(-3deg) scale(1); }
      50% { transform: translateY(-12px) rotate(4deg) scale(1.08); }
    }

    .floating-vehicle {
      display: inline-block;
      animation: floatVehicle 2.2s ease-in-out infinite;
      filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5));
    }
  </style>
</head>

    function buildTrackMap() {
      const cfg = TRACK_CONFIGS[currentTrackId];
      lapWaypoints = cfg.waypoints;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          map[r][c] = 0;
        }
      }

      cumulativeLengths = [0];
      totalLapLength = 0;

      for (let i = 0; i < lapWaypoints.length; i++) {
        const p1 = lapWaypoints[i];
        const p2 = lapWaypoints[(i + 1) % lapWaypoints.length];
        const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        totalLapLength += segLen;
        cumulativeLengths.push(totalLapLength);
      }

      for (let i = 0; i < lapWaypoints.length; i++) {
        const p1 = lapWaypoints[i];
        const p2 = lapWaypoints[(i + 1) % lapWaypoints.length];
        const minX = Math.min(p1.x, p2.x);
        const maxX = Math.max(p1.x, p2.x);
        const minY = Math.min(p1.y, p2.y);
        const maxY = Math.max(p1.y, p2.y);

        for (let r = minY; r <= maxY; r++) {
          for (let c = minX; c <= maxX; c++) {
            map[r][c] = 1;
          }
        }
      }

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (map[r][c] === 0) {
            if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
              if ((r + c) % 2 === 0) map[r][c] = 3;
            } else if (Math.random() < cfg.buildingChance) {
              map[r][c] = 2;
            } else if (Math.random() < cfg.treeChance) {
              map[r][c] = 3;
            }
          }
        }
      }

      emojiMap = map.map(row => row.map(tile => {
        if (tile === 2) return EMOJIS.building[Math.floor(Math.random() * EMOJIS.building.length)];
        if (tile === 3) return EMOJIS.tree[Math.floor(Math.random() * EMOJIS.tree.length)];
        return null;
      }));
    }

    function getPointAlongTrack(distanceFromStart) {
      const wrapped = ((distanceFromStart % totalLapLength) + totalLapLength) % totalLapLength;
      let segIndex = 0;

      while (segIndex < cumulativeLengths.length - 1 && wrapped > cumulativeLengths[segIndex + 1]) {
        segIndex++;
      }

      const segStart = cumulativeLengths[segIndex];
      const segEnd = cumulativeLengths[segIndex + 1];
      const localT = (wrapped - segStart) / Math.max(0.0001, segEnd - segStart);

      const a = lapWaypoints[segIndex];
      const b = lapWaypoints[(segIndex + 1) % lapWaypoints.length];

      return {
        x: a.x + (b.x - a.x) * localT,
        y: a.y + (b.y - a.y) * localT
      };
    }

    function getRacerProgress(racer) {
      return racer.laps * totalLapLength + racer.distanceAlongCurrentLap;
    }

    function compareRacers(a, b) {
      return getRacerProgress(b) - getRacerProgress(a);
    }

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;

      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;

      emmaVoice = voices.find(v =>
        /emma/i.test(v.name) && /^en/i.test(v.lang)
      ) || voices.find(v => /^en/i.test(v.lang));

      andrewVoice = voices.find(v =>
        /andrew/i.test(v.name) && /^en/i.test(v.lang)
      ) || voices.find(v => /^en/i.test(v.lang));
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakCommentary(speaker, text, interrupt = false) {
      if (!("speechSynthesis" in window)) return;
      const synth = window.speechSynthesis;
      loadVoices();

      if (interrupt) {
        synth.cancel();
        ttsQueue = [];
      }

      if (synth.speaking || synth.pending) {
        if (!interrupt) {
          ttsQueue.push({ speaker, text });
          return;
        }
      }

      const utter = new SpeechSynthesisUtterance(text);
      utter.volume = 1.0;
      utter.rate = 1.0;
      utter.pitch = speaker === "Emma" ? 1.04 : 0.96;
      utter.lang = "en-US";

      const preferredVoice = speaker === "Emma" ? emmaVoice : andrewVoice;
      if (preferredVoice) utter.voice = preferredVoice;

      if (!utter.voice) {
        const englishVoice = synth.getVoices().find(v => /^en/i.test(v.lang));
        if (englishVoice) utter.voice = englishVoice;
      }

      utter.onstart = () => {
        lastSpeechStartTime = performance.now();
        commentaryBanner.classList.remove("hidden");
        commentaryText.textContent = `${speaker}: ${text}`;
      };

      utter.onend = () => {
        lastSpeechEndTime = performance.now();
        commentaryBanner.classList.add("hidden");

        if (ttsQueue.length > 0) {
          const next = ttsQueue.shift();
          setTimeout(() => speakCommentary(next.speaker, next.text, false), 120);
        }
      };

      utter.onerror = () => {
        lastSpeechEndTime = performance.now();
        commentaryBanner.classList.add("hidden");

        if (ttsQueue.length > 0) {
          const next = ttsQueue.shift();
          setTimeout(() => speakCommentary(next.speaker, next.text, false), 120);
        }
      };

      try { synth.resume(); } catch (e) {}
      synth.speak(utter);
    }

    function queueUrgentEventAnnouncement(text) {
      urgentAnnouncementQueue.push(text);
      if (urgentAnnouncementQueue.length > 8) urgentAnnouncementQueue.shift();
    }

    function processLiveCommentary(sortedRacers) {
      if (!("speechSynthesis" in window) || !sortedRacers || sortedRacers.length === 0) return;

      const synth = window.speechSynthesis;
      const now = performance.now();

      if (synth.speaking || synth.pending) {
        if (now - lastSpeechStartTime > 8500) {
          synth.cancel();
        } else {
          return;
        }
      }

      const first = sortedRacers[0];
      const second = sortedRacers[1];
      const third = sortedRacers[2];

      const oldFirst = prevTopThreeNames[0];
      const oldSecond = prevTopThreeNames[1];
      const firstChanged = oldFirst && first && first.name !== oldFirst;
      const secondChanged = second && oldSecond && second.name !== oldSecond;

      if (urgentAnnouncementQueue.length > 0 && !lastCommentaryWasUrgent && (now - lastSpeechEndTime > 180)) {
        const line = urgentAnnouncementQueue.shift();
        lastCommentaryWasUrgent = true;
        speakCommentary(nextSpeaker, line, false);
        nextSpeaker = nextSpeaker === "Emma" ? "Andrew" : "Emma";
        return;
      }

      if (now - lastSpeechEndTime < (firstChanged ? 220 : 600)) return;

      lastCommentaryWasUrgent = false;
      prevTopThreeNames = [first ? first.name : "", second ? second.name : "", third ? third.name : ""];

      const speaker = nextSpeaker;
      nextSpeaker = nextSpeaker === "Emma" ? "Andrew" : "Emma";

      const v1 = VEHICLE_NAMES[first.emoji] || "car";
      const v2 = second ? (VEHICLE_NAMES[second.emoji] || "car") : "car";
      const v3 = third ? (VEHICLE_NAMES[third.emoji] || "car") : "car";

      let line = "";

      if (finishLinePhase) {
        const finishLines = [
          `Final sprint! ${first.name} in the ${v1} is leading the charge towards the finish line, with ${second ? second.name + " in the " + v2 : "the field"} still chasing.`,
          `This is the finish! ${first.name} holds the lead in the ${v1}, while ${second ? second.name + " in the " + v2 : "the rest of the field"} pushes for second.`,
          `${first.name} is pushing hard in the ${v1} as the race reaches the checkered flag. ${second ? second.name + " is right behind in the " + v2 : "The pack is close behind."}`
        ];
        line = finishLines[commentaryStyleIndex % finishLines.length];
      } else if (firstChanged) {
        const leadEmma = [
          `What a move! ${first.name} in the ${v1} has just taken the lead from ${oldFirst}. ${second.name} is now in second place in the ${v2}.`,
          `New leader on the track! ${first.name} surges into first in the ${v1}. ${second.name} is chasing hard in the ${v2}.`,
          `Amazing pass! ${first.name} takes the lead in the ${v1}, leaving ${oldFirst} behind. ${second.name} stays close in second in the ${v2}.`
        ];

        const leadAndrew = [
          `That is a big change at the front! ${first.name} drives the ${v1} into first place, passing ${oldFirst}. ${second.name} is right behind in the ${v2}.`,
          `Huge move! ${first.name} marches to the front in the ${v1}, and ${second.name} is now chasing in second in the ${v2}.`,
          `A brilliant overtake! ${first.name} gets ahead in the ${v1}, while ${second.name} stays in second in the ${v2}.`
        ];

        line = speaker === "Emma"
          ? leadEmma[commentaryStyleIndex % leadEmma.length]
          : leadAndrew[commentaryStyleIndex % leadAndrew.length];
      } else if (secondChanged) {
        line = speaker === "Emma"
          ? `Big battle for second place! ${second.name} in the ${v2} has moved ahead of ${oldSecond}, while ${first.name} still leads in the ${v1}.`
          : `The podium battle is heating up! ${second.name} in the ${v2} has moved into second, while ${first.name} remains in front in the ${v1}.`;
      } else {
        const standardLines = [
          `${first.name} leads the race in the ${v1}, with ${second.name} in second in the ${v2} and ${third.name} in third in the ${v3}.`,
          `Top three right now: ${first.name} in the ${v1}, ${second.name} in the ${v2}, and ${third.name} in the ${v3}.`,
          `${first.name} is still out front in the ${v1}. ${second.name} is close behind in the ${v2}, and ${third.name} is holding third in the ${v3}.`
        ];
        line = standardLines[commentaryStyleIndex % standardLines.length];
      }

      commentaryStyleIndex++;
      speakCommentary(speaker, line, false);
    }

    let polySynth, bassSynth, hornSquareSynth, airHornSynth, crashSynth, boostSynth, musicLoop;
    let soundInitialized = false;

    async function initAudioEngine() {
      if (soundInitialized) return;
      try {
        await Tone.start();

        polySynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.02, decay: 0.12, sustain: 0.2, release: 0.2 }
        }).toDestination();
        polySynth.volume.value = -14;

        bassSynth = new Tone.MonoSynth({
          oscillator: { type: 'square' },
          envelope: { attack: 0.01, decay: 0.15, sustain: 0.08, release: 0.08 }
        }).toDestination();
        bassSynth.volume.value = -20;

        hornSquareSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'square' },
          envelope: { attack: 0.005, decay: 0.08, sustain: 0.25, release: 0.08 }
        }).toDestination();
        hornSquareSynth.volume.value = -12;

        airHornSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'fatsawtooth', count: 3, spread: 20 },
          envelope: { attack: 0.04, decay: 0.24, sustain: 0.4, release: 0.2 }
        }).toDestination();
        airHornSynth.volume.value = -18;

        crashSynth = new Tone.NoiseSynth({
          noise: { type: 'brown' },
          envelope: { attack: 0.002, decay: 0.5, sustain: 0.05, release: 0.25 }
        }).toDestination();
        crashSynth.volume.value = -16;

        boostSynth = new Tone.NoiseSynth({
          noise: { type: 'white' },
          envelope: { attack: 0.02, decay: 0.25, sustain: 0.1, release: 0.7 }
        }).toDestination();
        boostSynth.volume.value = -14;

        const melodyNotes = ['C5','E5','G5','E5','F5','A5','G5','E5','D5','F5','A5','F5','G5','B5','C6','G5'];
        const bassNotes = ['C3','C3','G2','G2','F2','F2','C3','C3','D2','D2','A2','A2','G2','G2','G2','B2'];
        let step = 0;

        musicLoop = new Tone.Loop((time) => {
          if (!gameRunning) return;
          polySynth.triggerAttackRelease(melodyNotes[step % melodyNotes.length], '16n', time);
          bassSynth.triggerAttackRelease(bassNotes[step % bassNotes.length], '8n', time);
          step++;
        }, '8n');

        Tone.Transport.bpm.value = 140;
        soundInitialized = true;
      } catch (e) {
        console.warn('Audio init warning:', e);
      }
    }

    function startBackgroundMusic() {
      if (!soundInitialized) return;
      try {
        if (Tone.Transport.state !== 'started') Tone.Transport.start();
        if (musicLoop && musicLoop.state !== 'started') musicLoop.start(0);
      } catch (e) {}
    }

    function stopBackgroundMusic() {
      if (!soundInitialized) return;
      try {
        if (musicLoop) musicLoop.stop();
      } catch (e) {}
    }

    function setMusicAndHornsDucked(isDucked) {
      if (!soundInitialized) return;

    }

    function playCrashSound() {
      if (!soundInitialized) return;

    function playVariedCarHorn() {
      if (!soundInitialized) return;

    function updateTrafficLights(dt) {
      activeTrafficLights.forEach(light => {
        light.timer -= dt;
        if (light.timer <= 0) {
          if (light.state === 'green') {
            light.state = 'yellow';
            light.timer = 1200 + Math.random() * 600;
          } else if (light.state === 'yellow') {
            light.state = 'red';
            light.timer = 2600 + Math.random() * 1400;
          } else {
            light.state = 'green';
            light.timer = 3500 + Math.random() * 2200;
          }
        }
      });
    }

    function updateAnimalsAndHazards(now, dt) {
      if (now > nextAnimalSpawnTime && activeAnimals.length < 4) {
        const animalSpec = CROSSING_ANIMALS[Math.floor(Math.random() * CROSSING_ANIMALS.length)];
        const x = Math.floor(Math.random() * cols);
        const y = Math.floor(Math.random() * rows);

        if (map[y] && map[y][x] === 1) {
          const dir = Math.random() < 0.5 ? -1 : 1;
          activeAnimals.push({
            emoji: animalSpec.emoji,
            name: animalSpec.name,
            tileX: x + 0.5,
            tileY: y + 0.5,
            endY: y + 0.5 + dir * 1.2,
            dir,
            speed: animalSpec.speed * 0.9,
            announced: false
          });

          hazardBannerIcon.textContent = animalSpec.emoji;
          hazardBannerText.textContent = `${animalSpec.emoji} ${animalSpec.name} crossing the road!`;
          hazardBanner.classList.remove('hidden');
          playVariedCarHorn();

          if (Math.random() < 0.7) {
            queueUrgentEventAnnouncement(`Heads up! A ${animalSpec.name} is crossing the road!`);
          }
        }
        nextAnimalSpawnTime = now + 2200 + Math.random() * 2600;
      }

      if (now > nextRockSpawnTime && activeRocks.length < 5) {
        const x = Math.floor(Math.random() * cols);
        const y = Math.floor(Math.random() * rows);
        if (map[y] && map[y][x] === 1) {
          activeRocks.push({ tileX: x + 0.5, tileY: y + 0.5, expiresAt: now + 10000 });
          nextRockSpawnTime = now + 2800 + Math.random() * 2200;
        }
      }

      if (now > nextBoostSpawnTime && activeBoosts.length < 4) {
        const x = Math.floor(Math.random() * cols);
        const y = Math.floor(Math.random() * rows);
        if (map[y] && map[y][x] === 1) {
          const alreadyOccupied = activeBoosts.some(b => Math.hypot(b.tileX - (x + 0.5), b.tileY - (y + 0.5)) < 1.4);
          if (!alreadyOccupied) activeBoosts.push({ tileX: x + 0.5, tileY: y + 0.5 });
        }
        nextBoostSpawnTime = now + 3500 + Math.random() * 2800;
      }

      if (now > nextRandomHornTime) {
        playVariedCarHorn();
        nextRandomHornTime = now + 1800 + Math.random() * 2600;
      }

      activeAnimals.forEach(animal => {
        animal.tileY += animal.dir * animal.speed * dt * 0.06;
      });

      activeAnimals = activeAnimals.filter(animal => animal.dir > 0 ? animal.tileY < animal.endY : animal.tileY > animal.endY);
      activeRocks = activeRocks.filter(r => now < r.expiresAt);

      if (activeAnimals.length === 0 && !racers.some(r => now < r.crashedUntil)) {
        hazardBanner.classList.add('hidden');
      }
    }

    function renderLeftPanelDOM() {
      const ordered = racers.slice().sort(compareRacers);
      leftRacerList.innerHTML = ordered.map((r, index) => {
        const rank = index + 1;
        let badgeColor = 'bg-gray-700 text-gray-200';
        let cardBorder = 'border-gray-700 bg-gray-900/90';

        if (rank === 1) { badgeColor = 'bg-yellow-400 text-gray-900'; cardBorder = 'border-yellow-500/80 bg-gray-900'; }
        else if (rank === 2) { badgeColor = 'bg-gray-300 text-gray-900'; }
        else if (rank === 3) { badgeColor = 'bg-amber-600 text-white'; }

        const now = performance.now();
        const isCrashed = now < r.crashedUntil;
        const isBoosted = now < r.boostUntil;
        const statusIcon = r.finishRank > 0
          ? `🏁#${r.finishRank}`
          : (isCrashed ? '🪨🔥💥' : (r.stoppedByAnimal ? '🐄' : (r.isStoppedAtLight ? '🔴' : (isBoosted ? '⚡' : `L${r.laps + 1}`))));

        return `
          <div class="flex items-center justify-between px-1.5 py-0.5 rounded-lg border ${cardBorder}">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="w-4 h-4 rounded-full text-[10px] font-black flex items-center justify-center shrink-0 ${badgeColor}">${rank}</span>
              <div class="flex flex-col items-start leading-none min-w-0">
                <span class="font-bold text-[11px] text-white truncate max-w-[68px]">${r.name}</span>
                <span class="text-base mt-0.5 leading-none">${r.emoji}</span>
              </div>
            </div>
            <div class="text-right shrink-0"><span class="text-[10px] font-extrabold text-yellow-400">${statusIcon}</span></div>
          </div>
        `;
      }).join('');
    }

    function drawTrack() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const tile = map[y][x];
          const px = x * TILE_SIZE;
          const py = y * TILE_SIZE;

          if (tile === 2) {
            ctx.fillStyle = '#374151';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.font = `${TILE_SIZE * 0.7}px sans-serif`;
            ctx.fillText(emojiMap[y][x] || '🏢', px + 8, py + 22);
          } else if (tile === 3) {
            ctx.fillStyle = '#2d5a2a';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.font = `${TILE_SIZE * 0.7}px sans-serif`;
            ctx.fillText(emojiMap[y][x] || '🌳', px + 8, py + 22);
          } else if (tile === 1) {
            ctx.fillStyle = '#6d8b47';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          } else {
            ctx.fillStyle = '#2d7d46';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();

      lapWaypoints.forEach((p, idx) => {
        const next = lapWaypoints[(idx + 1) % lapWaypoints.length];
        ctx.moveTo((p.x + 0.5) * TILE_SIZE, (p.y + 0.5) * TILE_SIZE);
        ctx.lineTo((next.x + 0.5) * TILE_SIZE, (next.y + 0.5) * TILE_SIZE);
      });

      ctx.stroke();

      activeTrafficLights.forEach(light => {
        const px = (light.x + 0.5) * TILE_SIZE;
        const py = (light.y + 0.5) * TILE_SIZE;

        ctx.fillStyle = '#111827';
        ctx.fillRect(px - 8, py - 20, 16, 40);

        const colors = { green: '#22c55e', yellow: '#fbbf24', red: '#ef4444' };
        ctx.fillStyle = colors[light.state];
        ctx.beginPath();
        ctx.arc(px, py - 10, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      activeAnimals.forEach(animal => {
        ctx.font = `${TILE_SIZE * 0.8}px sans-serif`;
        ctx.fillText(animal.emoji, animal.tileX * TILE_SIZE, animal.tileY * TILE_SIZE);
      });

      activeRocks.forEach(rock => {
        ctx.font = `${TILE_SIZE * 0.8}px sans-serif`;
        ctx.fillText('🪨', rock.tileX * TILE_SIZE, rock.tileY * TILE_SIZE);
      });

      activeBoosts.forEach(boost => {
        ctx.font = `${TILE_SIZE * 0.9}px sans-serif`;
        ctx.fillText('⚡', boost.tileX * TILE_SIZE, boost.tileY * TILE_SIZE);
      });

      racers.forEach(racer => {
        const rx = racer.tileX * TILE_SIZE;
        const ry = racer.tileY * TILE_SIZE;

        ctx.save();
        ctx.translate(rx, ry);

        if (racer.facingRight) ctx.scale(-1, 1);
        if (performance.now() < racer.crashedUntil) ctx.rotate((performance.now() * 0.015) % (Math.PI * 2));
        else if (racer.tiltAngle !== 0) ctx.rotate(racer.tiltAngle);

        ctx.font = `${TILE_SIZE * 0.78}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(racer.emoji, 0, 0);

        if (performance.now() < racer.boostUntil && performance.now() >= racer.crashedUntil) {
          ctx.font = `${TILE_SIZE * 0.5}px sans-serif`;
          ctx.fillText('💨', TILE_SIZE * 0.6, 0);
        }

        ctx.restore();

        if (performance.now() < racer.crashedUntil) {
          ctx.font = `${TILE_SIZE * 0.62}px sans-serif`;
          ctx.fillText('🪨🔥💥', rx, ry - TILE_SIZE * 0.55);
        } else if (racer.stoppedByAnimal) {
          ctx.font = `${TILE_SIZE * 0.42}px sans-serif`;
          ctx.fillText('🛑', rx, ry - TILE_SIZE * 0.48);
        }
      });

      const finish = lapWaypoints[0];
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('🏁', (finish.x + 0.5) * TILE_SIZE, (finish.y + 0.5) * TILE_SIZE);
    }

    function updateCanvasSize() {
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;
      canvas.width = Math.max(1, width);
      canvas.height = Math.max(1, height);
      TILE_SIZE = Math.min(canvas.width / cols, canvas.height / rows);
    }

    function endRace() {
      gameRunning = false;
      stopBackgroundMusic();

      const ordered = racers.slice().sort(compareRacers);
      const podium = ordered.slice(0, 3);

      if (podium.length > 0) {
        const [first, second, third] = podium;

        messageTitle.textContent = `${first.name} wins the race!`;
        winnerEmoji.textContent = '🏆';

        podiumDetails.innerHTML = `
          <div class="bg-gray-800/90 rounded-lg p-2 border border-yellow-400">
            <div class="text-[10px] uppercase tracking-wide text-yellow-300 font-black">1st</div>
            <div class="font-black text-yellow-100">${first.name}</div>
            <div class="text-lg">${first.emoji}</div>
          </div>
          <div class="bg-gray-800/90 rounded-lg p-2 border border-gray-400">
            <div class="text-[10px] uppercase tracking-wide text-gray-300 font-black">2nd</div>
            <div class="font-black text-gray-100">${second ? second.name : '-'}</div>
            <div class="text-lg">${second ? second.emoji : '—'}</div>
          </div>
          <div class="bg-gray-800/90 rounded-lg p-2 border border-amber-600">
            <div class="text-[10px] uppercase tracking-wide text-amber-300 font-black">3rd</div>
            <div class="font-black text-amber-100">${third ? third.name : '-'}</div>
            <div class="text-lg">${third ? third.emoji : '—'}</div>
          </div>
        `;

        const summary = `${first.name} wins the race in the ${first.vehicleName}! Second place goes to ${second ? second.name : 'nobody'} in the ${second ? second.vehicleName : 'vehicle'}, and third place goes to ${third ? third.name : 'nobody'} in the ${third ? third.vehicleName : 'vehicle'}.`;
        queueUrgentEventAnnouncement(summary);
        if (window.speechSynthesis) {
          speakCommentary("Emma", summary, true);
        }
      }

      messageOverlay.classList.remove("hidden");
      messageOverlay.classList.add("flex");
      messageOverlay.style.pointerEvents = "auto";
    }

    function updateRacers(now, dt) {
      const sorted = racers.slice().sort(compareRacers);
      const leaderProgress = sorted[0] ? getRacerProgress(sorted[0]) : 0;

      racers.forEach(racer => {
        if (now < racer.crashedUntil) return;
        if (racer.finishRank > 0) return;

        const rockHit = activeRocks.find(r => Math.hypot(racer.tileX - r.tileX, racer.tileY - r.tileY) < 0.7);
        if (rockHit) {
          const idx = activeRocks.indexOf(rockHit);
          if (idx !== -1) activeRocks.splice(idx, 1);
          racer.crashedUntil = now + 2200;
          playCrashSound();

          const crashPhrases = [
            `Oh no! ${racer.name} in the ${racer.vehicleName} has crashed into a rock and lost time.`,
            `Disaster on the track! ${racer.name} in the ${racer.vehicleName} clipped a boulder and spun out.`,
            `That is a brutal hit! ${racer.name} in the ${racer.vehicleName} is struggling after the crash.`
          ];

          hazardBannerIcon.textContent = '🪨🔥💥';
          hazardBannerText.textContent = `ACCIDENT! ${racer.name} crashed!`;
          hazardBanner.classList.remove('hidden');

          queueUrgentEventAnnouncement(crashPhrases[Math.floor(Math.random() * crashPhrases.length)]);
          return;
        }

        const boostHit = activeBoosts.find(b => Math.hypot(racer.tileX - b.tileX, racer.tileY - b.tileY) < 0.75);
        if (boostHit) {
          const idx = activeBoosts.indexOf(boostHit);
          if (idx !== -1) activeBoosts.splice(idx, 1);
          racer.boostUntil = now + 2600;
          playBoostSound();

          const boostPhrases = [
            `Maximum boost! ${racer.name} in the ${racer.vehicleName} has activated a lightning turbo.`,
            `Wow! ${racer.name} hits a power pad and rockets forward in the ${racer.vehicleName}.`,
            `Electric speed! ${racer.name} is flying through the ${racer.vehicleName} after the boost.`
          ];

          queueUrgentEventAnnouncement(boostPhrases[Math.floor(Math.random() * boostPhrases.length)]);
        }

        const blockingAnimal = activeAnimals.find(a => Math.hypot(racer.tileX - a.tileX, racer.tileY - a.tileY) < 0.9);
        if (blockingAnimal) {
          if (!blockingAnimal.announced) {
            blockingAnimal.announced = true;
            const animalPhrases = [
              `${racer.name} in the ${racer.vehicleName} is blocked by a ${blockingAnimal.name} crossing the road.`,
              `Traffic delay! ${racer.name} in the ${racer.vehicleName} has to wait for a ${blockingAnimal.name}.`,
              `Hold on! A ${blockingAnimal.name} is crossing in front of ${racer.name} in the ${racer.vehicleName}.`
            ];
            queueUrgentEventAnnouncement(animalPhrases[Math.floor(Math.random() * animalPhrases.length)]);
          }
          racer.stoppedByAnimal = true;
          return;
        } else {
          racer.stoppedByAnimal = false;
        }

        const roadPosition = Math.floor((racer.distanceAlongCurrentLap / totalLapLength) * lapWaypoints.length) % lapWaypoints.length;
        const upcomingLight = activeTrafficLights.find(light => light.wpIdx === roadPosition);

        if (upcomingLight && (upcomingLight.state === 'red' || upcomingLight.state === 'yellow')) {
          const dist = Math.hypot(racer.tileX - upcomingLight.x, racer.tileY - upcomingLight.y);
          if (dist < 1.1) {
            racer.isStoppedAtLight = true;
            const lightPhrases = [
              `${racer.name} is stopping at a red light in the ${racer.vehicleName}.`,
              `${racer.name} has to wait at a yellow light in the ${racer.vehicleName}.`,
              `${racer.name} is held at the traffic light in the ${racer.vehicleName}.`
            ];
            queueUrgentEventAnnouncement(lightPhrases[Math.floor(Math.random() * lightPhrases.length)]);
            return;
          }
        } else {
          racer.isStoppedAtLight = false;
        }

        if (now > racer.speedChangeTimer) {
          const rankIndex = sorted.findIndex(r => r.id === racer.id);
          const gap = Math.max(0, leaderProgress - getRacerProgress(racer));

          let chaos = 0.78 + Math.random() * 0.65;
          if (rankIndex === 0) chaos = 0.72 + Math.random() * 0.35;
          else if (rankIndex <= 5) chaos = 0.92 + Math.random() * 0.7 + Math.min(0.4, gap * 0.02);
          else chaos = 1.1 + Math.random() * 0.9 + Math.min(0.6, gap * 0.025);

          if (Math.random() < 0.12 && rankIndex > 2) chaos *= 1.35;
          if (Math.random() < 0.08 && rankIndex === 0) chaos *= 0.7;

          racer.speed = racer.baseSpeed * chaos;
          racer.speedChangeTimer = now + 500 + Math.random() * 800;
        }

        let finalSpeed = racer.speed;
        if (now < racer.boostUntil) finalSpeed *= 2.35;
        if (finishLinePhase) finalSpeed *= 1.2;

        const moveDistance = finalSpeed * dt * 0.06 * simulationSpeed;
        racer.distanceAlongCurrentLap += moveDistance;

        while (racer.distanceAlongCurrentLap >= totalLapLength) {
          racer.distanceAlongCurrentLap -= totalLapLength;
          racer.laps += 1;
          playLapSound();
        }

        if (racer.laps >= 1 && finishLinePhase && racer.finishRank === 0 && racer.distanceAlongCurrentLap < 1.5) {
          podiumLocked.push(racer);
          racer.finishRank = podiumLocked.length;
          if (podiumLocked.length >= 3) {
            endRace();
            return;
          }
        }

        const pos = getPointAlongTrack(racer.distanceAlongCurrentLap + racer.laps * totalLapLength);
        racer.tileX = pos.x + 0.5;
        racer.tileY = pos.y + 0.5;
      });

      const topThree = racers.slice().sort(compareRacers).slice(0, 3);
      if (gameRunning && topThree.length > 0 && now - raceStartTime > 1000) {
        processLiveCommentary(topThree);
      }

      if (performance.now() - lastPanelRenderTime > 160) {
        lastPanelRenderTime = performance.now();
        renderLeftPanelDOM();
      }
    }

    async function startGame() {
      if (!selectedStudents || selectedStudents.size === 0) {
        selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS));
      }

      selectionScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
      gameScreen.classList.add("flex");

      await initAudioEngine();
      startBackgroundMusic();

      resetRaceState();
      gameRunning = true;

      if ("speechSynthesis" in window) {
        loadVoices();
        try { window.speechSynthesis.resume(); } catch (e) {}
      }

      const intro = "Race starting. Emma and Andrew are live. Cars are on the grid and ready to go.";
      speakCommentary("Emma", intro, true);

      lastTime = performance.now();
      cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function gameLoop(ts) {
      if (!gameRunning) return;

      const dt = Math.min(32, ts - lastTime || 16);
      lastTime = ts;

      remainingTimeMs = Math.max(0, raceDurationMs - (ts - raceStartTime));
      updateRaceTimerDisplay();

      if (remainingTimeMs <= 0) {
        endRace();
        return;
      }

      if (ts > 6000 && !finishLinePhase && ts - raceStartTime > raceDurationMs * 0.8) {
        finishLinePhase = true;
      }

      updateTrafficLights(dt);
      updateAnimalsAndHazards(ts, dt);
      updateRacers(ts, dt);
      drawTrack();
      renderLeftPanelDOM();

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function bindUI() {
      document.querySelectorAll('.class-tab').forEach(button => {
        button.addEventListener('click', () => {
          currentClass = button.id.includes('6H2') ? '6H2' : '5M2';
          selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS));
          setClassButtons();
          renderStudentGrid();
          updateSelectedBadge();
        });
      });

      document.querySelectorAll('.track-btn').forEach(button => {
        button.addEventListener('click', () => {
          currentTrackId = Number(button.dataset.track) || 1;
          setTrackButtons();
          buildTrackMap();
        });
      });

      document.querySelectorAll('.time-btn').forEach(button => {
        button.addEventListener('click', () => {
          selectedDurationMinutes = Number(button.dataset.mins);
          raceDurationMs = selectedDurationMinutes * 60 * 1000;
          remainingTimeMs = raceDurationMs;
          setTimeButtons();
          updateRaceTimerDisplay();
        });
      });

      document.getElementById('btnFirst16').addEventListener('click', selectFirst16);
      document.getElementById('btnRemaining').addEventListener('click', selectRemaining);
      document.getElementById('btnRandom16').addEventListener('click', selectRandom16);
      document.getElementById('btnClearAll').addEventListener('click', clearAll);

      studentGrid.addEventListener('click', (event) => {
        const button = event.target.closest('[data-name]');
        if (!button) return;
        const name = button.dataset.name;

        if (selectedStudents.has(name)) {
          selectedStudents.delete(name);
        } else {
          if (selectedStudents.size >= MAX_RACERS) {
            const first = [...selectedStudents][0];
            selectedStudents.delete(first);
          }
          selectedStudents.add(name);
        }

        renderStudentGrid();
        updateSelectedBadge();
      });

      document.getElementById('goToTrackBtn').addEventListener('click', () => startGame());
      document.getElementById('startButton').addEventListener('click', () => {
        if (!gameRunning) startGame();
        else {
          endRace();
          startGame();
        }
      });

      document.getElementById('backButton').addEventListener('click', () => {
        cancelAnimationFrame(animationFrameId);
        gameRunning = false;
        stopBackgroundMusic();
        selectionScreen.classList.remove('hidden');
        gameScreen.classList.add('hidden');
        gameScreen.classList.remove('flex');
      });

      document.getElementById('quickSwitchClassBtn').addEventListener('click', () => {
        currentClass = currentClass === '6H2' ? '5M2' : '6H2';
        selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS));
        setClassButtons();
        renderStudentGrid();
        updateSelectedBadge();
      });

      document.getElementById('overlayRestartBtn').addEventListener('click', () => {
        messageOverlay.classList.add('hidden');
        startGame();
      });

      document.getElementById('overlayRosterBtn').addEventListener('click', () => {
        messageOverlay.classList.add('hidden');
        selectionScreen.classList.remove('hidden');
        gameScreen.classList.add('hidden');
        gameScreen.classList.remove('flex');
      });

      document.getElementById('speedSlider').addEventListener('input', (e) => {
        simulationSpeed = Number(e.target.value);
      });

      if ("speechSynthesis" in window) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
    }

    function init() {
      buildTrackMap();
      setClassButtons();
      setTrackButtons();
      setTimeButtons();
      renderStudentGrid();
      updateSelectedBadge();
      bindUI();
      updateRaceTimerDisplay();
      updateCanvasSize();
      drawTrack();
      window.addEventListener('resize', updateCanvasSize);
      if ("speechSynthesis" in window) {
        loadVoices();
      }
    }

    init();
  </script>
</body>
</html>
