<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 6 HKAT English Mastery Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');
        
        :root {
            font-size: 20px; 
            --brand-sky: #38bdf8;
            --brand-emerald: #34d399;
            --brand-amber: #fbbf24;
            --brand-rose: #fb7185;
            --brand-indigo: #818cf8;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; border: 3px solid #f1f5f9; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.2s ease-out forwards; }
        
        /* 70/30 Split Grid Layout */
        .split-grid { 
            display: grid; 
            grid-template-columns: 68% 32%; 
            gap: 1.25rem; 
            height: calc(100vh - 80px);
            padding: 1rem;
        }
        
        .passage-panel { 
            background: #fffbef;
            border: 6px solid #fde047; 
            border-radius: 2rem; 
            padding: 2rem; 
            overflow-y: auto; 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05); 
        }
        .question-panel { 
            background: #ffffff; 
            border: 6px solid var(--brand-sky); 
            border-radius: 2rem; 
            padding: 1.25rem; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            overflow-y: auto; 
        }

        .passage-content {
            font-size: 1.2rem;
            line-height: 1.75;
            color: #1e293b;
        }
        .passage-content h3 { font-size: 1.65rem; color: #0f172a; margin-bottom: 1rem; font-weight: 900; }
        .passage-content h4 { font-size: 1.35rem; color: #4338ca; margin-top: 1.25rem; margin-bottom: 0.4rem; font-weight: 800; }
        .passage-content p { margin-bottom: 1rem; }
        
        .notice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-top: 1rem;
        }
        .notice-card {
            background: #ffffff;
            border: 3px solid #cbd5e1;
            border-radius: 1.25rem;
            padding: 1.25rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }
        .notice-card h4 {
            margin-top: 0;
            color: #1e3a8a;
            text-decoration: underline;
            text-align: center;
            margin-bottom: 0.75rem;
        }

        .tab-pane { display: none; height: 100%; }
        .tab-pane.active { display: block; }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>

            <button onclick="triggerPeerAssist()" class="bg-amber-400 hover:bg-amber-300 text-amber-900 border-b-4 border-amber-600 active:border-b-0 active:translate-y-1 font-black w-14 h-14 rounded-2xl transition flex items-center justify-center text-3xl shadow-sm" title="Peer Assist Hint">💡</button>
        </div>

        <!-- Scoreboard -->
        <div class="flex items-center gap-3">

                <div class="text-slate-300">|</div>
                <div class="text-slate-700">🔥 <span id="streak-val" class="text-rose-500">0x</span></div>
            </div>
        </div>
    </header>

    <!-- Floating Feedback overlay for Picker -->

    <script>
        /* ==========================================================
           1. AUDIO & PARTICLE FX (100% Offline)
           ========================================================== */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(f, now + i * 0.075);
                    g.gain.setValueAtTime(0.15, now + i * 0.075);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.075 + 0.35);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(now + i * 0.075); o.stop(now + i * 0.075 + 0.35);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(185, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'tick') {
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(820, now);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.04);
            }
        }

        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        let particles = [], fxAnimId = null;

        function resizeFxCanvas() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeFxCanvas);

        function triggerFX() {
            resizeFxCanvas();
            particles = [];
            const colors = ['#38bdf8', '#34d399', '#fbbf24', '#fb7185', '#818cf8'];

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: Math.random() * fxCanvas.width,
                    y: Math.random() * fxCanvas.height * 0.4 - fxCanvas.height * 0.2,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 4 + 3,
                    size: Math.random() * 12 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 8,
                    type: 'confetti'
                });
            }

            const bursts = [
                { x: fxCanvas.width * 0.2, y: fxCanvas.height * 0.3 },
                { x: fxCanvas.width * 0.8, y: fxCanvas.height * 0.3 },
                { x: fxCanvas.width * 0.5, y: fxCanvas.height * 0.2 }
            ];

            bursts.forEach(b => {
                for (let i = 0; i < 40; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = Math.random() * 8 + 3;
                    particles.push({
                        x: b.x, y: b.y,
                        vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
                        size: Math.random() * 4 + 3,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 1, decay: Math.random() * 0.02 + 0.015,
                        type: 'firework'
                    });
                }
            });

            if (!fxAnimId) animateFX();
        }

        function animateFX() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            let active = false;

            particles.forEach(p => {
                if (p.type === 'confetti') {
                    p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed;
                    fxCtx.save();
                    fxCtx.translate(p.x, p.y); fxCtx.rotate((p.rot * Math.PI) / 180);
                    fxCtx.fillStyle = p.color; fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    fxCtx.restore();
                    if (p.y < fxCanvas.height) active = true;
                } else if (p.type === 'firework') {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.alpha -= p.decay;
                    if (p.alpha > 0) {
                        active = true;
                        fxCtx.save();
                        fxCtx.globalAlpha = Math.max(0, p.alpha);
                        fxCtx.fillStyle = p.color;
                        fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); fxCtx.fill();
                        fxCtx.restore();
                    }
                }
            });

            if (active) fxAnimId = requestAnimationFrame(animateFX);
            else { fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height); fxAnimId = null; }
        }

        /* ==========================================================
           2. GAMIFICATION & STUDENT PICKER (WITH ALL NAMES)
           ========================================================== */
        let state = { points: 0, streak: 0, solved: {}, pickerInterval: null, timeLeft: 60 };

        const studentNames = [
            "Elsa", "Lily", "Florence", "Yao", "Miya", "Nadiia", "Amara", "Hitomi", 
            "Alice", "Karina", "Winnie", "Bella", "Sonia", "Albee", "Abby", "Martin", 
            "Noah", "Eric", "Eden", "Dominic", "Austin", "Charles", "Hoho", "Anders", 
            "Jimmy", "Ming", "Jason", "Brendan", "Charlie", "Sky", "Ryan", "Ian", "Biscuit"
        ];

        function addPoints(pts) {
            state.points += pts; state.streak++;
            document.getElementById('pts-val').innerText = state.points;
            document.getElementById('streak-val').innerText = state.streak + 'x';
        }

        function resetStreak() {
            state.streak = 0;
            document.getElementById('streak-val').innerText = '0x';
        }

        function pickRandomStudent() {
            clearInterval(state.pickerInterval);
            const badgeNum = document.getElementById('student-num');
            const fb = document.getElementById('picker-feedback');
            fb.classList.add('hidden');

            let cycles = 0;
            const cycleInterval = setInterval(() => {
                badgeNum.innerText = studentNames[Math.floor(Math.random() * studentNames.length)];
                playTone('tick');
                cycles++;
                if (cycles > 15) {
                    clearInterval(cycleInterval);
                    const finalStudent = studentNames[Math.floor(Math.random() * studentNames.length)];
                    badgeNum.innerText = finalStudent;
                    state.currentStudent = finalStudent;
                    startPickerTimer();
                }
            }, 60);
        }

        function startPickerTimer() {
            state.timeLeft = 60;
            const timerEl = document.getElementById('picker-timer-val');
            timerEl.innerText = state.timeLeft + 's';

            state.pickerInterval = setInterval(() => {
                state.timeLeft--;
                timerEl.innerText = state.timeLeft + 's';
                if (state.timeLeft <= 10 && state.timeLeft > 0) playTone('tick');
                if (state.timeLeft <= 0) { clearInterval(state.pickerInterval); timerEl.innerText = 'Time!'; }
            }, 1000);
        }

        function triggerCorrectCelebration() {
            clearInterval(state.pickerInterval);
            triggerFX(); playTone('correct'); addPoints(100);
            const fb = document.getElementById('picker-feedback');
            fb.classList.remove('hidden');
            fb.className = "fixed top-24 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-2xl text-xl font-black text-center shadow-2xl border-4 bg-emerald-100 border-emerald-400 text-emerald-900 block animate-pop";
            fb.innerHTML = `<strong>🌟 Brilliant, ${state.currentStudent || "Detective"}! (+100 Pts)</strong>`;
            setTimeout(() => fb.classList.add('hidden'), 3000);
        }

        function triggerPeerAssist() {
            const fb = document.getElementById('picker-feedback');
            fb.classList.remove('hidden');
            fb.className = "fixed top-24 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-2xl text-lg font-black text-center shadow-2xl border-4 bg-amber-100 border-amber-400 text-amber-900 block animate-pop";
            fb.innerHTML = `<strong>💡 Peer Assist:</strong> ${state.currentStudent || "Student"} invites a partner to help!`;
            setTimeout(() => fb.classList.add('hidden'), 3000);
        }

        /* ==========================================================
           3. COMPLETE DATA ARRAYS (ALL 9 SETS FULLY RESTORED)
           ========================================================== */
        
        // --- 1. R1 SET A: Summer Cultural Tours (10 Construct Qs + 6 Mock Paper 1 Qs = 16 Qs) ---
        const quest10Data = [
            { id: "r1q1", tag: "Skill 1: Synonym Recognition", stem: "Q1. In the French Food Tour notice, which multi-word expression means 'a complete multi-dish evening meal'?", correct: "C", options: [{letter:"A", text:"dessert cooking course", msg:"Incorrect. That is a cooking class, not a meal."}, {letter:"B", text:"world-class restaurant", msg:"Incorrect. That is the venue/place."}, {letter:"C", text:"full-course dinner", msg:"Exact match! 'Full-course dinner' means a complete multi-dish evening meal."}, {letter:"D", text:"French Food Tour", msg:"Incorrect. That is the overall program title."}], hint:"Look in the French Food Tour box for words describing a big meal at night." },
            { id: "r1q2", tag: "Skill 2: Pronoun Reference", stem: "Q2. In the Italian Art Tour notice ('Remember to bring your own art supplies...'), who does 'your' refer to?", correct: "D", options: [{letter:"A", text:"Art teachers in Rome", msg:"Incorrect. Teachers are not the readers of this notice."}, {letter:"B", text:"Tour guides", msg:"Incorrect. Tour guides lead the trip."}, {letter:"C", text:"Famous painters", msg:"Incorrect. Famous paintings are viewed in galleries."}, {letter:"D", text:"P.6 student participants", msg:"Correct! 'Your' refers to the P.6 students reading the notice and joining the tour."}], hint:"Look at the main title of the notices: Who are these tours for?" },
            { id: "r1q3", tag: "Skill 3: Scanning for Details", stem: "Q3. What specific item are participants required to bring by themselves on the Italian Art Tour?", correct: "B", options: [{letter:"A", text:"Classical music books", msg:"Incorrect. Music relates to the Austrian Tour."}, {letter:"B", text:"Art supplies and a camera", msg:"Direct detail match! Text states: 'Remember to bring your own art supplies and your camera.'"}, {letter:"C", text:"Movie costumes", msg:"Incorrect. Costumes relate to the American Movie Tour."}, {letter:"D", text:"Chef hats", msg:"Incorrect. Cooking relates to the French Food Tour."}], hint:"Scan the Italian Art Tour notice for the word 'Remember'." },
            { id: "r1q4", tag: "Skill 4: Multi-Item Extraction", stem: "Q4. Alex needs a tour satisfying ALL 3 conditions: (1) Fee < $5,000, (2) Starts after 15th August, (3) NO society membership required. Which fits?", correct: "D", options: [{letter:"A", text:"Austrian Music Tour", msg:"Fails date (6th-10th Aug) and fee ($7,000)."}, {letter:"B", text:"American Movie Tour", msg:"Fails society rule (Film Society members only) and fee ($5,200)."}, {letter:"C", text:"French Food Tour", msg:"Fails date (3rd-8th Aug) and fee ($6,500)."}, {letter:"D", text:"Italian Art Tour", msg:"3/3 Matches! Fee is $4,800 (< $5,000), runs 20th-25th Aug, and has no club restriction."}], hint:"Check the Date, Fee, and Remarks of each tour against Alex's 3 rules." },
            { id: "r1q5", tag: "Skill 5: Vocabulary in Context", stem: "Q5. Fill in the blank with the exact word from the text: 'Members of the school choir receive a $500 __________ off the tour price.'", correct: "C", options: [{letter:"A", text:"workshop", msg:"Incorrect. Workshop is a class in July."}, {letter:"B", text:"performance", msg:"Incorrect. Performance is at the Vienna Opera House."}, {letter:"C", text:"discount", msg:"Exact word from text! '$500 discount for School Choir members'."}, {letter:"D", text:"tasting", msg:"Incorrect. Tasting is in the French Food Tour."}], hint:"Look next to '$500' in the Austrian Music Tour Fee line." },

            r2: `<h3>The History of Paper Lanterns</h3>
                 <p class="text-slate-600 font-bold mb-3">Wilson is reading an article about paper lanterns. Read it carefully, choose the best answers for Questions 23–27 and complete Question 28.</p>

                 <p><strong>(iii)</strong> Traditionally, the paper lanterns are round or shaped like a starfruit. Animals that are symbols of luck and health such as rabbits, dragons and goldfish are also some classic designs. Over the years, many new designs have come out, and most of them are made in factories. You can now buy a cartoon character lantern made of plastic with a little light bulb in it.</p>
                 <p><strong>(iv)</strong> Today, you can also see lanterns in different countries. At the Lantern Festival of every Chinese New Year, people in China tie pieces of paper with riddles written on them to the paper lanterns. Then they gather to solve the riddles. Two weeks before Christmas, people in the Philippines celebrate a Giant Lantern Festival. They come from different villages to take part in the competition to make the biggest lantern. At the Hoi An Lantern Festival in Vietnam, all of the lights in the whole city are turned off at 8 p.m. The streets are lit up only by lanterns. Every November in Thailand, people put floating lanterns on the water of rivers and lakes. This is a way to make wishes and send blessings.</p>`,
