<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Lap Racer - Live Commentary Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        canvas {
            background-color: #4d8a3b;
            border: 3px solid #374151;
            border-radius: 0.75rem;
            width: 100%;
            height: 100%;
            object-fit: contain;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        .student-card.selected {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: #93c5fd;
            transform: translateY(-1px);
        }
        .class-tab.active {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #111827;
            border-color: #fde68a;
        }
        .time-btn.active {
            background-color: #10b981;
            color: #111827;
            border-color: #6ee7b7;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center h-screen p-1.5 md:p-2 select-none">

    <!-- ================= 1. CLASS & STUDENT SELECTION SCREEN ================= -->
    <div id="selectionScreen" class="w-full max-w-6xl bg-gray-800 border border-gray-700 rounded-2xl p-4 md:p-6 shadow-2xl flex flex-col max-h-[95vh]">
        
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 gap-3 border-b border-gray-700 pb-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-yellow-400 tracking-tight flex items-center gap-2">
                    🏁 Class Lap Racer
                    <span id="activeClassBadge" class="text-sm bg-yellow-500/20 text-yellow-300 border border-yellow-500/40 px-2.5 py-0.5 rounded-full font-bold">Class 6H2</span>
                </h1>
                <p class="text-gray-300 text-xs md:text-sm mt-0.5">
                    Select up to <span class="font-bold text-white">17 racers</span>. Featuring live commentary by <span class="text-blue-300 font-semibold">Brian & Andrew</span>!
                </p>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <!-- Class Toggle Buttons -->
                <div class="flex items-center bg-gray-900 p-1 rounded-xl border border-gray-700">
                    <span class="text-xs text-gray-400 px-2 font-semibold">Class:</span>
                    <button id="classBtn6H2" class="class-tab active font-extrabold text-xs md:text-sm px-3 py-1.5 rounded-lg border border-transparent transition">
                        Class 6H2 (32)
                    </button>
                    <button id="classBtn5M2" class="class-tab font-extrabold text-xs md:text-sm px-3 py-1.5 rounded-lg border border-transparent text-gray-300 hover:text-white transition">
                        Class 5M2 (23)
                    </button>
                </div>

                <!-- Race Time Options (1, 2, 3 Mins) -->
                <div class="flex items-center bg-gray-900 p-1 rounded-xl border border-gray-700">
                    <span class="text-xs text-gray-400 px-2 font-semibold">Time:</span>
                    <button data-mins="1" class="time-btn font-bold text-xs px-2.5 py-1.5 rounded-lg border border-transparent text-gray-300 hover:text-white transition">1 Min</button>
                    <button data-mins="2" class="time-btn active font-bold text-xs px-2.5 py-1.5 rounded-lg border border-transparent transition">2 Min</button>
                    <button data-mins="3" class="time-btn font-bold text-xs px-2.5 py-1.5 rounded-lg border border-transparent text-gray-300 hover:text-white transition">3 Min</button>
                </div>

                <!-- Selected Counter -->
                <div class="flex items-center gap-2 bg-gray-900 px-3 py-1.5 rounded-xl border border-gray-700">
                    <span class="text-xs text-gray-400">Racers:</span>
                    <span id="selectedCountBadge" class="text-lg font-black text-green-400">17 / 17</span>
                </div>
            </div>
        </div>

        <!-- Quick Selection Toolbar -->
        <div class="flex flex-wrap gap-2 mb-3">
            <button id="btnFirst17" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-1.5 px-3 rounded-lg text-xs transition">
                Select First 17
            </button>
            <button id="btnRemaining" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-1.5 px-3 rounded-lg text-xs transition">
                Select Remaining Students
            </button>
            <button id="btnRandom17" class="bg-purple-600 hover:bg-purple-500 text-white font-semibold py-1.5 px-3 rounded-lg text-xs transition">
                🎲 Random 17
            </button>
            <button id="btnClearAll" class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold py-1.5 px-3 rounded-lg text-xs transition">
                ✖ Clear All
            </button>
        </div>

        <!-- Student Grid -->
        <div id="studentGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2 overflow-y-auto pr-1 flex-1 py-1">
            <!-- Dynamically populated -->
        </div>

        <!-- Available Vehicles & Proceed Button -->
        <div class="mt-4 pt-3 border-t border-gray-700 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="text-xs text-gray-400 flex flex-wrap gap-1.5 items-center">
                <span class="font-semibold text-gray-300">17 Vehicles:</span>
                <span class="text-base tracking-widest bg-gray-900 px-2.5 py-1 rounded-lg border border-gray-700">
                    🚗 🚕 🚙 🚌 🚎 🏎️ 🚓 🚑 🚒 🚐 🚚 🚛 🚜 🛻 🚲 🏍️ 🛵
                </span>
            </div>
            <button id="goToTrackBtn" class="w-full sm:w-auto bg-green-500 hover:bg-green-400 disabled:bg-gray-600 disabled:text-gray-400 text-gray-900 font-black py-2.5 px-7 rounded-xl shadow-lg text-base transition transform active:scale-95">
                Go to Race Track ➔
            </button>
        </div>
    </div>

    <!-- ================= 2. GAME SCREEN (ULTRA-COMPACT TOP CONTROLS TO RAISE RACER LIST) ================= -->
    <div id="gameScreen" class="hidden w-full h-full flex flex-row gap-2 items-stretch justify-center overflow-hidden">
        
        <!-- HALF-WIDTH LEFT PANEL (w-36) WITH ULTRA-COMPACT HEADER SO RACERS SIT HIGH -->
        <div class="w-36 bg-gray-800 border border-gray-700 rounded-xl p-1.5 flex flex-col h-full shrink-0 shadow-xl">
            
            <!-- Ultra-Compact Control Box -->
            <div class="bg-gray-900 rounded-lg p-1.5 mb-1 border border-gray-700 flex flex-col gap-1">
                <!-- Row 1: Timer + Icon-Only Action Buttons (Start/Restart, Roster, Switch Class) -->
                <div class="flex items-center justify-between gap-1">
                    <span id="raceTimerDisplay" class="text-sm font-black text-yellow-400 font-mono leading-none">
                        02:00
                    </span>
                    <div class="flex items-center gap-1">
                        <button id="startButton" class="bg-green-500 hover:bg-green-400 text-gray-900 font-black px-1.5 py-0.5 rounded text-xs shadow transition" title="Start / Restart Race">
                            ▶️
                        </button>
                        <button id="backButton" class="bg-gray-700 hover:bg-gray-600 text-white font-bold px-1.5 py-0.5 rounded text-xs transition" title="Student Roster">
                            📋
                        </button>
                        <button id="quickSwitchClassBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold px-1 py-0.5 rounded text-[9px] transition" title="Switch Class">
                            5M2
                        </button>
                    </div>
                </div>

                <!-- Row 2: 1m / 2m / 3m + Speed Slider -->
                <div class="flex items-center justify-between gap-1">
                    <div class="flex gap-0.5">
                        <button data-mins="1" class="time-btn text-[9px] font-bold px-1 py-0.2 rounded bg-gray-800 text-gray-300 border border-gray-700">1m</button>
                        <button data-mins="2" class="time-btn active text-[9px] font-bold px-1 py-0.2 rounded bg-gray-800 border border-gray-700">2m</button>
                        <button data-mins="3" class="time-btn text-[9px] font-bold px-1 py-0.2 rounded bg-gray-800 text-gray-300 border border-gray-700">3m</button>
                    </div>
                    <input id="speedSlider" type="range" min="0.5" max="2.5" value="1" step="0.1" class="w-12 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer" title="Race Speed">
                </div>
            </div>

            <!-- Scrollable Racer List Raised High in Left Column -->
            <div id="leftRacerList" class="flex-1 overflow-y-auto space-y-1 pr-0.5">
                <!-- Populated dynamically: Name on top, Car below name -->
            </div>
        </div>

        <!-- EXPANDED RIGHT AREA: Wide Multi-Lap Race Track -->
        <div id="trackContainer" class="flex-1 h-full flex items-center justify-center relative overflow-hidden">
            <canvas id="gameCanvas"></canvas>

            <!-- Live Commentator Subtitle Pill (Brian & Andrew) -->
            <div id="commentaryBanner" class="hidden absolute bottom-3 left-1/2 -translate-x-1/2 bg-blue-950/90 text-blue-100 font-bold text-xs md:text-sm px-4 py-1.5 rounded-full shadow-lg border border-blue-400/50 z-20 flex items-center gap-2">
                <span class="text-base">🎙️</span>
                <span id="commentaryText">Brian: Welcome to the track!</span>
            </div>

            <!-- Animal Crossing Toast Banner -->
            <div id="animalBanner" class="hidden absolute top-3 left-1/2 -translate-x-1/2 bg-amber-500/95 text-gray-900 font-black text-xs md:text-sm px-4 py-1.5 rounded-full shadow-lg border-2 border-white z-20 flex items-center gap-2 animate-bounce">
                <span id="animalBannerIcon" class="text-lg">🐄</span>
                <span id="animalBannerText">Animal crossing the road! Traffic stopped!</span>
            </div>

            <!-- Winner / Podium Overlay -->
            <div id="messageOverlay" class="absolute inset-0 bg-black/70 backdrop-blur-sm flex flex-col items-center justify-center rounded-xl text-center p-4 hidden z-30 pointer-events-auto">
                <div class="bg-gray-800/95 border-2 border-yellow-400 rounded-2xl p-6 max-w-lg w-full shadow-2xl">
                    <div class="text-6xl mb-2" id="winnerEmoji">🏆</div>
                    <h2 id="messageTitle" class="text-2xl md:text-3xl font-black text-yellow-400 mb-3"></h2>
                    
                    <!-- Top 3 Podium Cards -->
                    <div id="podiumDetails" class="grid grid-cols-3 gap-2 mb-5 text-left"></div>

                    <div class="flex flex-wrap gap-3 justify-center">
                        <button id="overlayRestartBtn" class="bg-green-500 hover:bg-green-400 text-gray-900 font-extrabold py-2.5 px-6 rounded-xl text-xl transition" title="Race Again">
                            🔄
                        </button>
                        <button id="overlayRosterBtn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2.5 px-6 rounded-xl text-xl transition" title="Student Roster">
                            📋
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. STUDENT ROSTERS FOR BOTH CLASSES (6H2 & 5M2) ---
        const CLASS_ROSTERS = {
            "6H2": [
                "Elsa", "Lily", "Florence", "Yao", "Miya", "Nadiia", "Amara", "Hitomi",
                "Alice", "Karina", "Winnie", "Bella", "Sonia", "Albee", "Abby", "Martin",
                "Noah", "Eric", "Eden", "Dominic", "Austin", "Charles", "Hoho", "Anders",
                "Jimmy", "Ming", "Jason", "Brendan", "Charlie", "Sky", "Ryan", "Ian", "Biscuit"
            ],
            "5M2": [
                "Julia", "Freya", "Anna", "Grace", "Avery", "Yihan", "Emma", "Abigail",
                "Susie", "Nina", "Kenneth", "Dafa", "Jim", "Charles", "Henry", "Patrick",
                "Ryan", "David", "Justin", "Jason M", "Edwin", "Jason S", "Terrance"
            ]
        };

        const FLEET_VEHICLES = [
            '🚗', '🚕', '🚙', '🚌', '🚎', '🏎️', '🚓', '🚑', '🚒',
            '🚐', '🚚', '🚛', '🚜', '🛻', '🚲', '🏍️', '🛵'
        ];

        const VEHICLE_NAMES = {
            '🚗': 'red car', '🚕': 'yellow taxi', '🚙': 'blue SUV', '🚌': 'school bus',
            '🚎': 'trolleybus', '🏎️': 'Formula race car', '🚓': 'police cruiser',
            '🚑': 'ambulance', '🚒': 'fire truck', '🚐': 'minivan', '🚚': 'delivery truck',
            '🚛': 'semi-truck', '🚜': 'tractor', '🛻': 'pickup truck', '🚲': 'bicycle',
            '🏍️': 'motorcycle', '🛵': 'motor scooter'
        };

        const CROSSING_ANIMALS = [
            { emoji: '🐄', name: 'Cow', speed: 0.012 },
            { emoji: '🐖', name: 'Pig', speed: 0.015 },
            { emoji: '🐑', name: 'Sheep', speed: 0.014 },
            { emoji: '🐐', name: 'Goat', speed: 0.018 },
            { emoji: '🦆', name: 'Duck', speed: 0.013 },
            { emoji: '🐢', name: 'Turtle', speed: 0.007 },
            { emoji: '🐇', name: 'Rabbit', speed: 0.026 },
            { emoji: '🐕', name: 'Dog', speed: 0.022 },
            { emoji: '🐈', name: 'Cat', speed: 0.020 }
        ];

        const MAX_RACERS = FLEET_VEHICLES.length; // 17

        // --- 2. WIDER 36x22 TRACK WITH 7 HORIZONTAL CORRIDORS ---
        const cols = 36;
        const rows = 22;
        const horizontalRows = [1, 4, 7, 10, 13, 16, 19];
        const map = Array.from({ length: rows }, () => Array(cols).fill(3));

        function generateWideTrackMap() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    map[r][c] = 3;
                }
            }
            horizontalRows.forEach((r, idx) => {
                const endCol = (idx === 0) ? 33 : 29;
                for (let c = 3; c <= endCol; c++) map[r][c] = 1;
            });
            for (let r = 1; r <= 4; r++) map[r][3] = 1;
            for (let r = 4; r <= 7; r++) map[r][29] = 1;
            for (let r = 7; r <= 10; r++) map[r][3] = 1;
            for (let r = 10; r <= 13; r++) map[r][29] = 1;
            for (let r = 13; r <= 16; r++) map[r][3] = 1;
            for (let r = 16; r <= 19; r++) map[r][29] = 1;
            for (let r = 19; r <= 20; r++) map[r][3] = 1;
            for (let c = 3; c <= 33; c++) map[20][c] = 1;
            for (let r = 1; r <= 20; r++) map[r][33] = 1;

            map[1][18] = 4; // Start / Finish Line

            for (let r = 2; r < rows - 2; r++) {
                for (let c = 5; c <= 27; c++) {
                    if (map[r][c] === 3 && c % 2 === 0 && Math.random() < 0.55) {
                        map[r][c] = 2;
                    }
                }
            }
        }
        generateWideTrackMap();

        const lapWaypoints = [
            { x: 18, y: 1 },  { x: 3,  y: 1 },  { x: 3,  y: 4 },  { x: 29, y: 4 },
            { x: 29, y: 7 },  { x: 3,  y: 7 },  { x: 3,  y: 10 }, { x: 29, y: 10 },
            { x: 29, y: 13 }, { x: 3,  y: 13 }, { x: 3,  y: 16 }, { x: 29, y: 16 },
            { x: 29, y: 19 }, { x: 3,  y: 19 }, { x: 3,  y: 20 }, { x: 33, y: 20 },
            { x: 33, y: 1 }
        ];

        const trafficLightWaypoints = [1, 3, 5, 7, 9, 11, 13];
        const EMOJIS = {
            building: ['🏢', '🏭', '🏤', '🏥', '🏦', '🏫', '🏪'],
            tree: ['🌳', '🌲', '🌴'],
            finish: '🏁'
        };

        // --- 3. STATE VARIABLES ---
        let currentClass = "6H2";
        let selectedStudents = new Set(CLASS_ROSTERS["6H2"].slice(0, MAX_RACERS));
        let selectedDurationMinutes = 2;
        let raceDurationMs = selectedDurationMinutes * 60 * 1000;

        let racers = [];
        let activeAnimals = [];
        let fireworks = [];
        let nextAnimalSpawnTime = 0;
        let nextRandomHornTime = 0;
        let emojiMap = [];
        let TILE_SIZE = 32;

        let gameRunning = false;
        let celebrationActive = false;
        let animationFrameId = null;
        let simulationSpeed = 1;
        let raceStartTime = 0;
        let remainingTimeMs = raceDurationMs;

        // Commentary Tracking
        let currentLeaderName = "";
        let lastLeaderCalloutTime = 0;
        let commentatorTurn = 0; // 0 = Brian, 1 = Andrew
        let brianVoice = null;
        let andrewVoice = null;

        // --- 4. DOM ELEMENTS ---
        const selectionScreen = document.getElementById('selectionScreen');
        const gameScreen = document.getElementById('gameScreen');
        const studentGrid = document.getElementById('studentGrid');
        const selectedCountBadge = document.getElementById('selectedCountBadge');
        const activeClassBadge = document.getElementById('activeClassBadge');
        const quickSwitchClassBtn = document.getElementById('quickSwitchClassBtn');
        const goToTrackBtn = document.getElementById('goToTrackBtn');

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const backButton = document.getElementById('backButton');
        const speedSlider = document.getElementById('speedSlider');
        const raceTimerDisplay = document.getElementById('raceTimerDisplay');
        const leftRacerList = document.getElementById('leftRacerList');

        const commentaryBanner = document.getElementById('commentaryBanner');
        const commentaryText = document.getElementById('commentaryText');
        const animalBanner = document.getElementById('animalBanner');
        const animalBannerIcon = document.getElementById('animalBannerIcon');
        const animalBannerText = document.getElementById('animalBannerText');

        const messageOverlay = document.getElementById('messageOverlay');
        const messageTitle = document.getElementById('messageTitle');
        const podiumDetails = document.getElementById('podiumDetails');
        const winnerEmoji = document.getElementById('winnerEmoji');
        const overlayRestartBtn = document.getElementById('overlayRestartBtn');
        const overlayRosterBtn = document.getElementById('overlayRosterBtn');

        // --- 5. MICROSOFT EDGE ONLINE NATURAL VOICES (BRIAN & ANDREW @ 85% SPEED) ---
        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) return;

            // Prioritize Microsoft Edge Online Natural Multilingual voices for Brian & Andrew
            brianVoice = voices.find(v => v.name.includes('Brian') && v.name.includes('Natural'))
                      || voices.find(v => v.name.includes('Brian'))
                      || voices.find(v => v.lang.startsWith('en') && v.name.includes('Natural'))
                      || voices.find(v => v.lang.startsWith('en'));

            andrewVoice = voices.find(v => v.name.includes('Andrew') && v.name.includes('Natural'))
                       || voices.find(v => v.name.includes('Andrew'))
                       || voices.find(v => v.lang.startsWith('en') && v !== brianVoice)
                       || brianVoice;
        }

        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function speakCommentary(speaker, text, interrupt = false) {
            if (!('speechSynthesis' in window)) return;
            loadVoices();

            if (interrupt) {
                window.speechSynthesis.cancel();
            } else if (window.speechSynthesis.speaking) {
                return; // Don't overlap ongoing live leader commentary
            }

            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = 0.85; // Configured to 85% speech speed
            utter.pitch = speaker === 'Brian' ? 1.0 : 0.96;
            utter.voice = speaker === 'Brian' ? brianVoice : andrewVoice;

            utter.onstart = () => {
                commentaryBanner.classList.remove('hidden');
                commentaryText.textContent = `${speaker}: "${text}"`;
            };
            utter.onend = () => {
                if (gameRunning) {
                    setTimeout(() => commentaryBanner.classList.add('hidden'), 1800);
                }
            };

            window.speechSynthesis.speak(utter);
        }

        function announceLeaderChange(leader) {
            const now = performance.now();
            // Speak when a new leader takes #1 (with a 6s cooldown) or every 16 seconds if holding the lead
            const isNewLeader = leader.name !== currentLeaderName;
            if (!isNewLeader && (now - lastLeaderCalloutTime < 16000)) return;
            if (isNewLeader && (now - lastLeaderCalloutTime < 6000)) return;

            currentLeaderName = leader.name;
            lastLeaderCalloutTime = now;

            const vehicleDesc = VEHICLE_NAMES[leader.emoji] || 'vehicle';
            const speaker = commentatorTurn % 2 === 0 ? 'Brian' : 'Andrew';
            commentatorTurn++;

            const brianPhrases = [
                `${leader.name} takes the number one spot in the ${vehicleDesc}!`,
                `Look at ${leader.name} go! Holding first place in the ${vehicleDesc}!`,
                `${leader.name} is leading the pack on lap ${leader.laps + 1}!`,
                `What a move by ${leader.name}, now in number one!`
            ];
            const andrewPhrases = [
                `That's right Brian, ${leader.name} is out in front in the ${vehicleDesc}!`,
                `${leader.name} has surged into first place!`,
                `In the number one position right now, it's ${leader.name} driving the ${vehicleDesc}!`,
                `${leader.name} is setting the pace at number one on lap ${leader.laps + 1}!`
            ];

            const pool = speaker === 'Brian' ? brianPhrases : andrewPhrases;
            const phrase = pool[Math.floor(Math.random() * pool.length)];
            speakCommentary(speaker, phrase, false);
        }

        function announceWinnersPodium(sortedRacers) {
            if (!('speechSynthesis' in window) || sortedRacers.length === 0) return;
            window.speechSynthesis.cancel();
            loadVoices();

            const first = sortedRacers[0];
            const second = sortedRacers[1];
            const third = sortedRacers[2];

            const brianLine = `The race is over! Crossing the finish line in first place is ${first.name} in the ${VEHICLE_NAMES[first.emoji] || 'car'}!`;
            let andrewLine = '';
            if (second && third) {
                andrewLine = `Fantastic race! Second place goes to ${second.name}, and taking third place on the podium is ${third.name}! Congratulations everyone!`;
            } else if (second) {
                andrewLine = `And finishing right behind in second place is ${second.name}! Great racing today!`;
            } else {
                andrewLine = `An incredible solo victory for ${first.name}!`;
            }

            const u1 = new SpeechSynthesisUtterance(brianLine);
            u1.rate = 0.85;
            u1.voice = brianVoice;
            u1.onstart = () => {
                commentaryBanner.classList.remove('hidden');
                commentaryText.textContent = `Brian: "${brianLine}"`;
            };

            const u2 = new SpeechSynthesisUtterance(andrewLine);
            u2.rate = 0.85;
            u2.voice = andrewVoice;
            u2.onstart = () => {
                commentaryBanner.classList.remove('hidden');
                commentaryText.textContent = `Andrew: "${andrewLine}"`;
            };

            window.speechSynthesis.speak(u1);
            window.speechSynthesis.speak(u2);
        }

        // --- 6. ALWAYS-ON SOUND ENGINE & 5 DISTINCT CAR HORNS + FIREWORK AUDIO ---
        let polySynth, bassSynth, hornSawSynth, hornSquareSynth, airHornSynth, fireworkNoise, musicLoop;
        let soundInitialized = false;

        async function initAudioEngine() {
            if (soundInitialized) return;
            try {
                await Tone.start();

                polySynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.02, decay: 0.1, sustain: 0.2, release: 0.3 }
                }).toDestination();
                polySynth.volume.value = -11;

                bassSynth = new Tone.MonoSynth({
                    oscillator: { type: 'square' },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0.1, release: 0.1 }
                }).toDestination();
                bassSynth.volume.value = -15;

                // Horn 1 & 2: Dual-tone brassy sawtooth car horn
                hornSawSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'sawtooth' },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0.6, release: 0.12 }
                }).toDestination();
                hornSawSynth.volume.value = -6;

                // Horn 3 & 4: High compact square beep
                hornSquareSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'square' },
                    envelope: { attack: 0.005, decay: 0.08, sustain: 0.4, release: 0.08 }
                }).toDestination();
                hornSquareSynth.volume.value = -7;

                // Horn 5: Deep Truck Air Horn
                airHornSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'fatsawtooth', count: 3, spread: 20 },
                    envelope: { attack: 0.04, decay: 0.25, sustain: 0.8, release: 0.25 }
                }).toDestination();
                airHornSynth.volume.value = -4;

                // Firework explosion burst synth
                fireworkNoise = new Tone.NoiseSynth({
                    noise: { type: 'pink' },
                    envelope: { attack: 0.005, decay: 0.35, sustain: 0, release: 0.2 }
                }).toDestination();
                fireworkNoise.volume.value = -6;

                const melodyNotes = [
                    'C5', 'E5', 'G5', 'E5', 'F5', 'A5', 'G5', 'E5',
                    'D5', 'F5', 'A5', 'F5', 'G5', 'B5', 'C6', 'G5'
                ];
                const bassNotes = [
                    'C3', 'C3', 'G2', 'G2', 'F2', 'F2', 'C3', 'C3',
                    'D2', 'D2', 'A2', 'A2', 'G2', 'G2', 'G2', 'B2'
                ];
                let step = 0;

                musicLoop = new Tone.Loop((time) => {
                    if (!gameRunning) return;
                    const mNote = melodyNotes[step % melodyNotes.length];
                    const bNote = bassNotes[step % bassNotes.length];
                    polySynth.triggerAttackRelease(mNote, '16n', time);
                    bassSynth.triggerAttackRelease(bNote, '8n', time);
                    step++;
                }, '8n');

                Tone.Transport.bpm.value = 138;
                soundInitialized = true;
            } catch (e) {
                console.warn('Audio init warning:', e);
            }
        }

        function startBackgroundMusic() {
            if (!soundInitialized) return;
            if (Tone.Transport.state !== 'started') Tone.Transport.start();
            musicLoop.start(0);
        }

        function stopBackgroundMusic() {
            if (!soundInitialized) return;
            musicLoop.stop();
        }

        // Play 1 of 5 distinct car/truck/scooter horns
        function playVariedCarHorn(forcedType = null) {
            if (!soundInitialized) return;
            const now = Tone.now();
            const hornType = forcedType !== null ? forcedType : Math.floor(Math.random() * 5);

            switch (hornType) {
                case 0:
                    // 1. High Compact Scooter/Hatchback Double Beep ("Meep-Meep!")
                    hornSquareSynth.triggerAttackRelease(['A5', 'C#6'], '32n', now);
                    hornSquareSynth.triggerAttackRelease(['A5', 'C#6'], '16n', now + 0.11);
                    break;
                case 1:
                    // 2. Classic Sedan Dual-Tone Horn ("Honk-Hoooonk!")
                    hornSawSynth.triggerAttackRelease(['F4', 'A4'], '16n', now);
                    hornSawSynth.triggerAttackRelease(['F4', 'A4'], '8n', now + 0.16);
                    break;
                case 2:
                    // 3. Deep Semi-Truck / Bus Air Horn ("BWAAAAAH!")
                    airHornSynth.triggerAttackRelease(['C3', 'G3', 'C4'], '4n', now);
                    break;
                case 3:
                    // 4. Rapid Sports Car Triple Toot
                    hornSquareSynth.triggerAttackRelease(['E5', 'G#5'], '32n', now);
                    hornSquareSynth.triggerAttackRelease(['E5', 'G#5'], '32n', now + 0.09);
                    hornSquareSynth.triggerAttackRelease(['E5', 'B5'], '16n', now + 0.18);
                    break;
                case 4:
                    // 5. Old-School Two-Pitch Klaxon ("Ah-Ooo-Gah!")
                    hornSawSynth.triggerAttackRelease(['G4', 'B4'], '16n', now);
                    hornSawSynth.triggerAttackRelease(['D4', 'F#4'], '4n', now + 0.14);
                    break;
            }
        }

        function playStartSound() {
            if (!soundInitialized) return;
            const now = Tone.now();
            polySynth.triggerAttackRelease('C5', '16n', now);
            polySynth.triggerAttackRelease('C5', '16n', now + 0.22);
            polySynth.triggerAttackRelease('G5', '8n', now + 0.44);
        }

        function playLapSound() {
            if (!soundInitialized) return;
            const now = Tone.now();
            polySynth.triggerAttackRelease(['E5', 'G5', 'C6'], '16n', now);
        }

        function playFireworkExplosionSound() {
            if (!soundInitialized) return;
            const now = Tone.now();
            fireworkNoise.triggerAttackRelease('8n', now);
            const chimeNotes = ['C5', 'E5', 'G5', 'B5', 'C6', 'D6', 'E6'];
            const randomNote = chimeNotes[Math.floor(Math.random() * chimeNotes.length)];
            polySynth.triggerAttackRelease([randomNote, 'G5'], '16n', now + 0.05);
        }

        function playWinFanfare() {
            if (!soundInitialized) return;
            const now = Tone.now();
            polySynth.triggerAttackRelease(['C4', 'E4', 'G4', 'C5'], '4n', now);
            polySynth.triggerAttackRelease(['E4', 'G4', 'C5', 'E5'], '4n', now + 0.25);
            polySynth.triggerAttackRelease(['G4', 'C5', 'E5', 'G5'], '2n', now + 0.5);
            playFireworkExplosionSound();
        }

        // --- 7. FIREWORKS ENGINE FOR WINNER CELEBRATION ---
        function launchFireworkBurst() {
            const x = (0.15 + Math.random() * 0.7) * canvas.width;
            const y = (0.15 + Math.random() * 0.55) * canvas.height;
            const colors = ['#facc15', '#f87171', '#60a5fa', '#34d399', '#c084fc', '#fb923c', '#ffffff'];
            const particles = [];

            for (let i = 0; i < 42; i++) {
                const angle = (Math.PI * 2 * i) / 42 + (Math.random() * 0.2);
                const speed = 1.5 + Math.random() * 4.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[i % colors.length],
                    alpha: 1,
                    size: 2.5 + Math.random() * 3
                });
            }
            fireworks.push(...particles);
            playFireworkExplosionSound();
        }

        function updateAndDrawFireworks() {
            if (celebrationActive && Math.random() < 0.09) {
                launchFireworkBurst();
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const p = fireworks[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06; // Gravity
                p.alpha -= 0.016;

                if (p.alpha <= 0) {
                    fireworks.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- 8. CLASS SWITCHING & TIME SELECTION LOGIC ---
        function switchClass(className) {
            currentClass = className;
            const roster = CLASS_ROSTERS[currentClass];
            selectedStudents = new Set(roster.slice(0, MAX_RACERS));

            document.getElementById('classBtn6H2').classList.toggle('active', currentClass === '6H2');
            document.getElementById('classBtn5M2').classList.toggle('active', currentClass === '5M2');
            activeClassBadge.textContent = `Class ${currentClass}`;
            quickSwitchClassBtn.textContent = currentClass === '6H2' ? '5M2' : '6H2';

            renderStudentGrid();
        }

        document.getElementById('classBtn6H2').addEventListener('click', () => switchClass('6H2'));
        document.getElementById('classBtn5M2').addEventListener('click', () => switchClass('5M2'));

        quickSwitchClassBtn.addEventListener('click', () => {
            const nextClass = currentClass === '6H2' ? '5M2' : '6H2';
            switchClass(nextClass);
            setupRacersAndTrack();
        });

        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const mins = parseInt(btn.dataset.mins, 10);
                selectedDurationMinutes = mins;
                raceDurationMs = mins * 60 * 1000;

                document.querySelectorAll('.time-btn').forEach(b => {
                    b.classList.toggle('active', parseInt(b.dataset.mins, 10) === mins);
                });

                    remainingTimeMs = raceDurationMs;
                    updateTimerDisplay(remainingTimeMs);
                }
            });

        // --- 9. STUDENT ROSTER SELECTION ---
        function renderStudentGrid() {
            const roster = CLASS_ROSTERS[currentClass];
            studentGrid.innerHTML = '';

            roster.forEach(name => {
                const isSelected = selectedStudents.has(name);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `student-card flex items-center justify-between px-3 py-2 rounded-xl border text-left font-semibold text-xs md:text-sm transition ${
                    isSelected
                        ? 'selected text-white shadow-md'
                        : 'bg-gray-900 border-gray-700 text-gray-300 hover:border-gray-500'
                }`;
                btn.innerHTML = `
                    <span class="truncate">${name}</span>
                    <span class="text-xs ml-1">${isSelected ? '✅' : ''}</span>
                `;
                btn.addEventListener('click', () => toggleStudent(name));
                studentGrid.appendChild(btn);
            });

            selectedCountBadge.textContent = `${selectedStudents.size} / ${MAX_RACERS}`;
            goToTrackBtn.disabled = selectedStudents.size === 0;
        }

        function toggleStudent(name) {
            if (selectedStudents.has(name)) {
                selectedStudents.delete(name);
            } else {
                if (selectedStudents.size >= MAX_RACERS) {
                    alert(`Maximum of ${MAX_RACERS} racers reached!`);
                    return;
                }
                selectedStudents.add(name);
            }
            renderStudentGrid();
        }

        document.getElementById('btnFirst17').addEventListener('click', () => {
            selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS));
            renderStudentGrid();
        });

        document.getElementById('btnRemaining').addEventListener('click', () => {
            const roster = CLASS_ROSTERS[currentClass];
            const remaining = roster.slice(MAX_RACERS);
            selectedStudents = new Set(remaining.length > 0 ? remaining : roster.slice(0, MAX_RACERS));
            renderStudentGrid();
        });

        document.getElementById('btnRandom17').addEventListener('click', () => {
            const shuffled = [...CLASS_ROSTERS[currentClass]].sort(() => 0.5 - Math.random());
            selectedStudents = new Set(shuffled.slice(0, MAX_RACERS));
            renderStudentGrid();
        });

        document.getElementById('btnClearAll').addEventListener('click', () => {
            selectedStudents.clear();
            renderStudentGrid();
        });

        goToTrackBtn.addEventListener('click', () => {
            if (selectedStudents.size === 0) return;
            selectionScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            setupRacersAndTrack();
        });

        // --- 10. INITIALIZE TRACK, RACERS & ANIMAL CROSSINGS ---
        function setupRacersAndTrack() {
            endGame(false);
            celebrationActive = false;
            fireworks = [];
            remainingTimeMs = raceDurationMs;
            updateTimerDisplay(remainingTimeMs);
            activeAnimals = [];
            currentLeaderName = "";
            animalBanner.classList.add('hidden');
            commentaryBanner.classList.add('hidden');

            const availableVehicles = [...FLEET_VEHICLES].sort(() => 0.5 - Math.random());
            const chosenNames = Array.from(selectedStudents);

            racers = chosenNames.map((name, idx) => ({
                id: idx,
                name: name,
                emoji: availableVehicles[idx % availableVehicles.length],
                x: 0,
                y: 0,
                baseSpeed: 1.55 + Math.random() * 0.35,
                speed: 1.6,
                speedChangeTimer: 0,
                waypointIndex: 1,
                laps: 0,
                totalDistance: 0,
                laneOffset: ((idx % 5) - 2) * 0.11,
                facingRight: false,
                tiltAngle: 0,
                isStopped: false,
                stoppedByAnimal: false,
                stopEndTime: 0
            }));

            buildEmojiScenery();
            resizeAndPositionRacers();
            renderLeftPanel();
            drawTrack();
        }

        function buildEmojiScenery() {
            emojiMap = map.map(row => row.map(tile => {
                if (tile === 2) return EMOJIS.building[Math.floor(Math.random() * EMOJIS.building.length)];
                if (tile === 3) return EMOJIS.tree[Math.floor(Math.random() * EMOJIS.tree.length)];
                return null;
            }));
        }

        function resizeAndPositionRacers() {
            const container = canvas.parentElement;
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const aspect = cols / rows;

            let width = cw;
            let height = cw / aspect;
            if (height > ch) {
                height = ch;
                width = ch * aspect;
            }

            canvas.width = Math.max(360, Math.floor(width));
            canvas.height = Math.max(240, Math.floor(height));
            TILE_SIZE = canvas.width / cols;

            racers.forEach((racer, idx) => {
                const startTileX = 18.6 + (idx * 0.72);
                const startTileY = 1.5 + racer.laneOffset;
                racer.x = startTileX * TILE_SIZE;
                racer.y = startTileY * TILE_SIZE;
                racer.waypointIndex = 1;
                racer.laps = 0;
                racer.totalDistance = 0;
                racer.facingRight = false;
                racer.tiltAngle = 0;
                racer.isStopped = false;
                racer.stoppedByAnimal = false;
            });
        }

        // --- 11. RAISED LEFT COLUMN: NAME ABOVE CAR ---
        function renderLeftPanel() {
            const sorted = [...racers].sort((a, b) => b.totalDistance - a.totalDistance);

            // Trigger Brian & Andrew commentary for #1 racer when race is active
            if (gameRunning && sorted.length > 0 && performance.now() - raceStartTime > 2500) {
                announceLeaderChange(sorted[0]);
            }

            leftRacerList.innerHTML = sorted.map((r, index) => {
                const rank = index + 1;
                let badgeColor = 'bg-gray-700 text-gray-200';
                let cardBorder = 'border-gray-700 bg-gray-900/90';

                if (rank === 1) {
                    badgeColor = 'bg-yellow-400 text-gray-900';
                    cardBorder = 'border-yellow-500/80 bg-gray-900';
                } else if (rank === 2) {
                    badgeColor = 'bg-gray-300 text-gray-900';
                } else if (rank === 3) {
                    badgeColor = 'bg-amber-600 text-white';
                }

                const statusIcon = r.stoppedByAnimal ? '🐄' : (r.isStopped ? '🔴' : `L${r.laps + 1}`);

                return `
                    <div class="flex items-center justify-between px-1.5 py-0.5 rounded-lg border ${cardBorder}">
                        <div class="flex items-center gap-1.5 min-w-0">
                            <span class="w-4 h-4 rounded-full text-[10px] font-black flex items-center justify-center shrink-0 ${badgeColor}">
                                ${rank}
                            </span>
                            <!-- Name on top, Vehicle directly below Name -->
                            <div class="flex flex-col items-start leading-none min-w-0">
                                <span class="font-bold text-[11px] text-white truncate max-w-[68px]">${r.name}</span>
                                <span class="text-base mt-0.5 leading-none">${r.emoji}</span>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="text-[10px] font-extrabold text-yellow-400">${statusIcon}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- 12. ANIMAL CROSSINGS & RANDOM CAR HORNS ---
        function spawnCrossingAnimal(now) {
            const animalSpec = CROSSING_ANIMALS[Math.floor(Math.random() * CROSSING_ANIMALS.length)];
            const roadRow = horizontalRows[Math.floor(Math.random() * horizontalRows.length)];
            const roadCol = 7 + Math.floor(Math.random() * 19);
            const direction = Math.random() < 0.5 ? 1 : -1;

            activeAnimals.push({
                emoji: animalSpec.emoji,
                name: animalSpec.name,
                tileX: roadCol + 0.5,
                tileY: roadRow + 0.5 - (direction * 0.85),
                startY: roadRow + 0.5 - (direction * 0.85),
                endY: roadRow + 0.5 + (direction * 0.85),
                roadRow: roadRow,
                direction: direction,
                speed: animalSpec.speed
            });

            animalBannerIcon.textContent = animalSpec.emoji;
            animalBannerText.textContent = `${animalSpec.emoji} ${animalSpec.name} crossing! Traffic stopped!`;
            animalBanner.classList.remove('hidden');

            // Multi-horn impatient traffic jam honks!
            playVariedCarHorn();
            setTimeout(() => { if (gameRunning) playVariedCarHorn(); }, 280);
        }

        function updateAnimalsAndHorns(now) {
            if (now > nextAnimalSpawnTime && activeAnimals.length < 3) {
                spawnCrossingAnimal(now);
                nextAnimalSpawnTime = now + 4500 + Math.random() * 4500;
            }

            // Frequent randomized multi-pitched car horns while racing
            if (now > nextRandomHornTime) {
                playVariedCarHorn();
                nextRandomHornTime = now + 1800 + Math.random() * 2800;
            }

            activeAnimals.forEach(animal => {
                animal.tileY += animal.direction * animal.speed * simulationSpeed;
            });

            activeAnimals = activeAnimals.filter(a => {
                return a.direction > 0 ? a.tileY < a.endY : a.tileY > a.endY;
            });

            if (activeAnimals.length === 0) {
                animalBanner.classList.add('hidden');
            }
        }

        // --- 13. GAME LOOP & FINISH LINE CELEBRATION ---
        async function startGame() {
            if (gameRunning) return;
            await initAudioEngine();
            playStartSound();

            if (remainingTimeMs <= 0 || celebrationActive) {
                setupRacersAndTrack();
            }

            celebrationActive = false;
            fireworks = [];
            gameRunning = true;
            messageOverlay.classList.add('hidden');
            startButton.textContent = '🔄'; // Icon only for Restart
            raceStartTime = performance.now();
            nextAnimalSpawnTime = raceStartTime + 3000;
            nextRandomHornTime = raceStartTime + 1500;
            lastLeaderCalloutTime = raceStartTime;

            speakCommentary('Brian', `And they're off! Let's see who takes the early lead for Class ${currentClass}!`, true);

            startBackgroundMusic();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame(showWinnerModal = false) {
            gameRunning = false;
            stopBackgroundMusic();
            startButton.textContent = '▶️'; // Icon only for Start

            if (!showWinnerModal) {
                celebrationActive = false;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                return;
            }

            if (racers.length > 0) {
                celebrationActive = true;
                const sorted = [...racers].sort((a, b) => b.totalDistance - a.totalDistance);
                const first = sorted[0];
                const second = sorted[1];
                const third = sorted[2];

                winnerEmoji.textContent = first.emoji;
                messageTitle.textContent = `🎉 ${first.name} Wins! 🎉`;

                // Build 1st, 2nd, 3rd Podium Cards
                const podiumItems = [
                    { place: '🥇 1st', racer: first, bg: 'bg-yellow-500/20 border-yellow-400' },
                    { place: '🥈 2nd', racer: second, bg: 'bg-gray-400/20 border-gray-300' },
                    { place: '🥉 3rd', racer: third, bg: 'bg-amber-600/20 border-amber-500' }
                ].filter(item => item.racer);

                podiumDetails.innerHTML = podiumItems.map(item => `
                    <div class="border ${item.bg} rounded-xl p-2.5 text-center flex flex-col items-center">
                        <span class="text-xs font-black uppercase text-gray-200">${item.place}</span>
                        <span class="text-3xl my-1">${item.racer.emoji}</span>
                        <span class="font-extrabold text-sm text-white truncate w-full">${item.racer.name}</span>
                        <span class="text-[11px] text-yellow-300 font-semibold">${item.racer.laps} Laps</span>
                    </div>
                `).join('');

                messageOverlay.classList.remove('hidden');
                playWinFanfare();
                launchFireworkBurst();
                setTimeout(launchFireworkBurst, 300);
                setTimeout(launchFireworkBurst, 600);

                // Brian & Andrew announce 1st, 2nd, and 3rd place!
                announceWinnersPodium(sorted);
            }
        }

        function updateTimerDisplay(ms) {
            const clamped = Math.max(0, Math.ceil(ms / 1000));
            const mins = Math.floor(clamped / 60);
            const secs = clamped % 60;
            raceTimerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function update(now) {
            if (!gameRunning) return;

            const elapsed = now - raceStartTime;
            remainingTimeMs = raceDurationMs - elapsed;
            updateTimerDisplay(remainingTimeMs);

            if (remainingTimeMs <= 0) {
                updateTimerDisplay(0);
                endGame(true);
                return;
            }

            updateAnimalsAndHorns(now);

            racers.forEach(racer => {
                const racerTileX = racer.x / TILE_SIZE;
                const racerTileY = racer.y / TILE_SIZE;

                const blockingAnimal = activeAnimals.find(a => {
                    const sameRow = Math.abs(racerTileY - (a.roadRow + 0.5)) < 0.65;
                    const distX = Math.abs(racerTileX - a.tileX);
                    return sameRow && distX < 1.35;
                });

                if (blockingAnimal) {
                    if (!racer.stoppedByAnimal && Math.random() < 0.35) {
                        playVariedCarHorn();
                    }
                    racer.stoppedByAnimal = true;
                    return;
                } else {
                    racer.stoppedByAnimal = false;
                }

                if (racer.isStopped) {
                    if (now > racer.stopEndTime) {
                        racer.isStopped = false;
                    } else {
                        return;
                    }
                }

                if (now > racer.speedChangeTimer) {
                    racer.speed = racer.baseSpeed * (0.75 + Math.random() * 0.55);
                    racer.speedChangeTimer = now + 1400 + Math.random() * 1800;
                }

                const targetNode = lapWaypoints[racer.waypointIndex];
                const targetX = (targetNode.x + 0.5 + racer.laneOffset) * TILE_SIZE;
                const targetY = (targetNode.y + 0.5 + racer.laneOffset) * TILE_SIZE;

                const dx = targetX - racer.x;
                const dy = targetY - racer.y;
                const dist = Math.hypot(dx, dy);
                const step = (racer.speed * simulationSpeed) * (TILE_SIZE / 34);

                // Ensure front hood always points forward in direction of travel
                if (Math.abs(dx) > Math.abs(dy)) {
                    racer.facingRight = dx > 0;
                    racer.tiltAngle = 0;
                } else {
                    racer.facingRight = false;
                    racer.tiltAngle = dy > 0 ? -0.35 : 0.35;
                }

                if (dist <= step) {
                    racer.x = targetX;
                    racer.y = targetY;
                    racer.totalDistance += dist / TILE_SIZE;

                    if (trafficLightWaypoints.includes(racer.waypointIndex) && Math.random() < 0.18) {
                        racer.isStopped = true;
                        racer.stopEndTime = now + 800 + Math.random() * 1100;
                    }

                    const prevWaypoint = racer.waypointIndex;
                    racer.waypointIndex = (racer.waypointIndex + 1) % lapWaypoints.length;

                    if (prevWaypoint === 0) {
                        racer.laps++;
                        playLapSound();
                    }
                } else {
                    racer.x += (dx / dist) * step;
                    racer.y += (dy / dist) * step;
                    racer.totalDistance += step / TILE_SIZE;
                }
            });

            renderLeftPanel();
        }

        // --- 14. RENDER TRACK, ANIMALS, VEHICLES & FIREWORKS ---
        function drawTrack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const tile = map[y][x];
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;

                    if (tile === 1 || tile === 4) {
                        ctx.fillStyle = '#4b5563';
                        ctx.fillRect(px, py, TILE_SIZE + 0.5, TILE_SIZE + 0.5);

                        ctx.fillStyle = '#9ca3af';
                        ctx.fillRect(px + TILE_SIZE * 0.38, py + TILE_SIZE * 0.47, TILE_SIZE * 0.22, TILE_SIZE * 0.06);
                    } else {
                        ctx.fillStyle = '#4d8a3b';
                        ctx.fillRect(px, py, TILE_SIZE + 0.5, TILE_SIZE + 0.5);
                    }

                    const centerX = px + TILE_SIZE / 2;
                    const centerY = py + TILE_SIZE / 2;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    if (tile === 2 || tile === 3) {
                        ctx.font = `${TILE_SIZE * 0.72}px sans-serif`;
                        ctx.fillText(emojiMap[y][x], centerX, centerY);
                    } else if (tile === 4) {
                        ctx.fillStyle = '#facc15';
                        ctx.fillRect(px, py, TILE_SIZE * 0.2, TILE_SIZE);
                        ctx.font = `${TILE_SIZE * 0.78}px sans-serif`;
                        ctx.fillText(EMOJIS.finish, centerX, centerY);
                    }
                }
            }

            // Traffic Lights
            ctx.font = `${TILE_SIZE * 0.48}px sans-serif`;
            trafficLightWaypoints.forEach(wpIdx => {
                const node = lapWaypoints[wpIdx];
                const lx = (node.x + 0.5) * TILE_SIZE;
                const ly = (node.y + 0.5) * TILE_SIZE;
                const anyoneStopped = racers.some(r => r.isStopped && r.waypointIndex === (wpIdx + 1) % lapWaypoints.length);
                ctx.fillText(anyoneStopped ? '🔴' : '🟢', lx, ly - TILE_SIZE * 0.35);
            });

            // Active Animal Crossings
            activeAnimals.forEach(animal => {
                const ax = animal.tileX * TILE_SIZE;
                const ay = animal.tileY * TILE_SIZE;
                const roadCenterY = (animal.roadRow + 0.5) * TILE_SIZE;

                ctx.fillStyle = 'rgba(250, 204, 21, 0.55)';
                for (let s = -0.35; s <= 0.35; s += 0.22) {
                    ctx.fillRect(ax - TILE_SIZE * 0.35, roadCenterY + s * TILE_SIZE, TILE_SIZE * 0.7, TILE_SIZE * 0.1);
                }

                ctx.font = `${TILE_SIZE * 0.45}px sans-serif`;
                ctx.fillText('⚠️', ax, roadCenterY - TILE_SIZE * 0.55);

                ctx.font = `${TILE_SIZE * 0.85}px sans-serif`;
                ctx.fillText(animal.emoji, ax, ay);
            });

            // Racers (Vehicles ONLY — No names on track)
            racers.forEach(racer => {
                ctx.save();
                ctx.translate(racer.x, racer.y);

                if (racer.facingRight) {
                    ctx.scale(-1, 1);
                }
                if (racer.tiltAngle !== 0) {
                    ctx.rotate(racer.tiltAngle);
                }

                ctx.font = `${TILE_SIZE * 0.78}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(racer.emoji, 0, 0);
                ctx.restore();

                if (racer.stoppedByAnimal) {
                    ctx.font = `${TILE_SIZE * 0.4}px sans-serif`;
                    ctx.fillText('🛑', racer.x, racer.y - TILE_SIZE * 0.48);
                }
            });

            // Render Fireworks Overlay on Canvas
            if (celebrationActive || fireworks.length > 0) {
                updateAndDrawFireworks();
            }
        }

        function gameLoop(now) {
            if (gameRunning) {
                update(now);
            }
            drawTrack();
            if (gameRunning || celebrationActive || fireworks.length > 0) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        // --- 15. EVENT LISTENERS ---
        startButton.addEventListener('click', () => {
            if (gameRunning) {
                setupRacersAndTrack();
            }
            startGame();
        });

        backButton.addEventListener('click', () => {
            endGame(false);
            gameScreen.classList.add('hidden');
            selectionScreen.classList.remove('hidden');
        });

        overlayRestartBtn.addEventListener('click', () => {
            messageOverlay.classList.add('hidden');
            setupRacersAndTrack();
            startGame();
        });

        overlayRosterBtn.addEventListener('click', () => {
            messageOverlay.classList.add('hidden');
            endGame(false);
            gameScreen.classList.add('hidden');
            selectionScreen.classList.remove('hidden');
        });

        speedSlider.addEventListener('input', (e) => {
            simulationSpeed = parseFloat(e.target.value);
        });

        window.addEventListener('resize', () => {
            if (!gameScreen.classList.contains('hidden')) {
                resizeAndPositionRacers();
                drawTrack();
            }
        });

        // Initial Boot
        renderStudentGrid();
    </script>
</body>
</html>
